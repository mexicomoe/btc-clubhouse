<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>TGIF · Team maker</title>
<!--
  THE TEAM MAKER. Rob opens it on Monday, taps one button, and pastes the
  names into the Players tab at A4.

  It reads the ROLL CALL feed — who said yes this week — and never the Index
  feed. The Index feed is built FROM Players, and Players is what this page
  fills in: on Monday it still holds last week's men.

  It never writes to the sheet. It reads a feed and hands Rob text.
-->
<style>
:root{
  --ink:#000;
  --paper:#fff;
  --quiet:#444;
  --sel:#ffe9d6;
  --selink:#8a3b00;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;overflow-x:hidden;background:var(--paper);color:var(--ink);}
body{
  font:600 19px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%;
  padding:0 16px env(safe-area-inset-bottom) 16px;
  max-width:560px;margin:0 auto;
}
h1{font-size:26px;margin:14px 0 4px;}
p{margin:.6em 0;font-size:19px;}
.hide{display:none !important;}
#status{font-size:19px;}
#status.bad{font-weight:800;}
#who{font-size:18px;font-weight:600;color:var(--quiet);margin:4px 0 12px;}
button{font:inherit;cursor:pointer;}
button.big{
  display:block;width:100%;min-height:56px;margin:12px 0;
  font-size:21px;font-weight:800;border:3px solid var(--ink);border-radius:8px;
  background:var(--ink);color:var(--paper);
}
button.big.plain{background:var(--paper);color:var(--ink);}
.team{margin:16px 0;border:3px solid var(--ink);border-radius:8px;overflow:hidden;}
.team h2{margin:0;padding:8px 10px;font-size:21px;background:var(--ink);color:var(--paper);
  display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
.team h2 span{font-size:18px;font-weight:700;white-space:nowrap;}
.seat{display:flex;align-items:stretch;border-top:2px solid var(--ink);}
.seat:first-of-type{border-top:0;}
.seat .lab{width:34px;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:19px;font-weight:800;border-right:2px solid var(--ink);}
.seat button.man{flex:1;min-width:0;min-height:48px;text-align:left;padding:6px 8px;
  border:0;background:var(--paper);color:var(--ink);font-size:19px;font-weight:700;
  display:flex;justify-content:space-between;align-items:center;gap:8px;}
.seat button.man .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.seat button.man .ix{flex:none;font-size:18px;font-weight:600;}
.seat button.man.sel{background:var(--sel);color:var(--selink);}
.seat button.man.blind{font-style:italic;color:var(--quiet);}
.seat button.lock{width:76px;padding:0 4px;flex:none;min-height:48px;border:0;border-left:2px solid var(--ink);
  background:var(--paper);color:var(--ink);font-size:18px;font-weight:800;}
.seat button.lock[aria-pressed="true"]{background:var(--ink);color:var(--paper);}
#notes p{font-size:18px;}
#copied{font-size:19px;font-weight:800;}
</style>
</head>
<body>

<h1>Make the teams</h1>
<p id="status">Reading who said yes…</p>
<div id="who"></div>

<button id="make" class="big hide">Make the teams</button>

<div id="teamsBox"></div>
<div id="notes"></div>

<div id="after" class="hide">
  <button id="again" class="big plain">Make the teams again</button>
  <p style="font-size:18px">Tap two names to swap them. Tap <b>Lock</b> to keep a man on his team when you make them again.</p>
  <p id="clearFirst"><b>Select A4:A27 in Players, press Delete, then click in A4 and paste.</b></p>
  <button id="copy" class="big">Copy for the Players tab</button>
  <p id="copied"></p>
</div>

<script>
"use strict";

/**
 * WHO SAID YES — the "Playing feed" tab (gid 1365054493), drawn from Roll call:
 * name,index,tee for each man who answered YES. NOT the Index feed (gid
 * 1116052183): that one follows Players, which is what this page fills, so on
 * a Monday it still holds last week's men.
 */
var ROLL_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQg-44HCczcIAcyn9_osr4HvnniZba5IV9wKlf-uNFjz_CaGDcYRnqYVz_n4L7dsPdcUJkynwk7lx4d/pub?gid=1365054493&single=true&output=csv";

/**
 * WHO PLAYED WITH WHOM — the "Pairs log" tab, published as CSV. Row 1 is the
 * round date, one column per round, newest to the right; rows 2-25 are the
 * 24 Players seats for that round, raw names, teams the blocks of four.
 *
 * THIS SHEET IS THE ONLY SOURCE OF HISTORY. The page used to remember past
 * weeks in the browser (localStorage), and that is why the rule failed: Rob
 * made teams on a different device and the page had no history at all. Do
 * not put localStorage back, as a cache, a fallback or anything else.
 */
var PAIRS_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQg-44HCczcIAcyn9_osr4HvnniZba5IV9wKlf-uNFjz_CaGDcYRnqYVz_n4L7dsPdcUJkynwk7lx4d/pub?gid=995129212&single=true&output=csv";

/** Six blocks of four: Seats rows 35-58, six team-board rows, 24 Players slots. */
var MAX_TEAMS = 6;
/** How far the repeat preference may trade away evenness, in index strokes. Evenness comes first. */
var EVEN_SLACK = 0.5;
/**
 * THE CEILING ON THE PAIR RULE, in strokes between heaviest and lightest
 * team. Splitting a barred pair may cost evenness up to here and no further:
 * past it the pair is allowed and the screen says so. Balanced teams come in
 * near 0.6; a fairness rule with no ceiling once gave twelve men 6.5.
 */
var MAX_DRIFT = 2.0;
/** Fresh random starts per tap, each improved by swaps until no swap helps. */
var TRIES = 300;

/* ---------- reading the feed ---------- */

/** RFC 4180-ish: quoted fields, doubled quotes, a comma inside "Surname, First". */
function parseCsv(text){
  var rows=[],row=[],field="",quoted=false,i;
  text = String(text||"").replace(/\r\n/g,"\n").replace(/\r/g,"\n");
  for(i=0;i<text.length;i++){
    var c=text[i];
    if(quoted){
      if(c==='"'){ if(text[i+1]==='"'){field+='"';i++;} else quoted=false; }
      else field+=c;
    } else if(c==='"'){ quoted=true; }
    else if(c===","){ row.push(field);field=""; }
    else if(c==="\n"){ row.push(field);field="";rows.push(row);row=[]; }
    else field+=c;
  }
  row.push(field);
  if(row.length>1||row[0]!=="") rows.push(row);
  return rows;
}

/** A golf index as written: "23.5", or "+1.2" for a plus man, who is BETTER than scratch. */
function parseIndex(v){
  var s=String(v==null?"":v).trim();
  if(s==="") return null;
  var plus=s.charAt(0)==="+";
  var n=parseFloat(plus?s.slice(1):s);
  if(isNaN(n)) return null;
  return plus?-n:n;
}

/**
 * THE ROLL CALL, AS MEN. Columns are found by heading, not position. Blank
 * names and BLINDs are skipped — BLIND is this page's to place, not the
 * feed's. A name twice is kept once and reported, never silently.
 */
function parseRoll(text){
  var rows=parseCsv(text),head=-1,i,cn=-1,ci=-1,ct=-1;
  for(i=0;i<rows.length&&head<0;i++){
    var low=rows[i].map(function(x){ return String(x).trim().toLowerCase(); });
    if(low.indexOf("name")>-1){ head=i; cn=low.indexOf("name"); ci=low.indexOf("index"); ct=low.indexOf("tee"); }
  }
  if(head<0) return {ok:false,men:[],twice:[],noIndex:[]};
  var men=[],seen={},twice=[],noIndex=[];
  for(i=head+1;i<rows.length;i++){
    var r=rows[i],name=String(r[cn]==null?"":r[cn]).trim();
    if(name===""||name.toUpperCase()==="BLIND") continue;
    if(seen[name]){ twice.push(name); continue; }
    seen[name]=true;
    var ix=ci<0?null:parseIndex(r[ci]);
    if(ix===null) noIndex.push(name);
    men.push({name:name,index:ix,tee:ct<0?"":String(r[ct]==null?"":r[ct]).trim()});
  }
  return {ok:true,men:men,twice:twice,noIndex:noIndex};
}

/* ---------- making the teams ---------- */

/** Men divided by four, rounded up. Zero when there is nobody. */
function teamCount(n){ return Math.ceil(n/4); }

/**
 * THE FIELD, LOWEST INDEX FIRST, then a BLIND for each empty seat. A man with
 * no index goes after every man with one: he is placed, never dropped.
 */
function dealOrder(men){
  var t=teamCount(men.length),out=men.slice().sort(function(a,b){
    var ai=a.index==null?Infinity:a.index,bi=b.index==null?Infinity:b.index;
    return ai!==bi?ai-bi:(a.name<b.name?-1:a.name>b.name?1:0);
  }),k;
  for(k=men.length;k<t*4;k++) out.push({name:"BLIND",index:null,tee:"",blind:true});
  return out;
}

/** One man's team total: the men's indexes, BLINDs and missing indexes as nothing. */
function teamTotal(team){
  var s=0,i;
  for(i=0;i<team.length;i++) if(!team[i].blind&&team[i].index!=null) s+=team[i].index;
  return Math.round(s*10)/10;
}

/**
 * A TEAM'S WEIGHT, MAN FOR MAN: its men's average index, times four. For a
 * team of four men it is simply the total. For a team with a BLIND it is what
 * the total would be with a fourth man like the other three — so a team is
 * not counted "light" just for having a BLIND, and the evening-out does not
 * pile the strong men onto the one full team to make up for it.
 *
 * MEASURED, NOT ASSUMED: over 160 real player-rounds on Rob's course at index
 * 19+, best 2 net balls of four men averaged 135.4 and of three men plus a
 * BLIND on net par 135.5; head to head a BLIND team won 43, tied 15, lost 43
 * per 100. A BLIND is worth an average man. Do not weaken BLIND teams.
 */
function teamWeight(team){
  var s=0,n=0,i;
  for(i=0;i<team.length;i++) if(!team[i].blind&&team[i].index!=null){ s+=team[i].index; n++; }
  return n?s/n*4:0;
}

/** The gap between the heaviest and lightest team, man for man. */
function spread(teams){
  var t=teams.map(teamWeight);
  return Math.round((Math.max.apply(null,t)-Math.min.apply(null,t))*10)/10;
}

/** A, B, C, D: lowest index first, BLINDs last. This is the order Copy uses. */
function seatOrder(team){
  return team.slice().sort(function(a,b){
    if(!!a.blind!==!!b.blind) return a.blind?1:-1;
    var ai=a.index==null?Infinity:a.index,bi=b.index==null?Infinity:b.index;
    return ai!==bi?ai-bi:(a.name<b.name?-1:a.name>b.name?1:0);
  });
}

/**
 * WHY THERE IS NO "ONE MAN FROM EACH QUARTER" RULE. The first version dealt a
 * snake — 1-2-3-4, 4-3-2-1 — so every team had one man from each quarter of
 * the field. That balances the SHAPE of a team, not its strength, and it comes
 * apart the moment one man sits far out at either end. Rob has had a man at
 * 38.9 for three years, eleven strokes above the next: on the real field of 23
 * October the quarter rule could do no better than 6.5 strokes between teams,
 * where 0.6 was available by putting him with the three lowest men. So the
 * only rule is the most even team totals. Do not put the quarter rule back.
 */

/**
 * WHAT DOES NOT MOVE: locked men on their teams, then the BLINDs, one per team
 * (to the team with fewest BLINDs, then fewest seats taken). Everything else
 * is `free`, to be seated by the search.
 */
function seatFixed(deal,T,locks){
  var teams=[],free=[],fixed=[],blind=[],i;
  for(i=0;i<T;i++){ teams.push([]); blind.push(0); fixed.push([]); }
  for(i=0;i<deal.length;i++){
    var m=deal[i],lt=m.blind?undefined:locks[m.name];
    if(lt!=null&&lt<T&&teams[lt].length<4){ teams[lt].push(m); fixed[lt].push(m); }
    else if(!m.blind) free.push(m);
  }
  for(i=0;i<deal.length;i++){
    if(!deal[i].blind) continue;
    var best=-1,t;
    for(t=0;t<T;t++) if(teams[t].length<4&&(best<0||blind[t]<blind[best]||(blind[t]===blind[best]&&teams[t].length<teams[best].length))) best=t;
    teams[best].push(deal[i]); fixed[best].push(deal[i]); blind[best]++;
  }
  return {teams:teams,free:free};
}

/** The free men, shuffled, into the empty seats. */
function fillSeats(fixed,free,rand){
  var teams=fixed.map(function(t){ return t.slice(); }),men=free.slice(),i,t=0;
  for(i=men.length-1;i>0;i--){ var j=Math.floor(rand()*(i+1)),x=men[i]; men[i]=men[j]; men[j]=x; }
  for(i=0;i<men.length;i++){ while(teams[t].length>=4) t++; teams[t].push(men[i]); }
  return teams;
}

/** How uneven, as a pair: the gap first, then the spread of all teams to break ties. */
function unevenness(teams){
  var w=teams.map(teamWeight),mean=0,v=0,i;
  for(i=0;i<w.length;i++) mean+=w[i]/w.length;
  for(i=0;i<w.length;i++) v+=(w[i]-mean)*(w[i]-mean);
  return [Math.max.apply(null,w)-Math.min.apply(null,w),v];
}
/** Is cost a lower than cost b, compared first item first? */
function lessUneven(a,b){
  for(var i=0;i<a.length;i++){
    if(a[i]<b[i]-1e-9) return true;
    if(a[i]>b[i]+1e-9) return false;
  }
  return false;
}

/**
 * IMPROVE BY SWAPS. Trade any two men on different teams whenever it makes
 * the teams more even, until no trade does. Locked men and BLINDs never move.
 * Given `bar` (from barTable), fewer barred pairs together comes before evenness.
 */
function climb(teams,fixedSet,bar){
  var cost=function(ts){ var u=unevenness(ts); return bar?[barredIn(ts,bar)].concat(u):u; };
  var cur=cost(teams),better=true,a,b,i,j,pass=0;
  while(better&&pass++<60){
    better=false;
    for(a=0;a<teams.length;a++) for(b=a+1;b<teams.length;b++)
      for(i=0;i<teams[a].length;i++) for(j=0;j<teams[b].length;j++){
        var x=teams[a][i],y=teams[b][j];
        if(fixedSet.indexOf(x)>-1||fixedSet.indexOf(y)>-1) continue;
        teams[a][i]=y; teams[b][j]=x;
        var u=cost(teams);
        if(lessUneven(u,cur)){ cur=u; better=true; }
        else { teams[a][i]=x; teams[b][j]=y; }
      }
  }
  return teams;
}

/** A name as the log and the feed are matched: spaces tidied, case ignored. */
function nameKey(s){ return String(s==null?"":s).trim().replace(/\s+/g," ").toLowerCase(); }

/** Every pair of real men on one team, as "name|name" (matched form) in name order. */
function pairKeys(teams){
  var out=[],t,i,j;
  for(t=0;t<teams.length;t++){
    var real=teams[t].filter(function(m){ return !m.blind; }).map(function(m){ return nameKey(m.name); }).sort();
    for(i=0;i<real.length;i++) for(j=i+1;j<real.length;j++) out.push(real[i]+"|"+real[j]);
  }
  return out;
}

function repeatsIn(teams,recent){
  return pairKeys(teams).filter(function(p){ return recent[p]; }).length;
}

/**
 * THE BARRED PAIRS AS A LOOKUP by the men's own names, so the swap search can
 * count them without building a name key thousands of times a tap.
 */
function barTable(men,barred){
  var bar={},i,j;
  for(i=0;i<men.length;i++) for(j=0;j<men.length;j++)
    if(i!==j&&barred[[nameKey(men[i].name),nameKey(men[j].name)].sort().join("|")]){
      (bar[men[i].name]=bar[men[i].name]||{})[men[j].name]=true;
    }
  return bar;
}
function barredIn(teams,bar){
  var n=0,t,i,j;
  for(t=0;t<teams.length;t++) for(i=0;i<teams[t].length;i++){
    var b=teams[t][i].blind?null:bar[teams[t][i].name];
    if(b) for(j=i+1;j<teams[t].length;j++) if(b[teams[t][j].name]) n++;
  }
  return n;
}

/* ---------- the Pairs log ---------- */

/**
 * A ROUND DATE as the sheet may publish it: 2026-10-23, 10/23/2026, or
 * "Oct 23, 2026". Anything without a four-digit year is not trusted.
 * Returns "YYYY-MM-DD" or null.
 */
function parseLogDate(v){
  var s=String(v==null?"":v).trim(),m,y,mo,d;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))){ y=+m[1]; mo=+m[2]; d=+m[3]; }
  else if((m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/))){ y=+m[3]; mo=+m[1]; d=+m[2]; }
  else if(/\b\d{4}\b/.test(s)&&!isNaN(Date.parse(s))){ var t=new Date(s); y=t.getFullYear(); mo=t.getMonth()+1; d=t.getDate(); }
  else return null;
  if(mo<1||mo>12||d<1||d>31) return null;
  return y+"-"+(mo<10?"0":"")+mo+"-"+(d<10?"0":"")+d;
}

/**
 * THE LOG, AS ROUNDS. One column per round: its date on row 1, then rows
 * 2-25 as six teams of four (2-5, 6-9, ... 22-25). Blanks and BLINDs are not
 * partners and are dropped. A column whose date can't be read is left out
 * and reported, never guessed at. Oldest round first; a date twice keeps the
 * rightmost column.
 */
function parsePairsLog(text){
  var rows=parseCsv(text),head=rows[0]||[],byWeek={},bad=[],c,r,cols=0;
  for(r=0;r<rows.length;r++) cols=Math.max(cols,rows[r].length);
  for(c=0;c<cols;c++){
    var teams=[],any=false;
    for(r=1;r<=24;r++){
      var name=String((rows[r]||[])[c]==null?"":rows[r][c]).trim().replace(/\s+/g," ");
      var t=Math.floor((r-1)/4); if(!teams[t]) teams[t]=[];
      if(name===""||/^blind\b/i.test(name)) continue;
      teams[t].push(name); any=true;
    }
    if(!any) continue;
    var week=parseLogDate(head[c]);
    if(!week){ if(/\d/.test(String(head[c]||""))) bad.push(String(head[c]).trim()); continue; }
    byWeek[week]=teams;
  }
  var rounds=Object.keys(byWeek).sort().map(function(w){ return {week:w,teams:byWeek[w]}; });
  return {rounds:rounds,bad:bad};
}

/**
 * WHAT THE LOG MEANS FOR THIS WEEK. Only rounds dated before this Friday
 * count: Rob logs on Monday for the round still to come, so a column dated
 * this Friday or later is an unplayed round, never "last week". Only pairs
 * of two men both playing this week matter.
 *
 *  · recent — together in either of the last two rounds: the soft preference.
 *  · barred — together in BOTH of the last two: the rule. One week is fine.
 *  · weeks  — for each recent pair, how many weeks running it would be if
 *             they were together again this week, read as far back as the
 *             log goes. Used only to say so on screen.
 */
function pairHistory(rounds,week,men){
  var here={},played=[],i,j;
  for(i=0;i<men.length;i++) here[nameKey(men[i].name)]=true;
  for(i=0;i<(rounds||[]).length;i++) if(rounds[i]&&rounds[i].week<week) played.push(rounds[i]);
  var sets=played.map(function(r){
    var s={},keys=pairKeys((r.teams||[]).map(function(t){ return t.map(function(n){ return {name:n}; }); }));
    for(var k=0;k<keys.length;k++){ var p=keys[k].split("|"); if(here[p[0]]&&here[p[1]]) s[keys[k]]=true; }
    return s;
  });
  var n=sets.length,recent={},barred={},weeks={};
  for(i=Math.max(0,n-2);i<n;i++) for(var k in sets[i]) recent[k]=true;
  if(n>=2) for(var b in sets[n-1]) if(sets[n-2][b]) barred[b]=true;
  for(var p in recent){ var w=1; for(j=n-1;j>=0&&sets[j][p];j--) w++; weeks[p]=w; }
  return {recent:recent,barred:barred,weeks:weeks,rounds:played.slice(-2).map(function(r){ return r.week; })};
}

/**
 * MAKE THE TEAMS. TRIES fresh random starts, each improved by swaps until no
 * swap helps. In order:
 *
 *  1. THE PAIR RULE — fewest barred pairs together, but only among teams
 *     within MAX_DRIFT strokes (or within EVEN_SLACK of the most even, if
 *     even that is wider). Past the ceiling, balance wins and the pair is
 *     allowed. Locks win too.
 *  2. EVENNESS — within EVEN_SLACK of the most even left.
 *  3. RECENT PARTNERS — fewest repeats of the last two rounds' pairings.
 *
 * It never refuses: every barred pair it had to allow comes back in
 * `allowed`, with why. `again` picks at random among the best, so a second
 * tap gives a different answer. Any man may move anywhere except a locked one.
 */
function makeTeams(men,opts){
  opts=opts||{};
  var T=teamCount(men.length);
  if(T===0) return {teams:[],repeats:0,recent:0,allowed:{}};
  var deal=dealOrder(men),locks=opts.locks||{},rand=opts.rand||Math.random;
  var ph=opts.pairs||{},recent=ph.recent||{},barred=ph.barred||{},nRecent=Object.keys(recent).length;
  var bar=Object.keys(barred).length?barTable(men,barred):null;
  var seated=seatFixed(deal,T,locks),fixedSet=[],i,t;
  for(t=0;t<T;t++) for(i=0;i<seated.teams[t].length;i++) fixedSet.push(seated.teams[t][i]);
  var all=[],tries=Math.max(1,opts.tries==null?TRIES:opts.tries);
  var keep=function(ts){ var c=ts.map(seatOrder); all.push({teams:c,b:repeatsIn(c,barred),r:repeatsIn(c,recent),s:spread(c)}); };
  for(i=0;i<tries;i++){
    var start=fillSeats(seated.teams,seated.free,rand);
    if(bar) keep(climb(start.map(function(x){ return x.slice(); }),fixedSet,bar));
    keep(climb(start,fixedSet));
  }
  var min=function(xs,f){ return Math.min.apply(null,xs.map(f)); };
  var cap=Math.max(MAX_DRIFT,min(all,function(c){ return c.s; })+EVEN_SLACK);
  var cands=all.filter(function(c){ return c.s<=cap+1e-9; });
  var bestB=min(cands,function(c){ return c.b; });
  cands=cands.filter(function(c){ return c.b===bestB; });
  var limit=min(cands,function(c){ return c.s; })+EVEN_SLACK;
  cands=cands.filter(function(c){ return c.s<=limit+1e-9; });
  var bestR=min(cands,function(c){ return c.r; });
  var best=cands.filter(function(c){ return c.r===bestR; });
  var pick;
  if(opts.again){
    var key=function(ts){ return pairKeys(ts).sort().join(","); };
    var fresh=best.filter(function(c){ return !opts.current||key(c.teams)!==key(opts.current); });
    var pool=fresh.length?fresh:best;
    pick=pool[Math.floor(rand()*pool.length)];
  } else {
    pick=best.slice().sort(function(a,b){ return a.s-b.s; })[0];
  }
  // Why each barred pair still together is there: both locked on one team,
  // or splitting it was only found past the ceiling, or not found at all.
  var lockedKeys={},allowed={},past=min(all,function(c){ return c.b; })<bestB;
  pairKeys(seated.teams.map(function(tm){ return tm.filter(function(m){ return !m.blind&&locks[m.name]!=null; }); }))
    .forEach(function(k){ lockedKeys[k]=true; });
  pairKeys(pick.teams).forEach(function(k){
    if(barred[k]) allowed[k]=lockedKeys[k]?"lock":past?"balance":"stuck";
  });
  return {teams:pick.teams,repeats:pick.r,recent:nRecent,allowed:allowed};
}

/** Swap two men between (or within) teams, then re-letter both teams. */
function swapMen(teams,a,b){
  var out=teams.map(function(t){ return t.slice(); });
  var x=out[a.team][a.seat],y=out[b.team][b.seat];
  out[a.team][a.seat]=y; out[b.team][b.seat]=x;
  out[a.team]=seatOrder(out[a.team]);
  if(b.team!==a.team) out[b.team]=seatOrder(out[b.team]);
  return out;
}

/* ---------- the paste ---------- */

/**
 * WHAT GOES IN COLUMN A. Team then seat, A to D, one per line, exactly as the
 * feed spelled each man — the sheet matches names against the Roster. ALWAYS
 * 24 lines: a blank line for every unused seat. That is a backstop only —
 * whether a pasted blank clears a cell is not relied on. The screen tells Rob
 * to clear A4:A27 first, which is what guarantees last week's men are gone.
 */
function copyText(teams){
  var lines=[],t,i;
  for(t=0;t<MAX_TEAMS;t++) for(i=0;i<4;i++){
    var m=teams[t]&&teams[t][i];
    lines.push(m?m.name:"");
  }
  return lines.join("\n");
}

/** The Friday these teams are for, in Florida: the next one, and a week on if today is Friday. */
function weekKey(now){
  var parts=new Intl.DateTimeFormat("en-US",{timeZone:"America/New_York",year:"numeric",month:"2-digit",day:"2-digit",weekday:"short"})
    .formatToParts(now||new Date()),p={},i;
  for(i=0;i<parts.length;i++) p[parts[i].type]=parts[i].value;
  var dow=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].indexOf(p.weekday);
  var ahead=(5-dow+7)%7||7;
  var d=new Date(Date.UTC(+p.year,+p.month-1,+p.day+ahead));
  return d.toISOString().slice(0,10);
}

/* ---------- what the history says, in words ---------- */

/** "2026-10-23" as "23 Oct". */
function shortDate(w){
  return +w.slice(8,10)+" "+["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+w.slice(5,7)-1];
}
function ordinal(n){
  var t=n%100,s=(t>=11&&t<=13)?"th":["th","st","nd","rd"][n%10]||"th";
  return n+s;
}

/**
 * WHICH ROUNDS WERE READ — the staleness guard. If Rob forgets to log a week
 * this line shows an old date, where the browser memory used to fail silently.
 */
function historyLine(log,ph){
  if(!log||log.state==="unset") return "History: the Pairs log address isn't set yet, so no history was used.";
  if(log.state==="fail") return "Couldn't read the Pairs log, so no history was used. The teams are even; partners weren't checked.";
  var r=ph.rounds,out;
  if(r.length===0) out="History: no rounds in the Pairs log before this Friday, so no history was used.";
  else if(r.length===1) out="History: round of "+shortDate(r[0])+" only. The two-week rule needs two.";
  else out="History: rounds of "+shortDate(r[0])+" and "+shortDate(r[1])+".";
  if(log.bad&&log.bad.length) out+=" Couldn't read the date on "+(log.bad.length===1?"one column":log.bad.length+" columns")+
    " of the Pairs log ("+log.bad.join("; ")+"), so "+(log.bad.length===1?"it was":"they were")+" left out.";
  return out;
}

/**
 * EVERY BARRED PAIR ON THE TEAMS AS THEY STAND, in words — after a hand swap
 * too. `why` is makeTeams' reason; a pair it didn't make was put there by
 * hand, unless both men are locked on that team.
 */
function allowedLines(teams,ph,why,locks){
  var shown={},out=[],t,i,j;
  for(t=0;t<teams.length;t++){
    var real=teams[t].filter(function(m){ return !m.blind; });
    for(i=0;i<real.length;i++) for(j=i+1;j<real.length;j++){
      var a=real[i],b=real[j],k=[nameKey(a.name),nameKey(b.name)].sort().join("|");
      if(!ph.barred[k]||shown[k]) continue;
      shown[k]=true;
      var w=locks&&locks[a.name]===t&&locks[b.name]===t?"lock":(why&&why[k])||"hand";
      out.push("Had to allow "+a.name+" & "+b.name+" — together a "+ordinal(ph.weeks[k]||3)+" week running, "+({
        lock:"because both are locked on this team.",
        balance:"because splitting them pushed the gap past "+MAX_DRIFT.toFixed(1)+" strokes.",
        stuck:"because no way to split them was found.",
        hand:"because they were swapped together by hand."
      })[w]);
    }
  }
  return out;
}

/* ---------- the screen ---------- */

var S={men:[],teams:[],locks:{},sel:null,result:null,log:null,ph:null};
var $=function(id){ return document.getElementById(id); };
var fmt=function(v){ return v==null?"no index":(v<0?"+"+(-v).toFixed(1):v.toFixed(1)); };

function say(text,bad){ $("status").textContent=text; $("status").classList.toggle("bad",!!bad); }

function drawTeams(){
  var box=$("teamsBox"); box.textContent="";
  S.teams.forEach(function(team,ti){
    var wrap=document.createElement("div"); wrap.className="team";
    var h=document.createElement("h2");
    var real=team.filter(function(m){ return !m.blind; }).length;
    h.innerHTML="Team "+(ti+1)+" <span>total "+teamTotal(team).toFixed(1)+
      " · avg "+(teamWeight(team)/4).toFixed(1)+(real<4?" · "+real+" men":"")+"</span>";
    wrap.appendChild(h);
    team.forEach(function(m,si){
      var row=document.createElement("div"); row.className="seat";
      var lab=document.createElement("div"); lab.className="lab"; lab.textContent="ABCD".charAt(si); row.appendChild(lab);
      var b=document.createElement("button"); b.type="button"; b.className="man"+(m.blind?" blind":"");
      if(S.sel&&S.sel.team===ti&&S.sel.seat===si) b.className+=" sel";
      var nm=document.createElement("span"); nm.className="nm"; nm.textContent=m.name; b.appendChild(nm);
      var ix=document.createElement("span"); ix.className="ix"; ix.textContent=m.blind?"":fmt(m.index); b.appendChild(ix);
      b.addEventListener("click",function(){
        if(!S.sel){ S.sel={team:ti,seat:si}; }
        else if(S.sel.team===ti&&S.sel.seat===si){ S.sel=null; }
        else { S.teams=swapMen(S.teams,S.sel,{team:ti,seat:si}); S.sel=null; S.locks=relock(); }
        $("copied").textContent=""; drawTeams();
      });
      row.appendChild(b);
      var lk=document.createElement("button"); lk.type="button"; lk.className="lock";
      if(m.blind){ lk.disabled=true; lk.textContent=""; }
      else {
        var on=S.locks[m.name]!=null; lk.setAttribute("aria-pressed",String(on)); lk.textContent=on?"Locked":"Lock";
        lk.addEventListener("click",function(){
          if(S.locks[m.name]!=null) delete S.locks[m.name]; else S.locks[m.name]=ti;
          drawTeams();
        });
      }
      row.appendChild(lk);
      wrap.appendChild(row);
    });
    box.appendChild(wrap);
  });
  drawNotes();
}

/** A locked man who was swapped is locked where he now stands. */
function relock(){
  var out={},t,i;
  for(t=0;t<S.teams.length;t++) for(i=0;i<S.teams[t].length;i++){
    var m=S.teams[t][i]; if(!m.blind&&S.locks[m.name]!=null) out[m.name]=t;
  }
  return out;
}

function drawNotes(){
  var n=$("notes"); n.textContent="";
  var add=function(t){ var p=document.createElement("p"); p.textContent=t; n.appendChild(p); };
  if(!S.teams.length) return;
  var blinds=0; S.teams.forEach(function(t){ t.forEach(function(m){ if(m.blind) blinds++; }); });
  if(blinds) add(blinds===1?"1 BLIND fills an empty seat.":blinds+" BLINDs fill the empty seats, one per team.");
  var ph=S.ph,nRecent=ph?Object.keys(ph.recent).length:0;
  if(nRecent) add("Avoided "+(nRecent-repeatsIn(S.teams,ph.recent))+" of "+nRecent+" recent pairings.");
  if(ph) allowedLines(S.teams,ph,S.result&&S.result.allowed,S.locks).forEach(add);
  add(historyLine(S.log,ph||{rounds:[]}));
  add("Gap between the heaviest and lightest team: "+spread(S.teams).toFixed(1)+" strokes"+
    (blinds?", counted man for man so a team with a BLIND isn't counted light.":"."));
}

function make(again){
  S.ph=S.log&&S.log.state==="ok"?pairHistory(S.log.rounds,weekKey(),S.men):null;
  var res=makeTeams(S.men,{locks:S.locks,pairs:S.ph||undefined,again:again,current:S.teams});
  S.teams=res.teams; S.result=res; S.sel=null; S.locks=relock();
  $("make").classList.add("hide"); $("after").classList.remove("hide"); $("copied").textContent="";
  drawTeams();
}

// A tap before the Pairs log is in waits for it (eight seconds at most).
$("make").addEventListener("click",function(){ pairsRead.then(function(){ make(false); }); });
$("again").addEventListener("click",function(){ pairsRead.then(function(){ make(true); }); });

$("copy").addEventListener("click",function(){
  var text=copyText(S.teams);
  var done=function(){ $("copied").textContent="Copied. Select A4:A27 in Players, press Delete, then click in A4 and paste."; };
  var fallback=function(){
    try {
      var ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta);
      ta.select(); document.execCommand("copy"); ta.remove(); done();
    } catch(e){ $("copied").textContent="Couldn't copy on this phone. Try again on a computer."; }
  };
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done,fallback);
  else fallback();
});

/**
 * READ WHO SAID YES. Cache-busted and no-store, as score.html reads its feed:
 * a stale read here puts the wrong men on teams. Every way it can go wrong is
 * said in words, and none of them shows the button.
 */
function readRoll(){
  if(!/^https?:\/\/\S+$/.test(ROLL_CSV)){ say("The roll-call feed address isn't set yet, so there's nobody to read.",true); return Promise.resolve(); }
  var url=ROLL_CSV+(ROLL_CSV.indexOf("?")<0?"?":"&")+"cachebust="+Date.now();
  var ctl=window.AbortController?new AbortController():null;
  var stop=ctl?setTimeout(function(){ ctl.abort(); },8000):null;
  return fetch(url,{cache:"no-store",signal:ctl?ctl.signal:undefined}).then(function(r){
    if(stop) clearTimeout(stop);
    if(!r.ok) throw new Error("HTTP "+r.status);
    return r.text();
  }).then(function(text){
    var got=parseRoll(text);
    if(!got.ok){ say("Couldn't read the roll call: the feed came back without a name column.",true); return; }
    var n=got.men.length;
    if(n===0){ say("Nobody has said yes yet.",true); return; }
    if(n>MAX_TEAMS*4){
      say(n+" men said yes. The sheet holds 24 — six teams of four. Take "+(n-24)+" off the roll call, then reload.",true);
      $("who").textContent=got.men.map(function(m){ return m.name; }).join(" · ");
      return;
    }
    S.men=got.men;
    var T=teamCount(n),extra=[];
    if(got.twice.length) extra.push("Listed twice, counted once: "+got.twice.join("; ")+".");
    if(got.noIndex.length) extra.push("No index, dealt last: "+got.noIndex.join("; ")+".");
    say(n+" men said yes — "+T+(T===1?" team":" teams")+"."+(extra.length?" "+extra.join(" "):""));
    $("who").textContent=got.men.map(function(m){ return m.name; }).join(" · ");
    $("make").classList.remove("hide");
  }).catch(function(){
    if(stop) clearTimeout(stop);
    say("Couldn't reach the roll call. Check the signal, then reload this page.",true);
  });
}

/**
 * READ THE PAIRS LOG, the same way: cache-busted and no-store. It never
 * blocks — if it can't be read, the teams are still made, evenly, and the
 * screen says no history was used.
 */
function readPairs(){
  if(!/^https?:\/\/\S+$/.test(PAIRS_CSV)){ S.log={state:"unset"}; return Promise.resolve(); }
  var url=PAIRS_CSV+(PAIRS_CSV.indexOf("?")<0?"?":"&")+"cachebust="+Date.now();
  var ctl=window.AbortController?new AbortController():null;
  var stop=ctl?setTimeout(function(){ ctl.abort(); },8000):null;
  return fetch(url,{cache:"no-store",signal:ctl?ctl.signal:undefined}).then(function(r){
    if(stop) clearTimeout(stop);
    if(!r.ok) throw new Error("HTTP "+r.status);
    return r.text();
  }).then(function(text){
    if(/^\s*</.test(text)) throw new Error("not a CSV");
    var got=parsePairsLog(text);
    S.log={state:"ok",rounds:got.rounds,bad:got.bad};
  }).catch(function(){
    if(stop) clearTimeout(stop);
    S.log={state:"fail"};
  });
}
var pairsRead=readPairs();
readRoll();
</script>
</body>
</html>
