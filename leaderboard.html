               value="${rung.threshold}" aria-label="up to" style="flex:1">` +
            `<input data-ladder="${key}" data-i="${i}" data-f="strokes" type="number" step="0.1"
               value="${rung.strokes}" aria-label="pays" style="flex:1">` +
          `</div>` +
          `<div class="cd" style="margin-top:8px;font-size:18px;font-weight:700">
             up to ${rung.threshold} → ${fmtStrokes(rung.strokes)}` +
             (D[key] && D[key][i] ? ` · default up to ${D[key][i].threshold} → ${fmtStrokes(D[key][i].strokes)}` : ``) +
          `</div></div>`;
      });
    }
    h += resetFor(key);
  }

  /* Triple Threat */
  h += `<div class="section-label">Triple Threat</div>` + sw("tripleThreat", "In the game");
  if(on("tripleThreat")){
    h += numField("Each net double bogey", "tripleThreat.perTriple",
      draft.tripleThreat.perTriple, D.tripleThreat.perTriple);
  }
  h += resetFor("tripleThreat");

  /* Bounce Back */
  h += `<div class="section-label">Bounce Back</div>` + sw("bounceBack", "In the game");
  if(on("bounceBack")){
    h += numField("Each net par or better on the hole after a net double",
      "bounceBack.perBounceBack", draft.bounceBack.perBounceBack, D.bounceBack.perBounceBack);
  }
  h += `<div class="note">It fires on the hole <b>immediately after</b> a net double
    bogey and nowhere else. That link is the contest and is not adjustable — but the
    two switches are independent, so a round can charge for blow-ups without paying
    for recoveries, or the other way about.</div>` + resetFor("bounceBack");

  /* Skins */
  h += `<div class="section-label">Skins</div>` + sw("skins", "In the game");
  if(on("skins")){
    h += numField("The pot", "skins.pot", draft.skins.pot, D.skins.pot) +
      numField("The least a skin is ever worth", "skins.minSkin", draft.skins.minSkin, D.skins.minSkin) +
      numField("Fewest players for any skins", "skins.minPlayers", draft.skins.minPlayers, D.skins.minPlayers, {step:1}) +
      numField("Players from which it is teams", "skins.teamFrom", draft.skins.teamFrom, D.skins.teamFrom, {step:1});
  }
  h += resetFor("skins");

  /* Hit List */
  h += `<div class="section-label">Hit List</div>` + sw("hitList", "In the game");
  if(on("hitList")){
    h += numField("Indexes this close count as equal", "hitList.equalBand", draft.hitList.equalBand, D.hitList.equalBand) +
      numField("Names a man is offered", "hitList.offers", draft.hitList.offers, D.hitList.offers, {step:1});
    for(const band of ["lower", "equal", "higher"]){
      const said = { lower: "Against a LOWER handicap — a better player",
                     equal: "Against an EQUAL handicap", higher: "Against a HIGHER handicap" }[band];
      h += `<div class="cd" style="padding:12px 14px 4px;font-size:18px;font-weight:700">${said}</div>`;
      for(const res of ["win", "tie", "loss"]){
        h += numField(res === "win" ? "He wins" : res === "tie" ? "They tie" : "He loses",
          "hitList." + band + "." + res, draft.hitList[band][res], D.hitList[band][res]);
      }
    }
  }
  h += resetFor("hitList");

  h += `<div class="pad">` +
    `<button class="big solid" id="setSave">Save and rescore</button>` +
    `<button class="big" id="setCancel">Cancel</button>` +
    `<button class="big danger" id="setResetAll">Reset everything to the defaults</button></div>` +
    `<div id="setErr"></div>`;

  document.getElementById("settingsBody").innerHTML = h;
  wireSettings();
}

function resetFor(key){
  const changed = state.contests && state.contests[key] !== undefined;
  return `<div class="pad"><button class="big" data-reset="${key}"${changed?"":" disabled"}>` +
    (changed ? "Reset " + (CONTEST_NAMES[key] || key) + " to the default" : "On the default") +
    `</button></div>`;
}

function wireSettings(){
  const body = document.getElementById("settingsBody");
  /* A CLEARED BOX IS NOT A ZERO. Number("") is 0 and Number.isFinite(0) is
     true, so clearing a field to retype it silently wrote 0 — and a man who
     then tapped Save without finishing had set the value to nothing. An empty
     box means "unchanged"; the number that was there stays until a real one
     replaces it. Same for a box holding only a minus sign, mid-type. */
  const readNumber = (el) => {
    const raw = String(el.value).trim();
    if(raw === "" || raw === "-" || raw === "−") return null;
    const v = Number(raw.replace("−", "-").replace(",", "."));
    return Number.isFinite(v) ? v : null;
  };
  body.querySelectorAll("input[data-path]").forEach(el =>
    el.addEventListener("input", () => {
      const v = readNumber(el);
      if(v != null) settingsSet(el.dataset.path, v);
    }));
  body.querySelectorAll("input[data-ladder]").forEach(el =>
    el.addEventListener("input", () => {
      const v = readNumber(el);
      if(v != null) draft[el.dataset.ladder][Number(el.dataset.i)][el.dataset.f] = v;
    }));
  const barred = body.querySelector("input[data-barred]");
  if(barred) barred.addEventListener("input", () => {
    const holes = barred.value.split(/[^0-9]+/).filter(Boolean).map(Number);
    draft.watchTheBirdie.barred = holes;
  });
  body.querySelectorAll("[data-onoff]").forEach(seg =>
    seg.querySelectorAll("button").forEach(b =>
      b.addEventListener("click", () => {
        const key = seg.dataset.onoff;
        // Switching a contest back on restores it from the DEFAULTS, not from
        // whatever it was before — there is nothing left of it to restore.
        draft[key] = b.dataset.v === "1"
          ? JSON.parse(JSON.stringify(E.DEFAULT_CONTESTS[key]))
          : null;
        renderSettings();
      })));
  body.querySelectorAll("button[data-reset]").forEach(b =>
    b.addEventListener("click", () => {
      draft[b.dataset.reset] = JSON.parse(JSON.stringify(E.DEFAULT_CONTESTS[b.dataset.reset]));
      saveSettings();
    }));
  document.getElementById("setResetAll").addEventListener("click", () => {
    draft = JSON.parse(JSON.stringify(E.DEFAULT_CONTESTS));
    saveSettings();
  });
  document.getElementById("setCancel").addEventListener("click", () => {
    draft = null; renderSetup(); show("setup");
  });
  document.getElementById("settingsSub").textContent = rulesChanged()
    ? "Changed from the defaults" : "The default rules";
  document.getElementById("setSave").addEventListener("click", saveSettings);
}

function saveSettings(){
  const problems = E.checkContests(draft, E.ABERDEEN_TEE_IV);
  if(problems.length){
    document.getElementById("setErr").innerHTML =
      `<div class="note warn"><b>Not saved — ${problems.length === 1 ? "this is" : "these are"}
        wrong:</b><br>` + problems.map(esc).join("<br>") + `</div>`;
    document.getElementById("setErr").scrollIntoView({ block: "nearest" });
    return;
  }
  // Stored as a DIFF, so a round on the defaults carries nothing at all.
  state.contests = E.diffContests(E.DEFAULT_CONTESTS, draft);
  save();
  // RESCORED FROM THE SCORES ALREADY STORED. No card is ever re-entered.
  renderBoard();
  if(state.skinsOn) renderSkins();
  draft = null;
  renderSettings();
  renderSetup();
}

/** The slots and their legal holes, as the parser wants them. */
function pickSlotRules(){
  const legal = E.birdiePickHoles(E.courseForTee(state.lastTee || "IV", "M"));
  return E.PICK_SLOTS.map(sl => ({ key: sl.key, label: sl.label, legal: legal[sl.key] }));
}

function readPicksPaste(){
  const text = document.getElementById("picksPaste").value;
  picksPreview = IMP.parseBirdiePicks(text, {
    names: state.players.map(p => p.name),
    slots: pickSlotRules(),
  });
  drawPicksPreview();
}

function drawPicksPreview(){
  const out = document.getElementById("picksOut");
  const rows = picksPreview ? picksPreview.rows : [];
  if(rows.length === 0){
    out.innerHTML = `<div class="note warn">No picks read from that yet.</div>`;
    return;
  }

  const good = rows.filter(r => r.problems.length === 0);
  const bad = rows.filter(r => r.problems.length > 0);

  const line = (r) => {
    const isBad = r.problems.length > 0;
    const who = r.index >= 0 ? state.players[r.index].name : r.name;
    const said = isBad ? r.problems.join(" · ")
      : E.PICK_SLOTS.map(sl => r.picks[sl.key]).join(", ") +
        (r.how && r.how !== "exact" ? " · matched on the " + r.how + " name" : "");
    return `<div class="prev"><div class="pv">` +
      `<div class="pvn">${esc(who)}</div>` +
      `<div class="pvd">${esc(said)}</div></div>` +
      `<div class="pvt"><span class="tag${isBad?" no":""}">${isBad ? "skip" : "set"}</span></div></div>`;
  };

  let html = "";
  if(good.length){
    html += `<div class="section-label">${good.length} to set</div>` + good.map(line).join("");
  }
  if(bad.length){
    html += `<div class="section-label">${bad.length} left out</div>` + bad.map(line).join("");
  }
  if(picksPreview.ignored){
    html += `<div class="note">${picksPreview.ignored} line${picksPreview.ignored===1?"":"s"}
      ignored — a heading row, or nothing on it.</div>`;
  }
  html += `<div class="pad">` +
    (good.length ? `<button class="big solid" id="picksApply">Set picks for ${good.length} player${good.length===1?"":"s"}</button>` : ``) +
    `<button class="big" id="picksDrop">Discard this list</button></div>`;
  out.innerHTML = html;

  if(good.length) document.getElementById("picksApply").addEventListener("click", commitPicks);
  document.getElementById("picksDrop").addEventListener("click", () => {
    picksPreview = null;
    document.getElementById("picksBox").innerHTML = "";
  });
}

function commitPicks(){
  if(!picksPreview) return;
  for(const r of picksPreview.rows){
    if(r.problems.length > 0) continue;
    const p = state.players[r.index];
    if(!p) continue;
    E.PICK_SLOTS.forEach(sl => { p[sl.key] = r.picks[sl.key] == null ? null : r.picks[sl.key]; });
  }
  picksPreview = null;
  save();
  renderSetup(); renderBoard();
  document.getElementById("picksBox").innerHTML = "";
}

    const cut = (full != null && full !== v)
      ? " · full " + full + " at " + state.allowancePercent + "%" : "";
    $("fChNote").textContent = " · " + c.courseRating.toFixed(1) + "/" + c.slope + cut;
  };
  refreshCh();

  $("fName").addEventListener("input", e => { editing.name = e.target.value; });
  $("fGhin").addEventListener("input", e => { editing.ghin = e.target.value; });
  $("fIndex").addEventListener("input", e => {
    // Keep exactly what was typed, so a rejected entry is never wiped from under
    // the man's thumb — he can see what he wrote and correct it.
    editing.indexText = e.target.value;
    const read = E.parseHandicapIndex(e.target.value);
    editing.index = read.value;
    editing.indexBad = !read.ok;
    $("fIndexErr").textContent = read.error || "";
    refreshCh();
  });
  $("fTee").addEventListener("change", e => { editing.tee = e.target.value; refreshCh(); });
  $("fCart").addEventListener("input", e => {
    // Same rule as the index: only a plain whole number counts, so nothing
    // unreadable can reach storage and come back as "cart NaN".
    const v = e.target.value.trim();
    editing.cart = /^\d{1,2}$/.test(v) ? Number(v) : null;
  });
  $("fTeam").addEventListener("input", e => { editing.team = e.target.value.trim(); });
  $("fFlight").addEventListener("input", e => {
    editing.flight = e.target.value;
    document.querySelector("#fFlight").parentElement.querySelector(".cd").textContent = flightHint(editing);
  });
  E.PICK_SLOTS.forEach(sl => {
    $("fPick_" + sl.key).addEventListener("change", e => {
      editing[sl.key] = e.target.value ? Number(e.target.value) : null;
    });
  });
  $("fGender").querySelectorAll("button").forEach(b =>
    b.addEventListener("click", () => {
      editing.gender = b.dataset.g;
      // The women's stroke index changes which holes get strokes, so redraw the
      // picks and the course handicap together.
      drawEdit();
    }));

  $("fSave").addEventListener("click", saveEditing);
  $("fCancel").addEventListener("click", () => { editing = null; renderSetup(); show("setup"); });
  const rm = $("fRemove");
  if(rm) rm.addEventListener("click", removeEditing);
}

function saveEditing(){
  const p = editing, err = document.getElementById("fErr");
  if(!p.name || !p.name.trim()){ err.textContent = "A name is needed."; return; }
  // Re-read the raw text rather than trusting whatever was last kept, so nothing
  // can be saved that the parser would refuse.
  const read = E.parseHandicapIndex(
    p.indexText != null ? p.indexText : E.formatHandicapIndex(p.index));
  if(!read.ok){ err.textContent = read.error; return; }
  if(read.value == null){ err.textContent = "A handicap index is needed."; return; }
  p.index = read.value;
  err.textContent = "";

  p.name = p.name.trim();
  const rec = { id: p.id, name: p.name, ghin: (p.ghin || "").trim(),
                index: p.index, tee: p.tee, gender: p.gender,
                cart: p.cart, flight: (p.flight || "").trim() };
  E.PICK_SLOTS.forEach(sl => { rec[sl.key] = p[sl.key] == null ? null : p[sl.key]; });
  // The tee just used becomes the one the next man starts on.
  if(rec.tee) state.lastTee = rec.tee;
  const at = state.players.findIndex(x => x.id === p.id);

  // A drawn set stays marked as drawn through an edit to anything else — a man
  // whose tee was corrected did not thereby choose his holes. Touch a PICK,
  // though, and it becomes his: the mark goes and the board stops saying it.
  const was = at === -1 ? null : state.players[at];
  const picksMoved = was == null ||
    E.PICK_SLOTS.some(sl => (was[sl.key] == null ? null : was[sl.key]) !== rec[sl.key]);
  if(was && was.picksAuto && !picksMoved) rec.picksAuto = true;

  if(at === -1) state.players.push(rec); else state.players[at] = rec;
  editing = null;
  save();
  renderSetup(); show("setup");
}

function removeEditing(){
  const p = editing;
  if(!window.confirm("Remove " + (p.name || "this player") + " from the round?")) return;
  state.players = state.players.filter(x => x.id !== p.id);
  delete state.scores[p.id];
  delete state.handicaps[p.id];
  editing = null;
  save();
  renderSetup(); show("setup");
}

/**
 * A round played on changed rules must never look like an ordinary one. It says
 * so on the board, in the shared view and in the export — the three places a
 * number leaves this phone.
 */
function drawHouseRules(){
  const box = document.getElementById("houseRules");
  if(!box) return;
  box.innerHTML = rulesChanged()
    ? `<div class="note warn"><b>House rules — not the default values.</b><br>
         Changed: ${esc(changedRulesNote())}. Tap <b>The rules</b> on Setup to see
         every value this round is using.</div>`
    : "";
}

/* ---------- skins ---------- */
function renderSkins(){
  const body = document.getElementById("skinsBody");
  const sub = document.getElementById("skinsSub");
  const config = contestConfig().skins;

  if(!config){
    document.getElementById("skinsFlights").innerHTML = "";
    sub.textContent = "Switched off for this round";
    body.innerHTML = `<div class="note warn">Skins is switched off for this round.
      Turn it back on at the bottom of the <b>Setup</b> tab.</div>`;
    return;
  }

  // Skins is played inside a flight: carts only ever face carts they are
  // flighted with, so this screen shows one flight at a time.
  const allFlights = E.sortFlights([...new Set(readyPlayers().map(p => (p.flight || "").trim()))]);
  if(!allFlights.includes(state.flight)) state.flight = allFlights[0] || "";
  drawFlightPicker("skinsFlights", allFlights, state.flight, (f) => {
    state.flight = f; save(); renderSkins(); renderBoard();
  });

  const inFlight = readyPlayers().filter(p =>
    allFlights.length < 2 || (p.flight || "").trim() === state.flight);
  // THE FIELD SIZE DECIDES THE FORMAT, not a switch: under 8 there are none,
  // 8 to 15 is cart against cart, 16 or more is team against team.
  const format = E.skinsFormat(inFlight.length, config);
  const word = format === "team" ? "team" : "group";
  const Word = format === "team" ? "Team" : "Group";
  /* A man who types "Team 1" into the team field should not be shown
     "Team Team 1". Prefix only when the name does not already say it. */
  const named = (id) => new RegExp("^" + word + "\\b", "i").test(String(id).trim())
    ? String(id).trim() : Word + " " + id;

  if(format == null){
    sub.textContent = inFlight.length + " players — too few for skins";
    body.innerHTML = `<div class="note warn"><b>No skins at ${inFlight.length}
      player${inFlight.length===1?"":"s"}.</b><br>
      Skins needs a field of at least ${config.minPlayers}. Below that there is not
      enough of a field to divide, and the contest is simply not played.</div>`;
    return;
  }

  const groupOf = (p) => format === "team" ? (p.team || "").trim() : (p.cart == null ? "" : String(p.cart).trim());
  const entered = inFlight.filter(p => groupOf(p) !== "");
  if(entered.length === 0){
    sub.textContent = "No " + word + "s yet";
    body.innerHTML = `<div class="note">Nobody has a ${word} yet. Give each man
      ${format === "team" ? "a team" : "a cart number"} on the <b>Setup</b> tab and the skins
      will run themselves. A man with no ${word} simply doesn't compete for them.</div>`;
    return;
  }

  const byGroup = new Map();
  entered.forEach(p => {
    const id = groupOf(p);
    if(!byGroup.has(id)) byGroup.set(id, []);
    byGroup.get(id).push(displayName(p));
  });
  const groups = [...byGroup.keys()].sort((a,b) =>
    (Number(a)||0) - (Number(b)||0) || String(a).localeCompare(String(b)));

  // One group has nobody to play against: uncontested it takes every hole for
  // going round on its own.
  if(groups.length < 2){
    sub.textContent = "Only one " + word + " out";
    body.innerHTML =
      `<div class="note warn"><b>No skins today — only one ${word} out.</b><br>
        Skins is ${word} against ${word}, and a ${word} on its own wins every hole by
        default. Give the men a second ${word} on the <b>Setup</b> tab and the skins
        will run.</div>` +
      `<div class="contest"><div class="cname"><div class="cn">${esc(named(groups[0]))}</div>` +
      `<div class="cd">${esc(byGroup.get(groups[0]).join(" & "))}</div></div>` +
      `<div class="pvt" style="text-align:right"><div class="cd">not playing for skins</div></div></div>`;
    return;
  }

  const cards = entered.map(cardOf);
  const table = E.skinsByGroup(cards.map(c => ({ card: c, group: format === "team" ? c.team : c.cart })), undefined);
  const won = (id) => table.skins.get(String(id)) || 0;
  let skinsWon = 0; table.skins.forEach(n => { skinsWon += n; });
  const played = cards.some(c => c.gross.some(g => g != null));
  sub.textContent = played
    ? groups.length + " " + word + (groups.length===1?"":"s") + " · " + skinsWon + " skin" +
      (skinsWon===1?"":"s") + " won"
    : "No scores imported yet";

  // The POT is fixed and split by the skins actually won, so the value of one
  // is not known until the round is over. Shown to the hundredth, because this
  // is the figure a man checks his own total against.
  const perSkin = E.skinValue(config, skinsWon);

  let html = `<div class="section-label">Totals by ${word}</div>`;
  html += groups.slice().sort((a,b) => won(b) - won(a) ||
      (Number(a)||0)-(Number(b)||0) || String(a).localeCompare(String(b))).map(id => {
    const n = won(id);
    const strokes = E.skinStrokes(n, config, skinsWon);
    return `<div class="contest"><div class="cname">` +
      `<div class="cn">${esc(named(id))}</div>` +
      `<div class="cd">${esc(byGroup.get(id).join(" & "))}</div></div>` +
      `<div class="pvt" style="text-align:right;white-space:nowrap">` +
        `<div class="cn">${n} skin${n===1?"":"s"}</div>` +
        `<div class="cd">${strokes === 0 ? "0.0" : fmtStrokes(strokes)}</div></div></div>`;
  }).join("");

  // The floor bites once the division would fall under it — at ten skins here.
  const floored = config.minSkin != null &&
    Math.abs(config.pot / skinsWon) < Math.abs(config.minSkin);
  html += `<div class="note"><b>${Math.abs(perSkin).toFixed(2)} a skin today` +
    (floored
      ? ` — the least a skin is ever worth.</b><br>
         ${skinsWon} skins would divide ${Math.abs(config.pot).toFixed(1)} into
         ${(Math.abs(config.pot) / skinsWon).toFixed(2)} each, which is under the
         ${Math.abs(config.minSkin).toFixed(1)} floor, so every skin pays
         ${Math.abs(config.minSkin).toFixed(1)}. On a day like this the round pays out
         <b>${(skinsWon * Math.abs(config.minSkin)).toFixed(1)}</b> in all rather than
         ${Math.abs(config.pot).toFixed(1)} — a hole won is a hole won.`
      : ` — ${Math.abs(config.pot).toFixed(1)} split ${skinsWon} way${skinsWon===1?"":"s"}.</b><br>
         The pot is ${Math.abs(config.pot).toFixed(1)} however the round falls, divided
         among the skins actually won, so a lean day makes each one worth MORE. It never
         drops below ${Math.abs(config.minSkin).toFixed(1)}, which it would at
         ${Math.ceil(Math.abs(config.pot) / Math.abs(config.minSkin))} skins or more.`) +
    `<br>Every man in a winning ${word} takes the full amount; it is not shared out
     between them.<br>
     This field plays <b>${format === "team" ? "TEAM" : "CART"} skins</b> —
     ${inFlight.length} players, and ${format === "team"
       ? "teams are used from " + config.teamFrom + " up"
       : "carts run from " + config.minPlayers + " to " + (config.teamFrom - 1)}.</div>`;

  html += `<div class="section-label">Hole by hole</div>`;
  html += table.holes.map(h => {
    const par = E.ABERDEEN_TEE_IV.par[h.hole - 1];
    const best = h.wonBy != null ? h.scores.get(h.wonBy) : null;
    const right = h.wonBy != null
      ? `<span class="cn">${esc(named(h.wonBy))}</span>`
      : (h.scores.size === 0
          ? `<span class="cd">not played</span>`
          : `<span class="cd">tied — nobody wins it</span>`);
    return `<div class="prev"><div class="pv">` +
        `<div class="pvn">Hole ${h.hole}<span class="cd" style="font-weight:700"> · par ${par}</span></div>` +
        `<div class="pvd">${best == null ? "&nbsp;" : "two balls added: " + best}</div>` +
      `</div><div class="pvt">${right}</div></div>`;
  }).join("");

  html += `<div class="note">A ${word}'s score on a hole is its <b>best two net balls</b>,
    added. Not the average, which handed a threesome a quarter more skins than a
    foursome — best two means every ${word} puts up exactly two scores whatever its
    size. A man out on his own counts his ball twice. <b>A tied hole is not won by
    anybody and nothing carries over.</b></div>`;

  body.innerHTML = html;
}

         </div>

/** Decide what one parsed row means for the player chosen for it, uncommitted. */
function assess(row, idx, all){
  const card = row.card;
  const player = row.playerId ? state.players.find(p => p.id === row.playerId) || null : null;
  const mode = importMode === "auto" ? card.mode : importMode;

  // `replaces` is what makes the difference between adding a flight and
  // overwriting one, and the screen has to say which before anything is written.
  const out = { card, player, mode, gross: null, problems: [], warnings: [],
                skipped: false, replaces: !!(player && state.scores[player.id]), suggest: null };
  // Not a round at all — a blind, or a card never returned. Nothing to assign
  // and nothing to fix, so it is set aside and said so rather than dropped.
  if(card.skip){
    out.skipped = true;
    out.problems.push(card.skip);
    return out;
  }
  if(!player){
    if(row.how === "ambiguous"){
      out.problems.push("two players share that name — choose below");
    } else {
      // "Score belongs to nobody" is true and useless. A typed "Gidaly, Mitch"
      // against an exported "Gidaly, Mitchell" is a spelling, not a stranger,
      // and the organiser should not have to find that himself six times over.
      // The near miss is NAMED but never taken — confirming is still his.
      const near = IMP.nearestName(card.name, state.players.map(p => p.name || ""));
      const who = near.index >= 0 ? state.players[near.index] : null;
      // Not if another row already claims him — two cards on one man is the
      // thing the assignment rules refuse hardest.
      if(who && !(all || []).some(r => r.playerId === who.id)){
        out.suggest = who;
        out.problems.push("did you mean " + (who.name || "(no name)") + "?");
      } else {
        out.problems.push("no player chosen — pick one below");
      }
    }
    return out;
  }
  // Two rows on one man would quietly drop a card, and hand-picking makes that
  // easy to do. Refuse both rather than choose between them.
  if(all && all.some((r, j) => j !== idx && r.playerId === row.playerId)){
    out.problems.push("another row is already assigned to " + player.name);
    return out;
  }
  if(!isReady(player)){ out.problems.push("player needs an index and a tee on Setup"); return out; }
  if(card.holesPlayed === 0){ out.problems.push("no hole scores in this row"); return out; }

  /* THREE OR MORE Xs MUST BE ASKED ABOUT.
     Golf Genius writes X for two different things and the card cannot tell them
     apart: a man who PICKED UP on a hole, and a man who SAT OUT holes he never
     played. Both happen here — men skip holes in the heat.
     One or two are almost always a genuine pick-up and are never queried. Three
     or more are a question with two very different answers: score them as net
     doubles, or treat the card as short and not score him at all. Guessing
     either way is worse than asking, because both answers are ordinary. */
  const xs = card.holes.filter(h => E.isPickedUp(h)).length;
  out.xCount = xs;
  if(xs >= X_QUERY_FROM && !row.xRule){
    out.needsXRule = true;
    out.problems.push(xs + " holes marked X — did he play them?");
    return out;
  }
  out.satOut = row.xRule === "satOut";
  if(mode === "unknown"){
    out.problems.push("can't tell net from gross — choose Net or Gross above");
    return out;
  }

  const course = courseOf(player);
  // He sat those holes out, so they were never played. Blanking them is what
  // makes the eighteen-hole rule catch the card — an X scored as a net double
  // would count as a hole played and let a fourteen-hole round onto the board.
  const holes = out.satOut ? card.holes.map(h => E.isPickedUp(h) ? null : h) : card.holes;
  if(mode === "gross"){
    out.gross = holes.slice();
  } else {
    // Golf Genius already took the strokes off. Put them back with the handicap
    // it used — the one printed after the name — so the engine can take them off
    // again against this player's own stroke index.
    const ch = card.handicap != null ? card.handicap : chOf(player);
    if(ch == null){ out.problems.push("no course handicap in the paste to undo the strokes"); return out; }
    // A picked-up hole has no net to add strokes back to — it carries its X
    // through untouched and the engine fills it in at par + 4.
    const numeric = holes.map(h => E.isPickedUp(h) ? null : h);
    const rebuilt = E.grossFromNet(numeric, course, ch);
    out.gross = holes.map((h, i) => E.isPickedUp(h) ? h : rebuilt[i]);
    out.usedHandicap = ch;
  }

  // Say plainly which handicap this card will be scored on, and where it came
  // from — the export's is used whenever it has one, even when setup disagrees.
  const setupCh = chOf(player);
  if(card.handicap != null){
    out.applied = card.handicap;
    out.appliedFrom = "paste";
    out.warnings.push(setupCh != null && card.handicap !== setupCh
      ? "handicap " + card.handicap + " from the paste, not the " + setupCh + " today's index gives"
      : "handicap " + card.handicap + " from the paste");
  } else if(setupCh != null){
    out.applied = setupCh;
    out.appliedFrom = "index";
    out.warnings.push("handicap " + setupCh + " from the index — the paste printed none");
  }
  if(card.pickedUp > 0){
    // Picked up: the hole has no number, so the eighteen can't be checked
    // against the Total. Say what will be scored instead of a silent guess.
    out.warnings.push("picked up on " + card.pickedUp + " hole" + (card.pickedUp===1?"":"s") +
      " — each scored net double");
  } else {
    const total = out.gross.reduce((a,h) => a + (h==null?0:h), 0);
    if(card.grossTotal != null && card.holesPlayed === HOLES && total !== card.grossTotal){
      out.warnings.push("gross works out to " + total + ", the Total column says " + card.grossTotal);
    }
  }
  return out;
}

const HOW_SAID = {
  exact: "matched by name",
  reversed: "matched after turning “Last, First” around",
  initial: "matched on first name and last initial",
  chosen: "you chose this player",
};

function doPreview(){
  const text = document.getElementById("paste").value;
  const parsed = IMP.parseScores(text);
  // Auto-match each row to the roster, and remember HOW so the screen can say so.
  const names = state.players.map(p => p.name);
  const rows = parsed.cards.map(card => {
    const m = IMP.matchName(card.name, names);
    return { card, playerId: m.index >= 0 ? state.players[m.index].id : null, how: m.how };
  });
  importPreview = { rows, errors: parsed.errors };
  drawPreview();
}

function drawPreview(){
  const box = document.getElementById("previewBox");
  if(!importPreview) { box.innerHTML = ""; return; }
  const { rows, errors } = importPreview;

  if(rows.length === 0){
    box.innerHTML = `<div class="note warn">Nothing readable in that paste yet.` +
      (errors.length ? `<br>` + errors.map(esc).join("<br>") : ``) + `</div>`;
    return;
  }

  const seen = rows.map(assess);
  const usable = seen.filter(a => a.gross);
  const options = (chosen) =>
    `<option value=""${chosen?"":" selected"}>— nobody —</option>` +
    state.players.map(p =>
      `<option value="${p.id}"${p.id===chosen?" selected":""}>${esc(p.name || "(no name)")}</option>`).join("");

  // Rows needing a hand come first. With a two-dozen man field the three that
  // need picking must not be buried down the list. Sort is stable, so within
  // each group the paste's own order is kept, and `i` stays the row's real
  // index so the dropdowns still address the right card.
  const needing = [], ready = [], setAside = [];
  rows.forEach((row, i) => {
    // Skipped rows are their own group: nothing about them is actionable, so
    // they must not swell the count of rows that genuinely want a decision.
    const bucket = seen[i].skipped ? setAside : seen[i].problems.length ? needing : ready;
    bucket.push({ row, i });
  });
  // "Needs a player" was the only thing a row could want. It is not any more —
  // a card with three or more Xs needs an ANSWER, not a name — so the heading
  // says whichever it is rather than confidently saying the wrong one.
  const wantsName = needing.filter(({ i }) => !seen[i].needsXRule).length;
  const wantsAnswer = needing.length - wantsName;
  const needLabel = wantsAnswer === 0
    ? (needing.length === 1 ? "1 needs a player" : needing.length + " need a player")
    : wantsName === 0
      ? (wantsAnswer === 1 ? "1 needs an answer" : wantsAnswer + " need an answer")
      : wantsName + " need a player, " + wantsAnswer + " an answer";
  const groups = [
    { list: needing, label: needLabel },
    { list: ready,   label: ready.length + " ready to import" },
    { list: setAside, label: setAside.length + " not a round · left out" },
  ];

  let html = "";
  for(const group of groups){
    if(group.list.length === 0) continue;
    html += `<div class="section-label">${esc(group.label)}</div>`;
    html += group.list.map(({ row, i }) => {
      const a = seen[i];
      const bad = a.problems.length > 0;
      const bits = [row.card.holesPlayed + " of 18 holes"];
      if(!bad) bits.push(a.mode === "net" ? "net holes" : "gross holes");
      if(row.card.handicap != null) bits.push("hcp " + row.card.handicap);
      if(!bad) bits.push(a.replaces ? "REPLACES his card already in" : "new card");
      if(!bad && a.xCount > 0 && !a.satOut) bits.push(a.xCount + " picked up");
      const said = HOW_SAID[row.how];
      const detail = bad ? a.problems.join(" · ") : bits.concat(a.warnings).join(" · ");
      return `<div class="prev"><div class="pv">` +
          `<div class="pvn">${esc(row.card.name)}</div>` +
          `<div class="pvd">${esc(detail)}</div>` +
          (said && !bad ? `<div class="pvd">${said}</div>` : ``) +
        `</div>` +
        `<div class="pvt"><span class="tag${bad?" no":""}">${bad ? "skip" : "ready"}</span></div></div>` +
        // A set-aside row gets no picker: there is no player it could belong to.
        (a.skipped ? `` :
          `<div class="field" style="border-bottom-width:2px">` +
            `<label for="pick${i}">Scores belong to</label>` +
            `<select id="pick${i}" data-row="${i}">${options(row.playerId)}</select>` +
            // One tap to take the near miss, instead of hunting two dozen names
            // in a dropdown. It sets the picker; it does not commit anything.
            (a.suggest ? `<div style="padding-top:10px"><button class="big" ` +
               `data-use="${i}" data-player="${a.suggest.id}">Yes — ${esc(a.suggest.name || "(no name)")}</button></div>` : ``) +
          `</div>`) +
        // The X question, with both answers spelled out. Neither is a default:
        // one scores the card, the other takes him off the board entirely, and
        // the difference is the man's own account of his round.
        (a.needsXRule
          ? `<div class="note warn"><b>${a.xCount} holes on this card are marked X.</b><br>
               Golf Genius writes X both for a hole a man PICKED UP on and for a hole he
               never played. Which was it?</div>
             <div class="pad">
               <button class="big" data-xrule="played" data-row="${i}">He played them and picked up
                 — score as net doubles</button>
               <button class="big" data-xrule="satOut" data-row="${i}">He sat them out
                 — not a full round, so not scored</button>
             </div>`
          : ``) +
        // An answered card keeps a way back. Both answers are ordinary, the
        // difference between them is whether the man is scored at all, and an
        // organiser who taps the wrong one must not have to re-paste the round.
        (row.xRule
          ? `<div class="note">${a.satOut
               ? `He sat out ${a.xCount} holes, so he played ${18 - a.xCount} —
                  <b>not scored</b>, under the eighteen-hole rule.`
               : `His ${a.xCount} Xs are pick-ups, scored as net doubles.`}
               <button class="big" data-xrule="" data-row="${i}"
                 style="margin-top:10px">Change that answer</button></div>`
          : ``);
    }).join("");
  }

  if(errors.length){
    html += `<div class="note warn"><b>Rows the parser rejected</b><br>` +
      errors.map(esc).join("<br>") + `</div>`;
  }

  if(usable.length === 0){
    html += `<div class="note warn"><b>Nothing to import, so nothing has changed.</b><br>` +
      `None of these rows is assigned to a player in this round. Pick the players ` +
      `above, or check you pasted the right event. Anything already scored on this ` +
      `phone has been left exactly as it was.</div>`;
    html += `<div class="pad"><button class="big" id="discardBtn">Discard this paste</button></div>`;
  } else {
    // A paste MERGES. What it will add, what it will overwrite, and who it will
    // not touch — said in full before the button, because a round that arrives
    // in flights is the ordinary case and the overwriting is the dangerous half.
    const adding = usable.filter(a => !a.replaces);
    const replacing = usable.filter(a => a.replaces);
    const untouched = state.players.filter(p =>
      isReady(p) && state.scores[p.id] && !usable.some(a => a.player && a.player.id === p.id));

    html += `<div class="note"><b>What this paste will do</b><br>` +
      (adding.length
        ? `Add ${adding.length} new card${adding.length===1?"":"s"}.<br>`
        : `No new cards.<br>`) +
      (replacing.length
        ? `<b>Replace ${replacing.length} card${replacing.length===1?"":"s"} already in:</b> ` +
          replacing.map(a => esc(a.player.name || "(no name)")).join(", ") + `.<br>`
        : `Nothing already in will be replaced.<br>`) +
      (untouched.length
        ? `Left alone: ` + untouched.map(p => esc(p.name || "(no name)")).join(", ") + `.`
        : `No other cards are in this round yet.`) +
      `</div>`;

    const label = [
      adding.length ? "Add " + adding.length : "",
      replacing.length ? "Replace " + replacing.length : "",
    ].filter(Boolean).join(" · ") || "Use these cards";

    html += `<div class="pad">` +
      `<button class="big solid" id="commitBtn">${esc(label)}</button>` +
      `<button class="big" id="discardBtn">Discard this paste</button></div>`;
  }

  box.innerHTML = html;
  box.querySelectorAll("button[data-xrule]").forEach(b =>
    b.addEventListener("click", () => {
      importPreview.rows[Number(b.dataset.row)].xRule = b.dataset.xrule || null;
      drawPreview();
    }));
  box.querySelectorAll("button[data-use]").forEach(b =>
    b.addEventListener("click", () => {
      const row = importPreview.rows[Number(b.dataset.use)];
      row.playerId = b.dataset.player;
      row.how = "chosen";
      drawPreview();
    }));
  box.querySelectorAll("select[data-row]").forEach(sel =>
    sel.addEventListener("change", () => {
      const row = importPreview.rows[Number(sel.dataset.row)];
      row.playerId = sel.value || null;
      row.how = sel.value ? "chosen" : null;
      drawPreview();
    }));
  const commit = document.getElementById("commitBtn");
  if(commit) commit.addEventListener("click", commitImport);
  document.getElementById("discardBtn").addEventListener("click", () => {
    importPreview = null;
    document.getElementById("paste").value = "";
    document.getElementById("previewBox").innerHTML = "";
  });
}

function commitImport(){
  if(!importPreview) return;
  const usable = importPreview.rows.map(assess).filter(a => a.gross && a.player);
  // Never let an empty import wipe the round — the screen refuses this too, but
  // the guard belongs next to the write, not only next to the button.
  if(usable.length === 0) return;

  // A paste MERGES into the round. It used to empty state.scores first, on the
  // grounds that a paste was the whole round — which is false the moment a
  // round arrives in more than one piece. A two-flight event kept only the
  // second flight, and three or four flights is ordinary at a club event.
  //
  // Only the men in THIS paste are touched. A man already scored and not
  // mentioned here keeps the card he has; a man mentioned here has his card
  // replaced entire, holes and handicap together.
  usable.forEach(a => {
    state.scores[a.player.id] = a.gross;
    // Keep the day's handicap with the card it belongs to, not just for scoring
    // now but so a later reload still scores the round as it was played. A
    // replacement card with no handicap of its own must not inherit the one
    // that came in with the card it just displaced.
    if(a.card.handicap != null) state.handicaps[a.player.id] = a.card.handicap;
    else delete state.handicaps[a.player.id];
  });
  // Score entry is the moment: the round is being scored now, and a man who has
  // not sent his picks in by now is not going to.
  drawMissingPicks();

  importPreview = null;
  save();
  renderBoard();
  show("board");
}

/* ---------- wiring ---------- */
document.getElementById("backBtn").addEventListener("click", () => { renderBoard(); show("board"); });
document.getElementById("editBack").addEventListener("click", () => { editing = null; renderSetup(); show("setup"); });
document.getElementById("addBtn").addEventListener("click", () => {
  if(state.players.length >= MAX_PLAYERS) return;
  editPlayer(null);
});
document.getElementById("pastePlayersBtn").addEventListener("click", showRosterBox);
document.getElementById("pastePicksBtn").addEventListener("click", showPicksBox);
document.getElementById("hitListBtn").addEventListener("click", showHitListBox);
document.getElementById("settingsBtn").addEventListener("click", () => {
  draft = null; renderSettings(); show("settings");
});
document.getElementById("settingsBack").addEventListener("click", () => {
  draft = null; renderSetup(); show("setup");
});
// Re-fit names when the viewport changes (rotation, split-view, browser resize).
window.addEventListener("resize", fitBoardNames);

load();
wireFolds();
buildTabs();
renderBoard();
renderSetup();
if(state.skinsOn) renderSkins();
renderImport();
show(state.tab);
</script>
</body>
</html>
