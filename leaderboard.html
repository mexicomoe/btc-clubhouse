<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0b2e13">
<title>Beat the Crowd · Clubhouse</title>
<style>
  /* Built for men in their 70s–80s reading a dim phone in Florida sun.
     Everything is big, black-on-white or white-on-black, bold, no thin greys.
     Nothing is smaller than 18px and nothing tappable is under 48px. */
  :root {
    --ink: #000;
    --paper: #fff;
    --good: #0a6b2e;      /* strokes earned — dark green, high contrast on white */
    --penalty: #b0140a;   /* the one contest that can add strokes */
    --band: #0b2e13;      /* header band, deep green */
    --wash: #f0efe9;      /* the only fill that isn't white — still near-black text */
    font-size: 20px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 20px; line-height: 1.3; -webkit-text-size-adjust: 100%;
  }
  .screen { display: none; max-width: 720px; margin: 0 auto; min-height: 100vh; }
  .screen.on { display: block; }

  header.band {
    background: var(--band); color: #fff;
    padding: 18px 20px; position: sticky; top: 0; z-index: 5;
  }
  header.band .title { font-size: 30px; font-weight: 800; letter-spacing: .2px; }
  header.band .sub { font-size: 18px; font-weight: 700; margin-top: 2px; color: #fff; }

  /* Tabs — the three places you can be */
  nav.tabs { display: flex; border-bottom: 3px solid var(--ink); }
  nav.tabs button {
    flex: 1 1 0; min-height: 56px; padding: 12px 6px;
    font: inherit; font-size: 18px; font-weight: 800;
    background: var(--paper); color: var(--ink);
    border: 0; border-right: 3px solid var(--ink); cursor: pointer;
  }
  nav.tabs button:last-child { border-right: 0; }
  nav.tabs button[aria-current="true"] { background: var(--ink); color: var(--paper); }

  /* Flight picker — only drawn when the field is actually divided */
  nav.flights { display: flex; flex-wrap: wrap; border-bottom: 3px solid var(--ink); }
  nav.flights button {
    flex: 1 1 auto; min-width: 33%; min-height: 52px; padding: 10px 8px;
    font: inherit; font-size: 18px; font-weight: 800;
    background: var(--paper); color: var(--ink);
    border: 0; border-right: 3px solid var(--ink); border-top: 0; cursor: pointer;
  }
  nav.flights button:last-child { border-right: 0; }
  nav.flights button[aria-current="true"] { background: var(--ink); color: var(--paper); }

  /* Leaderboard rows */
  .row {
    display: flex; align-items: center; gap: 8px; width: 100%;
    padding: 18px 12px; min-height: 76px;
    background: var(--paper); color: var(--ink);
    border: 0; border-bottom: 3px solid var(--ink);
    text-align: left; font: inherit; cursor: pointer;
  }
  .row:active { background: var(--ink); color: var(--paper); }
  .row:active .final, .row:active .rank { color: var(--paper); }
  .row .rank {
    flex: 0 0 auto; min-width: 32px; text-align: center;
    font-size: 28px; font-weight: 800;
  }
  .row .who { flex: 1 1 auto; min-width: 0; overflow: hidden; }
  /* name and meta are stacked blocks so the gap below is real spacing, not just line-wrap.
     nowrap + hidden lets JS auto-fit the name to one line without ever pushing the layout. */
  .row .name {
    display: block; font-size: 26px; font-weight: 800; line-height: 1.15;
    white-space: nowrap; overflow: hidden;
  }
  /* Net only, fixed at the 18px floor — never auto-shrunk. Gross lives on the
     detail screen: it isn't what anyone reads on a scoreboard, and dropping it
     is what buys this line the room to stay legible. */
  .row .meta {
    display: block; font-size: 18px; font-weight: 700; margin-top: 7px;
    white-space: nowrap; overflow: hidden;
  }
  /* Only appears when a tie had to be settled, so most rows never grow. */
  .row .tie {
    display: block; font-size: 18px; font-weight: 700; margin-top: 5px;
    white-space: nowrap; overflow: hidden;
  }
  .row .final { flex: 0 0 auto; font-size: 44px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .row.leader { background: #fff7d6; }             /* faint gold, still black text */
  .row.leader:active { background: var(--ink); }

  .chev { flex: 0 0 auto; font-size: 26px; font-weight: 800; }

  /* Detail screen */
  .backbar { padding: 12px 14px; position: sticky; top: 0; background: var(--paper); z-index: 5; border-bottom: 3px solid var(--ink); }
  .back {
    display: inline-flex; align-items: center; gap: 8px;
    min-height: 56px; padding: 10px 20px 10px 12px;
    font-size: 22px; font-weight: 800;
    background: var(--paper); color: var(--ink); border: 3px solid var(--ink); border-radius: 10px;
    cursor: pointer;
  }
  .back:active { background: var(--ink); color: var(--paper); }

  .detail-head { padding: 20px; }
  .detail-head .name { font-size: 36px; font-weight: 800; white-space: nowrap; overflow: hidden; line-height: 1.1; }
  .detail-head .hcp { font-size: 19px; font-weight: 700; margin-top: 4px; }

  .equation {
    display: flex; align-items: baseline; flex-wrap: wrap; gap: 10px 16px;
    padding: 8px 20px 20px; font-variant-numeric: tabular-nums;
  }
  .equation .lab { font-size: 18px; font-weight: 700; }
  .equation .num { font-size: 30px; font-weight: 800; }
  .equation .op { font-size: 26px; font-weight: 800; }
  .equation .fin { font-size: 44px; font-weight: 800; }

  .section-label {
    padding: 14px 20px 6px; font-size: 20px; font-weight: 800;
    border-top: 3px solid var(--ink); text-transform: uppercase; letter-spacing: .4px;
  }
  .contest { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 2px solid var(--ink); min-height: 60px; }
  .contest .cname { flex: 1 1 auto; }
  .contest .cn { font-size: 21px; font-weight: 800; }
  .contest .cd { font-size: 18px; font-weight: 700; margin-top: 2px; }
  .contest .cs { flex: 0 0 auto; font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .cs.good { color: var(--good); }
  .cs.penalty { color: var(--penalty); }
  .cs.none { color: var(--ink); }
  .cd.dim { font-weight: 800; }   /* "needs 18 holes" — kept bold black, not grey */

  /* Shared blocks */
  .pad { padding: 18px 14px; }
  .note { font-size: 18px; font-weight: 700; padding: 16px 14px; }
  .note.warn { background: var(--wash); border-bottom: 3px solid var(--ink); }
  .big {
    display: block; width: 100%; min-height: 60px; padding: 14px;
    font: inherit; font-size: 22px; font-weight: 800;
    background: var(--paper); color: var(--ink);
    border: 3px solid var(--ink); border-radius: 10px; cursor: pointer;
  }
  .big:active { background: var(--ink); color: var(--paper); }
  .big.solid { background: var(--ink); color: var(--paper); }
  .big.solid:active { background: var(--paper); color: var(--ink); }
  .big.danger { color: var(--penalty); border-color: var(--penalty); }
  .big.danger:active { background: var(--penalty); color: var(--paper); }
  .big[disabled] { opacity: .45; cursor: default; }
  .big + .big { margin-top: 12px; }

  /* Setup list */
  .prow {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 14px 12px; min-height: 72px;
    background: var(--paper); color: var(--ink);
    border: 0; border-bottom: 3px solid var(--ink);
    text-align: left; font: inherit; cursor: pointer;
  }
  .prow:active { background: var(--ink); color: var(--paper); }
  .prow .pwho { flex: 1 1 auto; min-width: 0; }
  .prow .pname { display: block; font-size: 24px; font-weight: 800; white-space: nowrap; overflow: hidden; line-height: 1.15; }
  /* Setup is a sit-down screen, not an arm's-length one: the detail line wraps
     onto a second line rather than shrinking, so nothing is ever cut off and
     nothing drops below the 18px floor. */
  .prow .pmeta { display: block; font-size: 18px; font-weight: 700; margin-top: 6px; line-height: 1.25; }
  .prow .pch { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; }
  .prow .pchn { display: block; font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.05; }
  .prow .pchl { display: block; font-size: 18px; font-weight: 800; letter-spacing: .3px; }

  /* Forms */
  .field { padding: 14px; border-bottom: 3px solid var(--ink); }
  .field > label, .field > .flab {
    display: block; font-size: 18px; font-weight: 800;
    text-transform: uppercase; letter-spacing: .4px; margin-bottom: 8px;
  }
  input[type="text"], input[type="number"], select, textarea {
    display: block; width: 100%; min-height: 56px; padding: 12px;
    font-family: inherit; font-size: 22px; font-weight: 700;
    color: var(--ink); background: var(--paper);
    border: 3px solid var(--ink); border-radius: 10px;
    -webkit-appearance: none; appearance: none;
  }
  select {
    /* a plain caret, drawn in ink so it survives sun and dark mode */
    background-image: linear-gradient(45deg, transparent 50%, var(--ink) 50%),
                      linear-gradient(135deg, var(--ink) 50%, transparent 50%);
    background-position: calc(100% - 22px) 24px, calc(100% - 14px) 24px;
    background-size: 8px 8px, 8px 8px;
    background-repeat: no-repeat;
    padding-right: 44px;
  }
  textarea { min-height: 220px; font-size: 18px; font-weight: 600; line-height: 1.35; white-space: pre; overflow-wrap: normal; overflow-x: auto; }
  .seg { display: flex; gap: 0; }
  .seg button {
    flex: 1 1 0; min-height: 56px; font: inherit; font-size: 20px; font-weight: 800;
    background: var(--paper); color: var(--ink);
    border: 3px solid var(--ink); cursor: pointer;
  }
  .seg button:first-child { border-radius: 10px 0 0 10px; }
  .seg button:last-child { border-radius: 0 10px 10px 0; }
  .seg button + button { border-left-width: 0; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .two { display: flex; gap: 12px; }
  .two > * { flex: 1 1 0; min-width: 0; }
  .err { font-size: 18px; font-weight: 800; color: var(--penalty); padding: 12px 14px 0; }
  .chread { font-size: 20px; font-weight: 800; padding: 14px; border-bottom: 3px solid var(--ink); }
  .chread b { font-size: 30px; }

  /* Import preview */
  .prev { display: flex; align-items: center; gap: 10px; padding: 12px; border-bottom: 2px solid var(--ink); min-height: 64px; }
  .prev .pv { flex: 1 1 auto; min-width: 0; }
  .prev .pvn { font-size: 21px; font-weight: 800; }
  .prev .pvd { font-size: 18px; font-weight: 700; margin-top: 3px; }
  .prev .pvt { flex: 0 0 auto; font-size: 18px; font-weight: 800; text-align: right; }
  .tag { display: inline-block; padding: 4px 9px; border: 2px solid var(--ink); border-radius: 6px; font-size: 18px; font-weight: 800; }
  .tag.no { color: var(--penalty); border-color: var(--penalty); }
  .empty { padding: 28px 18px; font-size: 20px; font-weight: 700; }

  /* The card, nine holes to a row. Numbers stay at 18px+ like everything else. */
  .cardwrap { padding: 8px 12px 4px; }
  table.card { width: 100%; border-collapse: collapse; margin-bottom: 10px; table-layout: fixed; }
  table.card th, table.card td {
    border: 2px solid var(--ink); text-align: center; padding: 8px 0;
    font-size: 19px; font-weight: 800; font-variant-numeric: tabular-nums;
  }
  table.card tr.hn th { background: var(--wash); font-size: 18px; }
  table.card td.blank { color: var(--ink); }
  table.card td.xup { background: var(--ink); color: var(--paper); }
</style>
</head>
<body>

<section id="board" class="screen on">
  <header class="band">
    <div class="title">Leaderboard</div>
    <div class="sub" id="boardSub">Aberdeen G&amp;CC</div>
  </header>
  <nav class="tabs" data-tabs></nav>
  <div id="boardFlights"></div>
  <div id="rows"></div>
  <div id="boardEmpty"></div>
</section>

<section id="player" class="screen">
  <div class="backbar"><button class="back" id="backBtn">‹ Leaderboard</button></div>
  <div id="playerBody"></div>
</section>

<section id="setup" class="screen">
  <header class="band">
    <div class="title">Setup</div>
    <div class="sub" id="setupSub">Players for this round</div>
  </header>
  <nav class="tabs" data-tabs></nav>
  <div id="setupRows"></div>
  <div class="pad"><button class="big solid" id="addBtn">+ Add player</button></div>
  <div id="allowanceBox"></div>
  <div id="skinsSwitch"></div>
</section>

<section id="edit" class="screen">
  <div class="backbar"><button class="back" id="editBack">‹ Setup</button></div>
  <div id="editBody"></div>
</section>

<section id="skins" class="screen">
  <header class="band">
    <div class="title">Cart Skins</div>
    <div class="sub" id="skinsSub">Cart against cart, hole by hole</div>
  </header>
  <nav class="tabs" data-tabs></nav>
  <div id="skinsFlights"></div>
  <div id="skinsBody"></div>
</section>

<section id="import" class="screen">
  <header class="band">
    <div class="title">Import scores</div>
    <div class="sub">Paste the rows from Golf Genius</div>
  </header>
  <nav class="tabs" data-tabs></nav>
  <div id="importBody"></div>
</section>

<script src="engine.js"></script>
<script src="importer.js"></script>
<script>
"use strict";
/* Rendering and setup only — every number comes from engine.js
   (window.ClubhouseEngine) and every paste is read by importer.js, the single
   implementations the tests also run. Nothing is scored or parsed in here. */
const E = window.ClubhouseEngine;
const IMP = window.ClubhouseImporter;

const CONTEST_NAMES = {
  watchTheBirdie: "Watch the Birdie", agonyAlley: "Agony Alley",
  damageControl: "Damage Control", goLong: "Go Long",
  getShorty: "Get Shorty", bounceBack: "Bounce Back",
  skins: "Cart Skins",
};
const CONTEST_ORDER = ["watchTheBirdie","agonyAlley","damageControl","goLong","getShorty","bounceBack","skins"];
const MAX_PLAYERS = 24;
const HOLES = 18;

/* ---------- persistence: a locked phone must not lose the round ---------- */
const STORE_KEY = "btc.clubhouse.v1";
// `handicaps` holds the course handicap the export printed beside a player's
// name — the one that was in force on the day. It outranks anything derived
// from today's index, because an index moves and a played round does not.
let state = { nextId: 1, players: [], scores: {}, handicaps: {}, skinsOn: true, allowancePercent: 100, flight: "", tab: "board" };

function load(){
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return;
    const s = JSON.parse(raw);
    if(s && Array.isArray(s.players)){
      state = {
        nextId: s.nextId || s.players.length + 1,
        players: s.players,
        scores: s.scores || {},
        handicaps: s.handicaps || {},
        skinsOn: s.skinsOn !== false,          // on unless it was switched off
        allowancePercent: typeof s.allowancePercent === "number" ? s.allowancePercent : 100,
        flight: typeof s.flight === "string" ? s.flight : "",

        tab: s.tab === "setup" || s.tab === "import" ? s.tab : "board",
      };
    }
  } catch(e) { /* corrupt or unavailable storage — start clean rather than die */ }
}
function save(){
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
  catch(e) { /* private browsing or full disk — the round still works in memory */ }
}

/* ---------- small helpers ---------- */
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}
function fmtFinal(x){ return x==null ? "—" : x.toFixed(1); }  // golf scores: one decimal, no hundredths
function fmtStrokes(s){
  if(s===0) return "0.0";
  let str = Math.abs(s).toFixed(2);
  if(str.endsWith("0")) str = str.slice(0,-1);   // 2.00→2.0, 0.50→0.5, 0.75 stays
  return (s<0 ? "−" : "+") + str;            // real minus sign
}
/* Shrink a nowrap element's font down from its max only as far as needed to fit
   on one line within its box, but never below min. */
function fitText(el, max, min){
  if(!el) return;
  el.style.fontSize = max + "px";
  let size = max;
  while(size > min && el.scrollWidth > el.clientWidth + 0.5){
    size -= 1;
    el.style.fontSize = size + "px";
  }
}
/* "Christiaan Bezuidenhout" -> "Christiaan B." — first name kept, surname to an initial. */
function abbreviate(full){
  const p = String(full).trim().split(/\s+/);
  return p.length < 2 ? full : p[0] + " " + p[p.length - 1].charAt(0) + ".";
}
/* Names never render below 18px (the legibility floor for this audience). Fit the
   full name down to 18; if it still won't fit, shorten the surname to an initial the
   way a clubhouse scoreboard always has, then fit that — still never below 18. */
function fitName(el, max, min){
  if(!el) return;
  const full = el.dataset.full || (el.dataset.full = el.textContent.trim());
  el.textContent = full;
  fitText(el, max, min);
  if(el.scrollWidth > el.clientWidth + 0.5){
    el.textContent = abbreviate(full);
    fitText(el, max, min);
  }
}
function fitBoardNames(){
  document.querySelectorAll("#rows .name").forEach(el => fitName(el, 26, 18));
  document.querySelectorAll("#setupRows .pname").forEach(el => fitName(el, 24, 18));
}

/* ---------- player records ---------- */
function blankPlayer(){
  return { id: "p" + (state.nextId++), name: "", index: null, tee: "IV", gender: "M",
           cart: null, flight: "", front: null, back: null };
}
/**
 * The thresholds this round is scored on. The only thing the organiser can
 * change from the app is whether Skins runs — switched off, it scores nothing
 * and no cart number is read.
 */
function contestConfig(){
  return state.skinsOn ? E.DEFAULT_CONTESTS
                       : Object.assign({}, E.DEFAULT_CONTESTS, { skins: null });
}

function courseOf(p){ return E.courseForTee(p.tee || "IV", p.gender || "M"); }
/** Course handicap as the brief computes it, or null when there's no index yet. */
/* ---------- flights ----------
   Free text, because the club names them however it likes — "A", "Front 9",
   "Seniors". The names already in use are offered for the picking so the
   organiser types each one once and the rest are a tap. Blank means the man is
   in the one undivided field. A flight is not a cart: the two are different
   groupings and nothing here assumes they line up. */

/** The flights already in use, for the autocomplete. */
function flightsInUse(){
  return E.flightsInUse(state.players).filter(f => f !== "");
}
function flightOptions(){
  return flightsInUse().map(f => `<option value="${esc(f)}"></option>`).join("");
}
/** What this player's flight currently means, in words. */
function flightHint(p){
  const f = (p.flight || "").trim();
  if(f === "") return "No flight — placed in one undivided field.";
  const mates = state.players.filter(x => x.id !== p.id && (x.flight || "").trim() === f).length;
  return mates === 0 ? "Alone in " + f + " so far."
    : "Placed against " + mates + " other" + (mates===1?"":"s") + " in " + f + ".";
}
/** The flight name to show on screen. */
function flightLabel(f){ return f === "" ? "One field" : f; }

/**
 * A row of flight buttons, shown only when the field is actually divided. An
 * undivided round never sees it and reads exactly as it did before flights.
 */
function drawFlightPicker(id, flights, current, onPick){
  const box = document.getElementById(id);
  if(!box) return;
  if(flights.length < 2){ box.innerHTML = ""; return; }
  box.innerHTML = `<nav class="flights">` + flights.map(f =>
    `<button data-f="${esc(f)}" aria-current="${f === current}">${esc(flightLabel(f))}</button>`
  ).join("") + `</nav>`;
  box.querySelectorAll("button").forEach(b =>
    b.addEventListener("click", () => onPick(b.dataset.f)));
}

/** The handicap he plays off — the event's allowance already taken off it. */
function chOf(p){
  if(p.index == null || !isFinite(p.index)) return null;
  return E.courseHandicap(p.index, courseOf(p), state.allowancePercent);
}
/** The same figure in full, before the allowance. */
function fullChOf(p){
  if(p.index == null || !isFinite(p.index)) return null;
  return E.fullCourseHandicap(p.index, courseOf(p));
}
/** "CH 33 · plays off 28 at 85%", or null when the allowance changes nothing. */
function allowanceNote(p){
  if(state.allowancePercent === 100) return null;
  // A handicap that came off a card already has the event's allowance in it, so
  // ours was never applied to him. Describing the cut would be a fiction — even
  // when the two figures happen to agree.
  if(handicapOf(p).source === "paste") return null;
  const full = fullChOf(p), plays = chOf(p);
  if(full == null || full === plays) return null;
  return "CH " + full + " · plays off " + plays + " at " + state.allowancePercent + "%";
}
/** A player is scorable once they have a name, an index and a tee. */
function isReady(p){ return !!(p.name && p.name.trim()) && p.index != null && isFinite(p.index) && !!p.tee; }
function scoresFor(p){
  const s = state.scores[p.id];
  return Array.isArray(s) && s.length === HOLES ? s : new Array(HOLES).fill(null);
}
/**
 * The name to put on the scoreboard. The setup sheet may carry whatever the
 * organiser typed — "Ridgeway, Robert (18)", straight off the export — but a
 * handicap is not part of a man's name and the board is read at arm's length,
 * so it shows "Robert Ridgeway". Setup keeps what was typed.
 */
function displayName(p){ return IMP.canonicalName(p.name) || p.name.trim(); }

/**
 * The course handicap to score a player on, and where it came from. The export
 * prints the handicap that was in force the day the round was played; an index
 * can move between then and now, so the printed one wins whenever there is one.
 */
function handicapOf(p){
  const fromPaste = state.handicaps[p.id];
  if(fromPaste != null) return { value: fromPaste, source: "paste" };
  const derived = chOf(p);
  return { value: derived, source: derived == null ? "none" : "index" };
}

/** Build the card the engine scores: the player's own tee and stroke index. */
function cardOf(p){
  const hcp = handicapOf(p);
  return {
    name: displayName(p),
    handicapIndex: p.index,
    // Set only when the export supplied one — the engine prefers it over the
    // index. The tee and gender still decide WHICH holes the strokes fall on.
    courseHandicap: hcp.source === "paste" ? hcp.value : undefined,
    // Applied only to a handicap worked out from the index. One that came off a
    // Golf Genius card already has the event's allowance in it.
    allowancePercent: state.allowancePercent,
    tee: p.tee, gender: p.gender,
    cart: p.cart,
    // Placings and Skins are settled inside a flight; the six contests ignore it.
    flight: (p.flight || "").trim(),
    gross: scoresFor(p),
    picks: (p.front && p.back) ? { front: p.front, back: p.back } : undefined,
  };
}
function readyPlayers(){ return state.players.filter(isReady); }

/* ---------- screen routing ---------- */
const SCREENS = ["board","player","setup","edit","skins","import"];
// Four tabs across a phone: short labels, so none has to shrink below 18px.
const TAB_LABELS = [["board","Leaders"],["setup","Setup"],["skins","Skins"],["import","Import"]];

function show(id){
  // Skins off takes its tab away, so there is nowhere to land — including a
  // stored tab from before it was switched off.
  if(id === "skins" && !state.skinsOn) id = "board";
  SCREENS.forEach(s => document.getElementById(s).classList.toggle("on", s === id));
  if(id === "board" || id === "setup" || id === "skins" || id === "import"){
    state.tab = id; save();
    document.querySelectorAll("nav.tabs").forEach(nav => {
      nav.querySelectorAll("button").forEach(b =>
        b.setAttribute("aria-current", String(b.dataset.go === id)));
    });
  }
  // Fit only now the screen is visible — a display:none box measures zero wide,
  // so a name fitted before the switch would be left at full size and overflow.
  fitBoardNames();
  window.scrollTo(0,0);
}
/**
 * The tabs actually on offer. Skins switched off for the round takes its tab
 * with it — there is nothing behind it to read, and a tab that only explains
 * its own absence is a tab in the way. A one-cart round keeps the tab, because
 * there it has something to say.
 */
function activeTabs(){
  return TAB_LABELS.filter(([id]) => id !== "skins" || state.skinsOn);
}

function buildTabs(){
  document.querySelectorAll("nav.tabs").forEach(nav => {
    nav.innerHTML = activeTabs().map(([id,label]) =>
      `<button data-go="${id}">${label}</button>`).join("");
    nav.querySelectorAll("button").forEach(b =>
      b.addEventListener("click", () => { if(b.dataset.go === "import") renderImport();
                                          if(b.dataset.go === "setup") renderSetup();
                                          if(b.dataset.go === "skins") renderSkins();
                                          if(b.dataset.go === "board") renderBoard();
                                          show(b.dataset.go); }));
  });
}

/* ---------- the leaderboard ---------- */
let boardCards = [];     // cards behind the rows on screen, for the detail view
let boardResults = [];   // and their scored results — Skins only exists on these

/** How an equal final was settled, said the way a golfer would say it. */
function tieNote(r){
  if(!r.cardMatch) return "";
  if(r.cardMatch.shared) return "shared — cards level";
  return r.cardMatch.wonBy === "a finished card"
    ? "won on a full card"
    : "won on " + r.cardMatch.wonBy;
}

function renderBoard(){
  const rowsEl = document.getElementById("rows");
  const emptyEl = document.getElementById("boardEmpty");
  const subEl = document.getElementById("boardSub");
  const ready = readyPlayers();

  let results;
  if(ready.length === 0){
    // Nothing set up yet — show the seeded demo round so the screen isn't blank.
    boardCards = E.SAMPLE_ROUND.slice();
    results = E.computeLeaderboard();
    subEl.textContent = "Aberdeen G&CC · demo round";
    emptyEl.innerHTML =
      `<div class="note warn">This is a demo round. Add your players on the ` +
      `<b>Setup</b> tab, then paste the scores on <b>Import</b>.</div>`;
  } else {
    boardCards = ready.map(cardOf);
    // No course argument: every card is scored against its own tee and gender.
    results = E.computeLeaderboard(boardCards, undefined, contestConfig());
    const withScores = boardCards.filter(c => c.gross.some(g => g != null)).length;
    subEl.textContent = "Aberdeen G&CC · " + ready.length + " player" + (ready.length===1?"":"s") +
      (withScores === 0 ? " · no scores yet" : "");
    emptyEl.innerHTML = withScores === 0
      ? `<div class="note">No scores imported yet. Paste them on the <b>Import</b> tab.</div>`
      : "";
  }

  // One leaderboard per flight. The picker only appears when the field is
  // actually divided — an undivided round looks exactly as it always did.
  const flights = E.sortFlights([...new Set(results.map(r => r.flight || ""))]);
  if(!flights.includes(state.flight)) state.flight = flights[0];
  drawFlightPicker("boardFlights", flights, state.flight, (f) => {
    state.flight = f; save(); renderBoard();
  });
  if(flights.length > 1){
    results = results.filter(r => (r.flight || "") === state.flight);
    subEl.textContent = subEl.textContent.replace(/·[^·]*player[^·]*/,
      "· " + flightLabel(state.flight) + " · " + results.length + " player" + (results.length===1?"":"s"));
  }

  boardResults = results;
  rowsEl.innerHTML = "";
  let markedIneligible = false;
  results.forEach(r=>{
    // Everyone who finished, then a line, then everyone who didn't.
    if(!r.eligible && !markedIneligible){
      markedIneligible = true;
      const head = document.createElement("div");
      head.className = "section-label";
      head.textContent = "Not eligible — no full round";
      rowsEl.appendChild(head);
    }
    const b = document.createElement("button");
    b.className = "row" + (r.rank===1 ? " leader" : "");
    // Net only. Gross is on the detail screen — a scoreboard is read at arm's
    // length, and the net is the number the final is built from.
    const partial = r.holesPlayed>0 && r.holesPlayed<HOLES ? " · "+r.holesPlayed+" holes" : "";
    const meta = r.net==null ? "no card yet" : "Net "+r.net+partial;
    // The holes played are already on the line above, and the heading says why,
    // so this only has to carry the one word that matters — and fit at 18px.
    const tie = r.eligible ? tieNote(r) : "not eligible";
    b.innerHTML =
      `<span class="rank">${r.eligible ? r.rank : "–"}</span>` +
      `<span class="who"><span class="name">${esc(r.name)}</span>` +
      `<span class="meta">${esc(meta)}</span>` +
      (tie ? `<span class="tie">${esc(tie)}</span>` : ``) + `</span>` +
      `<span class="final">${fmtFinal(r.final)}</span><span class="chev">›</span>`;
    b.addEventListener("click", ()=>showPlayer(r.name));
    rowsEl.appendChild(b);
  });
  fitBoardNames();
}

function showPlayer(name){
  const card = boardCards.find(c => c.name === name);
  if(!card) return;
  // Take the leaderboard's own result: Skins is settled across the field, so
  // re-scoring this card on its own would silently drop it.
  const r = boardResults.find(x => x.name === name) || E.scorePlayer(card, undefined, E.DEFAULT_CONTESTS);
  const course = E.courseFor(card);
  const off = -r.strokesEarned;                    // positive = strokes taken off the net
  // "as played" marks a handicap that came off the card rather than from the
  // index, so a figure that disagrees with the setup screen explains itself.
  const asPlayed = card.courseHandicap != null ? " as played" : "";
  // When the allowance cut the handicap, both figures are shown — the full one
  // and the one he actually played off — so the difference is never a mystery.
  const cut = r.courseHandicapFull != null && r.courseHandicapFull !== r.courseHandicap
    ? "CH " + r.courseHandicapFull + " · plays off " + r.courseHandicap +
      " at " + r.allowancePercent + "%"
    : "Course handicap " + r.courseHandicap + asPlayed;
  const teeLine = "Tee " + (course.tee || "IV") + (course.gender === "F" ? " · women's" : "") +
                  " · " + cut +
                  (r.gross==null ? "" : " · Gross " + r.gross);
  let html =
    `<div class="detail-head"><div class="name">${esc(r.name)}</div>` +
    `<div class="hcp">${esc(teeLine)}</div></div>`;

  if(r.net == null){
    html += `<div class="note">No card imported for this player yet.</div>`;
  } else {
    html +=
      `<div class="equation">` +
        `<span><span class="lab">Net</span><br><span class="num">${r.net}</span></span>` +
        `<span class="op">−</span>` +
        `<span><span class="lab">Strokes off</span><br><span class="num">${off.toFixed(2)}</span></span>` +
        `<span class="op">=</span>` +
        `<span><span class="lab">Final</span><br><span class="fin">${fmtFinal(r.final)}</span></span>` +
      `</div>`;
  }
  // The card itself, nine holes to a row. A hole he picked up shows X, never the
  // par + 4 the engine filled in — nobody should read that as a score he made.
  if(r.holesPlayed > 0){
    const cell = (i) => {
      if(card.gross[i] == null) return `<td class="blank">–</td>`;
      if(E.isPickedUp(card.gross[i])) return `<td class="xup">X</td>`;
      return `<td>${r.grossByHole[i]}</td>`;
    };
    const nine = (from) =>
      `<table class="card"><tr class="hn">` +
      Array.from({length:9}, (_,k) => `<th>${from+k}</th>`).join("") + `</tr><tr>` +
      Array.from({length:9}, (_,k) => cell(from-1+k)).join("") + `</tr></table>`;
    html += `<div class="section-label">His card</div>` +
      `<div class="cardwrap">${nine(1)}${nine(10)}</div>`;
    if(r.pickedUpHoles.length){
      html += `<div class="note">Picked up on ${r.pickedUpHoles.length===1?"hole":"holes"} ` +
        `${esc(r.pickedUpHoles.join(", "))} — scored net double, which is what picking up means. ` +
        `Those holes still count: this is a full round.</div>`;
    }
  }

  html += `<div class="section-label">The contests</div>`;

  for(const key of CONTEST_ORDER){
    const c = r.contests[key];
    if(!c) continue;                       // skins is absent when nobody has a cart
    const cls = !c.live ? "none" : c.strokes<0 ? "good" : c.strokes>0 ? "penalty" : "none";
    const shown = !c.live ? "—" : fmtStrokes(c.strokes);
    html +=
      `<div class="contest"><div class="cname">` +
      `<div class="cn">${CONTEST_NAMES[key]}</div>` +
      `<div class="cd${c.live?"":" dim"}">${esc(c.detail)}</div></div>` +
      `<div class="cs ${cls}">${shown}</div></div>`;
  }
  document.getElementById("playerBody").innerHTML = html;
  show("player");
  // Fit only after the screen is visible — a display:none box has no measurable width.
  fitName(document.querySelector("#playerBody .detail-head .name"), 36, 18);
}

/* ---------- setup: the player list ---------- */
function renderSetup(){
  const wrap = document.getElementById("setupRows");
  const sub = document.getElementById("setupSub");
  const n = state.players.length;
  sub.textContent = n === 0 ? "No players yet"
    : n + " player" + (n===1?"":"s") + (n >= MAX_PLAYERS ? " · full" : "");

  if(n === 0){
    wrap.innerHTML = `<div class="empty">Nobody set up yet. Add the players in this round —
      eight is typical, up to ${MAX_PLAYERS}.</div>`;
  } else {
    wrap.innerHTML = state.players.map(p => {
      const ch = chOf(p);
      const hcp = handicapOf(p);
      // The index gives one figure and the card another. When they disagree the
      // played one is what scores, so the column shows both rather than quietly
      // differing from the leaderboard.
      const differs = hcp.source === "paste" && ch != null && hcp.value !== ch;
      const picks = (p.front && p.back) ? "picks " + p.front + "/" + p.back : "no picks";
      const bits = [
        p.index == null ? "no index" : "idx " + E.formatHandicapIndex(p.index),
        "Tee " + p.tee + (p.gender === "F" ? " ♀" : ""),
        p.cart == null ? "no cart" : "cart " + p.cart,
        (p.flight || "").trim() === "" ? "no flight" : "flight " + (p.flight || "").trim(),
        picks,
      ];
      const allow = allowanceNote(p);
      if(allow) bits.push(allow);
      // A card's own handicap is always named, whether or not it differs from
      // the index figure — it is the one that scores, and any allowance is
      // already inside it.
      if(hcp.source === "paste") bits.push("plays off " + hcp.value + " from the card");
      return `<button class="prow" data-id="${p.id}">` +
        `<span class="pwho"><span class="pname">${esc(p.name || "(no name)")}</span>` +
        `<span class="pmeta">${esc(bits.join(" · "))}</span></span>` +
        `<span class="pch">` +
          `<span class="pchn">${ch==null?"–":ch}</span>` +
          `<span class="pchl">${differs ? "FROM INDEX" : "C.H."}</span>` +
          (differs ? `<span class="pchn">${hcp.value}</span><span class="pchl">AS PLAYED</span>` : ``) +
        `</span><span class="chev">›</span></button>`;
    }).join("");
    wrap.querySelectorAll(".prow").forEach(b =>
      b.addEventListener("click", () => editPlayer(b.dataset.id)));
  }
  document.getElementById("addBtn").disabled = n >= MAX_PLAYERS;
  drawAllowance();
  drawSkinsSwitch();
  fitBoardNames();
}

/**
 * The event's handicap allowance. Club events usually play off 85%, and the
 * figure moves the field unevenly — at 85% a 38 index gives up five shots and
 * an 8 index one — so it belongs with the round, not buried in a constant.
 */
const COMMON_ALLOWANCES = [100, 95, 90, 85, 80, 75];

function drawAllowance(){
  const pct = state.allowancePercent;
  const options = COMMON_ALLOWANCES.concat(COMMON_ALLOWANCES.includes(pct) ? [] : [pct])
    .sort((a,b) => b - a)
    .map(v => `<option value="${v}"${v===pct?" selected":""}>${v}%</option>`).join("");

  // What it actually costs the men in this round, worst and least affected.
  const ready = readyPlayers();
  let effect;
  if(pct === 100){
    effect = "Everyone plays off their full course handicap.";
  } else if(ready.length === 0){
    effect = "Applied to every player's course handicap once they are added.";
  } else {
    const cuts = ready.map(p => ({ name: displayName(p), lost: (fullChOf(p) || 0) - (chOf(p) || 0) }))
                      .sort((a,b) => b.lost - a.lost);
    const most = cuts[0], least = cuts[cuts.length - 1];
    effect = most.lost === least.lost
      ? "Costs every man " + most.lost + " shot" + (most.lost===1?"":"s") + "."
      : "Costs " + esc(most.name) + " " + most.lost + " shot" + (most.lost===1?"":"s") +
        " and " + esc(least.name) + " " + least.lost + ".";
  }

  document.getElementById("allowanceBox").innerHTML =
    `<div class="field"><label for="fAllow">Handicap allowance</label>
       <select id="fAllow">${options}</select>
       <div class="cd" style="margin-top:10px;font-size:18px;font-weight:700">${effect}</div>
     </div>`;

  document.getElementById("fAllow").addEventListener("change", (e) => {
    state.allowancePercent = Number(e.target.value);
    save();
    renderSetup(); renderBoard();
    if(state.skinsOn) renderSkins();
  });
}

/**
 * The one threshold the organiser can change from the app. Some rounds the
 * groups won't divide sensibly and he'll want to skip skins altogether — a
 * round with only one cart skips itself, but this covers the rest.
 */
function drawSkinsSwitch(){
  const carts = new Set(readyPlayers()
    .filter(p => p.cart != null && String(p.cart).trim() !== "")
    .map(p => String(p.cart)));
  const note = !state.skinsOn ? "Nobody is scored for skins this round."
    : carts.size < 2 ? "Only one cart out, so no skins today whatever this says."
    : carts.size + " carts out, playing for 18 skins.";

  document.getElementById("skinsSwitch").innerHTML =
    `<div class="field"><span class="flab">Cart Skins</span>
       <div class="seg" id="skinsSeg">
         <button type="button" data-on="1" aria-pressed="${state.skinsOn}">On</button>
         <button type="button" data-on="0" aria-pressed="${!state.skinsOn}">Off</button>
       </div>
       <div class="cd" style="margin-top:10px;font-size:18px;font-weight:700">${esc(note)}</div>
     </div>`;

  document.getElementById("skinsSeg").querySelectorAll("button").forEach(b =>
    b.addEventListener("click", () => {
      state.skinsOn = b.dataset.on === "1";
      save();
      buildTabs();                       // the Skins tab comes and goes with it
      renderSetup(); renderBoard();
      if(state.skinsOn) renderSkins();
      show("setup");                     // stay where the switch is
    }));
}

/* ---------- setup: one player's form ---------- */
let editing = null;   // a working copy; nothing is saved until Save is pressed

function editPlayer(id){
  const found = state.players.find(p => p.id === id);
  editing = found ? Object.assign({}, found) : blankPlayer();
  editing.isNew = !found;
  drawEdit();
  show("edit");
}

function drawEdit(){
  const p = editing;
  const legal = E.birdiePickHoles(courseOf(p));
  const teeOpts = E.TEE_IDS.map(t =>
    `<option value="${t}"${t===p.tee?" selected":""}>Tee ${t}</option>`).join("");
  const pickOpts = (holes, chosen) =>
    `<option value="">— not chosen —</option>` +
    holes.map(h => `<option value="${h}"${h===chosen?" selected":""}>Hole ${h}</option>`).join("");
  const ch = chOf(p);

  document.getElementById("editBody").innerHTML =
    `<div class="field"><label for="fName">Name</label>
      <input type="text" id="fName" autocomplete="off" autocapitalize="words" value="${esc(p.name)}"></div>

     <div class="field"><label for="fIndex">Handicap index</label>
      <input type="text" id="fIndex" inputmode="decimal" autocomplete="off"
        value="${esc(p.indexText != null ? p.indexText : E.formatHandicapIndex(p.index))}">
      <div id="fIndexErr" class="err" style="padding:8px 0 0"></div></div>

     <div class="field"><label for="fTee">Tee</label>
      <select id="fTee">${teeOpts}</select></div>

     <div class="field"><span class="flab">Tees and stroke index</span>
      <div class="seg" id="fGender">
        <button type="button" data-g="M" aria-pressed="${p.gender!=="F"}">Men</button>
        <button type="button" data-g="F" aria-pressed="${p.gender==="F"}">Women</button>
      </div></div>

     <div class="chread">Course handicap <b id="fCh">${ch==null?"–":ch}</b>
       <span id="fChNote" style="font-size:18px"></span></div>

     <div class="field"><label for="fCart">Cart number</label>
      <input type="number" id="fCart" inputmode="numeric" step="1" value="${p.cart==null?"":p.cart}"></div>

     <div class="field"><label for="fFlight">Flight</label>
      <input type="text" id="fFlight" list="flightList" autocomplete="off"
        placeholder="leave blank for one field" value="${esc(p.flight || "")}">
      <datalist id="flightList">${flightOptions()}</datalist>
      <div class="cd" style="margin-top:10px;font-size:18px;font-weight:700">${esc(flightHint(p))}</div></div>

     <div class="field"><span class="flab">Watch the Birdie picks</span>
      <div class="two">
        <select id="fFront" aria-label="Front nine pick">${pickOpts(legal.front, p.front)}</select>
        <select id="fBack" aria-label="Back nine pick">${pickOpts(legal.back, p.back)}</select>
      </div></div>

     <div id="fErr" class="err"></div>
     <div class="pad">
       <button class="big solid" id="fSave">Save player</button>
       <button class="big" id="fCancel">Cancel</button>
       ${p.isNew ? "" : `<button class="big danger" id="fRemove">Remove this player</button>`}
     </div>`;

  const $ = (id) => document.getElementById(id);
  const refreshCh = () => {
    const v = chOf(editing);
    $("fCh").textContent = v==null ? "–" : v;
    const c = courseOf(editing);
    const full = fullChOf(editing);
    // Show the full handicap alongside when the allowance has cut it.
    const cut = (full != null && full !== v)
      ? " · full " + full + " at " + state.allowancePercent + "%" : "";
    $("fChNote").textContent = " · " + c.courseRating.toFixed(1) + "/" + c.slope + cut;
  };
  refreshCh();

  $("fName").addEventListener("input", e => { editing.name = e.target.value; });
  $("fIndex").addEventListener("input", e => {
    // Keep exactly what was typed, so a rejected entry is never wiped from under
    // the man's thumb — he can see what he wrote and correct it.
    editing.indexText = e.target.value;
    const read = E.parseHandicapIndex(e.target.value);
    editing.index = read.value;
    editing.indexBad = !read.ok;
    $("fIndexErr").textContent = read.error || "";
    refreshCh();
  });
  $("fTee").addEventListener("change", e => { editing.tee = e.target.value; refreshCh(); });
  $("fCart").addEventListener("input", e => {
    // Same rule as the index: only a plain whole number counts, so nothing
    // unreadable can reach storage and come back as "cart NaN".
    const v = e.target.value.trim();
    editing.cart = /^\d{1,2}$/.test(v) ? Number(v) : null;
  });
  $("fFlight").addEventListener("input", e => {
    editing.flight = e.target.value;
    document.querySelector("#fFlight").parentElement.querySelector(".cd").textContent = flightHint(editing);
  });
  $("fFront").addEventListener("change", e => { editing.front = e.target.value ? Number(e.target.value) : null; });
  $("fBack").addEventListener("change", e => { editing.back = e.target.value ? Number(e.target.value) : null; });
  $("fGender").querySelectorAll("button").forEach(b =>
    b.addEventListener("click", () => {
      editing.gender = b.dataset.g;
      // The women's stroke index changes which holes get strokes, so redraw the
      // picks and the course handicap together.
      drawEdit();
    }));

  $("fSave").addEventListener("click", saveEditing);
  $("fCancel").addEventListener("click", () => { editing = null; renderSetup(); show("setup"); });
  const rm = $("fRemove");
  if(rm) rm.addEventListener("click", removeEditing);
}

function saveEditing(){
  const p = editing, err = document.getElementById("fErr");
  if(!p.name || !p.name.trim()){ err.textContent = "A name is needed."; return; }
  // Re-read the raw text rather than trusting whatever was last kept, so nothing
  // can be saved that the parser would refuse.
  const read = E.parseHandicapIndex(
    p.indexText != null ? p.indexText : E.formatHandicapIndex(p.index));
  if(!read.ok){ err.textContent = read.error; return; }
  if(read.value == null){ err.textContent = "A handicap index is needed."; return; }
  p.index = read.value;
  err.textContent = "";

  p.name = p.name.trim();
  const rec = { id: p.id, name: p.name, index: p.index, tee: p.tee, gender: p.gender,
                cart: p.cart, flight: (p.flight || "").trim(), front: p.front, back: p.back };
  const at = state.players.findIndex(x => x.id === p.id);
  if(at === -1) state.players.push(rec); else state.players[at] = rec;
  editing = null;
  save();
  renderSetup(); show("setup");
}

function removeEditing(){
  const p = editing;
  if(!window.confirm("Remove " + (p.name || "this player") + " from the round?")) return;
  state.players = state.players.filter(x => x.id !== p.id);
  delete state.scores[p.id];
  delete state.handicaps[p.id];
  editing = null;
  save();
  renderSetup(); show("setup");
}

/* ---------- cart skins ---------- */
function renderSkins(){
  const body = document.getElementById("skinsBody");
  const sub = document.getElementById("skinsSub");
  const config = contestConfig().skins;

  if(!config){
    document.getElementById("skinsFlights").innerHTML = "";
    sub.textContent = "Switched off for this round";
    body.innerHTML = `<div class="note warn">Skins is switched off for this round.
      Turn it back on at the bottom of the <b>Setup</b> tab.</div>`;
    return;
  }

  // Skins is played inside a flight: carts only ever face carts they are
  // flighted with, so this screen shows one flight at a time.
  const allFlights = E.sortFlights([...new Set(readyPlayers().map(p => (p.flight || "").trim()))]);
  if(!allFlights.includes(state.flight)) state.flight = allFlights[0] || "";
  drawFlightPicker("skinsFlights", allFlights, state.flight, (f) => {
    state.flight = f; save(); renderSkins(); renderBoard();
  });

  const inFlight = readyPlayers().filter(p =>
    allFlights.length < 2 || (p.flight || "").trim() === state.flight);
  const entered = inFlight.filter(p => p.cart != null && String(p.cart).trim() !== "");
  if(entered.length === 0){
    sub.textContent = "No carts yet";
    body.innerHTML = `<div class="note">Nobody has a cart number yet. Give each man a cart on the
      <b>Setup</b> tab and the skins will run themselves. A man with no cart simply doesn't
      compete for them.</div>`;
    return;
  }

  // Who is in which cart, for the totals.
  const byCart = new Map();
  entered.forEach(p => {
    const id = String(p.cart);
    if(!byCart.has(id)) byCart.set(id, []);
    byCart.get(id).push(displayName(p));
  });

  const carts = [...byCart.keys()].sort((a,b) => (Number(a)||0) - (Number(b)||0));

  // One cart has nobody to play against: uncontested it takes all eighteen for
  // going round on its own. No skins on a round that never divided into two.
  if(carts.length < 2){
    sub.textContent = "Only one cart out";
    body.innerHTML =
      `<div class="note warn"><b>No skins today — only one cart out.</b><br>
        Skins is cart against cart, and a cart on its own wins every hole by
        default. Give the men a second cart number on the <b>Setup</b> tab and
        the skins will run.</div>` +
      `<div class="contest"><div class="cname"><div class="cn">Cart ${esc(carts[0])}</div>` +
      `<div class="cd">${esc(byCart.get(carts[0]).join(" & "))}</div></div>` +
      `<div class="pvt" style="text-align:right"><div class="cd">not playing for skins</div></div></div>`;
    return;
  }

  const cards = entered.map(cardOf);
  const table = E.cartSkins(cards.map(c => ({ card: c, cart: c.cart })), undefined);
  const won = (id) => table.skins.get(id) || 0;
  const played = cards.some(c => c.gross.some(g => g != null));
  sub.textContent = played
    ? carts.length + " cart" + (carts.length===1?"":"s") + " · 18 skins on the round"
    : "No scores imported yet";

  // The cap is one cart's even share of the eighteen, so it depends on how many
  // carts are out — pass the count or every total comes back uncapped.
  const cap = E.skinCap(config, carts.length);

  let html = `<div class="section-label">Totals by cart</div>`;
  html += carts.slice().sort((a,b) => won(b) - won(a) || (Number(a)||0)-(Number(b)||0)).map(id => {
    const n = won(id);
    const strokes = E.skinStrokes(n, config, carts.length);
    return `<div class="contest"><div class="cname">` +
      `<div class="cn">Cart ${esc(id)}</div>` +
      `<div class="cd">${esc(byCart.get(id).join(" &amp; ").replace(/&amp;/g, "&"))}</div></div>` +
      `<div class="pvt" style="text-align:right;white-space:nowrap">` +
        `<div class="cn">${n} skin${n===1?"":"s"}</div>` +
        `<div class="cd">${strokes === 0 ? "0.0" : fmtStrokes(strokes)}</div></div></div>`;
  }).join("");

  html += `<div class="note">Most a cart can earn today: <b>${fmtStrokes(cap)}</b> —
    an even share of the eighteen skins between ${carts.length} cart${carts.length===1?"":"s"}.
    The fewer carts are out, the more the skins are worth.</div>`;

  if(table.carried > 0){
    html += `<div class="note warn">${table.carried} skin${table.carried===1?"":"s"} still
      carrying after the 18th. Those vanish — nobody is paid for them.</div>`;
  }

  html += `<div class="section-label">Hole by hole</div>`;
  html += table.holes.map(h => {
    const par = E.ABERDEEN_TEE_IV.par[h.hole - 1];
    const avg = h.wonBy != null ? h.averages.get(h.wonBy) : null;
    const right = h.wonBy != null
      ? `<span class="cn">Cart ${esc(h.wonBy)}</span>` +
        (h.pot > 1 ? ` <span class="tag">${h.pot} skins</span>` : ``)
      : (h.averages.size === 0
          ? `<span class="cd">not played</span>`
          : `<span class="cd">tied — carries on</span>`);
    return `<div class="prev"><div class="pv">` +
        `<div class="pvn">Hole ${h.hole}<span class="cd" style="font-weight:700"> · par ${par}</span></div>` +
        `<div class="pvd">${avg == null ? "&nbsp;" : "won on " + (Math.round(avg*10)/10)}</div>` +
      `</div><div class="pvt">${right}</div></div>`;
  }).join("");

  html += `<div class="note">A cart's score on a hole is the <b>average</b> of its players' net
    scores, not the total — that is what lets a one-man cart compete fairly, with no blind
    partner. A tied hole carries its skin into the next.</div>`;

  body.innerHTML = html;
}

/* ---------- import ---------- */
let importMode = "auto";     // auto | net | gross — what the pasted hole columns are
let importPreview = null;    // the parsed rows, held until Use these scores

function renderImport(){
  const body = document.getElementById("importBody");
  body.innerHTML =
    `<div class="pad">
       <div class="field" style="border:0;padding:0 0 12px">
         <label for="paste">Paste the player rows</label>
         <textarea id="paste" spellcheck="false" autocapitalize="off" autocomplete="off"
           placeholder="Select the rows in the Golf Genius leaderboard, copy, and paste here."></textarea>
       </div>
       <div class="field" style="border:0;padding:0 0 12px">
         <span class="flab">The hole columns are</span>
         <div class="seg" id="mode">
           <button type="button" data-m="auto" aria-pressed="${importMode==="auto"}">Work it out</button>
           <button type="button" data-m="net" aria-pressed="${importMode==="net"}">Net</button>
           <button type="button" data-m="gross" aria-pressed="${importMode==="gross"}">Gross</button>
         </div>
       </div>
       <button class="big solid" id="parseBtn">Show what this contains</button>
     </div>
     <div id="previewBox"></div>`;

  document.getElementById("mode").querySelectorAll("button").forEach(b =>
    b.addEventListener("click", () => {
      importMode = b.dataset.m;
      b.parentElement.querySelectorAll("button").forEach(x =>
        x.setAttribute("aria-pressed", String(x.dataset.m === importMode)));
      if(importPreview) doPreview();
    }));
  document.getElementById("parseBtn").addEventListener("click", doPreview);
}

/** Decide what one parsed row means for the player chosen for it, uncommitted. */
function assess(row, idx, all){
  const card = row.card;
  const player = row.playerId ? state.players.find(p => p.id === row.playerId) || null : null;
  const mode = importMode === "auto" ? card.mode : importMode;

  const out = { card, player, mode, gross: null, problems: [], warnings: [] };
  if(!player){
    out.problems.push(row.how === "ambiguous"
      ? "two players share that name — choose below"
      : "no player chosen — pick one below");
    return out;
  }
  // Two rows on one man would quietly drop a card, and hand-picking makes that
  // easy to do. Refuse both rather than choose between them.
  if(all && all.some((r, j) => j !== idx && r.playerId === row.playerId)){
    out.problems.push("another row is already assigned to " + player.name);
    return out;
  }
  if(!isReady(player)){ out.problems.push("player needs an index and a tee on Setup"); return out; }
  if(card.holesPlayed === 0){ out.problems.push("no hole scores in this row"); return out; }
  if(mode === "unknown"){
    out.problems.push("can't tell net from gross — choose Net or Gross above");
    return out;
  }

  const course = courseOf(player);
  if(mode === "gross"){
    out.gross = card.holes.slice();
  } else {
    // Golf Genius already took the strokes off. Put them back with the handicap
    // it used — the one printed after the name — so the engine can take them off
    // again against this player's own stroke index.
    const ch = card.handicap != null ? card.handicap : chOf(player);
    if(ch == null){ out.problems.push("no course handicap in the paste to undo the strokes"); return out; }
    // A picked-up hole has no net to add strokes back to — it carries its X
    // through untouched and the engine fills it in at par + 4.
    const numeric = card.holes.map(h => E.isPickedUp(h) ? null : h);
    const rebuilt = E.grossFromNet(numeric, course, ch);
    out.gross = card.holes.map((h, i) => E.isPickedUp(h) ? h : rebuilt[i]);
    out.usedHandicap = ch;
  }

  // Say plainly which handicap this card will be scored on, and where it came
  // from — the export's is used whenever it has one, even when setup disagrees.
  const setupCh = chOf(player);
  if(card.handicap != null){
    out.applied = card.handicap;
    out.appliedFrom = "paste";
    out.warnings.push(setupCh != null && card.handicap !== setupCh
      ? "handicap " + card.handicap + " from the paste, not the " + setupCh + " today's index gives"
      : "handicap " + card.handicap + " from the paste");
  } else if(setupCh != null){
    out.applied = setupCh;
    out.appliedFrom = "index";
    out.warnings.push("handicap " + setupCh + " from the index — the paste printed none");
  }
  if(card.pickedUp > 0){
    // Picked up: the hole has no number, so the eighteen can't be checked
    // against the Total. Say what will be scored instead of a silent guess.
    out.warnings.push("picked up on " + card.pickedUp + " hole" + (card.pickedUp===1?"":"s") +
      " — each scored net double");
  } else {
    const total = out.gross.reduce((a,h) => a + (h==null?0:h), 0);
    if(card.grossTotal != null && card.holesPlayed === HOLES && total !== card.grossTotal){
      out.warnings.push("gross works out to " + total + ", the Total column says " + card.grossTotal);
    }
  }
  return out;
}

const HOW_SAID = {
  exact: "matched by name",
  reversed: "matched after turning “Last, First” around",
  initial: "matched on first name and last initial",
  chosen: "you chose this player",
};

function doPreview(){
  const text = document.getElementById("paste").value;
  const parsed = IMP.parseScores(text);
  // Auto-match each row to the roster, and remember HOW so the screen can say so.
  const names = state.players.map(p => p.name);
  const rows = parsed.cards.map(card => {
    const m = IMP.matchName(card.name, names);
    return { card, playerId: m.index >= 0 ? state.players[m.index].id : null, how: m.how };
  });
  importPreview = { rows, errors: parsed.errors };
  drawPreview();
}

function drawPreview(){
  const box = document.getElementById("previewBox");
  if(!importPreview) { box.innerHTML = ""; return; }
  const { rows, errors } = importPreview;

  if(rows.length === 0){
    box.innerHTML = `<div class="note warn">Nothing readable in that paste yet.` +
      (errors.length ? `<br>` + errors.map(esc).join("<br>") : ``) + `</div>`;
    return;
  }

  const seen = rows.map(assess);
  const usable = seen.filter(a => a.gross);
  const options = (chosen) =>
    `<option value=""${chosen?"":" selected"}>— nobody —</option>` +
    state.players.map(p =>
      `<option value="${p.id}"${p.id===chosen?" selected":""}>${esc(p.name || "(no name)")}</option>`).join("");

  // Rows needing a hand come first. With a two-dozen man field the three that
  // need picking must not be buried down the list. Sort is stable, so within
  // each group the paste's own order is kept, and `i` stays the row's real
  // index so the dropdowns still address the right card.
  const needing = [], ready = [];
  rows.forEach((row, i) => (seen[i].problems.length ? needing : ready).push({ row, i }));
  const groups = [
    { list: needing, label: needing.length === 1 ? "1 needs a player" : needing.length + " need a player" },
    { list: ready,   label: ready.length + " ready to import" },
  ];

  let html = "";
  for(const group of groups){
    if(group.list.length === 0) continue;
    html += `<div class="section-label">${esc(group.label)}</div>`;
    html += group.list.map(({ row, i }) => {
      const a = seen[i];
      const bad = a.problems.length > 0;
      const bits = [row.card.holesPlayed + " of 18 holes"];
      if(!bad) bits.push(a.mode === "net" ? "net holes" : "gross holes");
      if(row.card.handicap != null) bits.push("hcp " + row.card.handicap);
      const said = HOW_SAID[row.how];
      const detail = bad ? a.problems.join(" · ") : bits.concat(a.warnings).join(" · ");
      return `<div class="prev"><div class="pv">` +
          `<div class="pvn">${esc(row.card.name)}</div>` +
          `<div class="pvd">${esc(detail)}</div>` +
          (said && !bad ? `<div class="pvd">${said}</div>` : ``) +
        `</div>` +
        `<div class="pvt"><span class="tag${bad?" no":""}">${bad ? "skip" : "ready"}</span></div></div>` +
        `<div class="field" style="border-bottom-width:2px">` +
          `<label for="pick${i}">Scores belong to</label>` +
          `<select id="pick${i}" data-row="${i}">${options(row.playerId)}</select></div>`;
    }).join("");
  }

  if(errors.length){
    html += `<div class="note warn"><b>Rows the parser rejected</b><br>` +
      errors.map(esc).join("<br>") + `</div>`;
  }

  if(usable.length === 0){
    // Refuse outright. A paste that matched nobody must never be allowed to
    // clear a round that is already on the phone.
    html += `<div class="note warn"><b>Nothing to import, so nothing has changed.</b><br>` +
      `None of these rows is assigned to a player in this round, so there is ` +
      `nothing to replace the scores with. Pick the players above, or check you ` +
      `pasted the right event. The round on this phone has been left exactly as it was.</div>`;
    html += `<div class="pad"><button class="big" id="discardBtn">Discard this paste</button></div>`;
  } else {
    const cleared = state.players.filter(p =>
      isReady(p) && state.scores[p.id] && !usable.some(a => a.player && a.player.id === p.id));
    if(cleared.length){
      html += `<div class="note warn"><b>These players are not in this paste</b><br>` +
        cleared.map(p => esc(p.name)).join(", ") +
        `<br>Their scores will be cleared — a paste replaces the round, it never merges.</div>`;
    }
    html += `<div class="pad">` +
      `<button class="big solid" id="commitBtn">Use these ${usable.length} card${usable.length===1?"":"s"}</button>` +
      `<button class="big" id="discardBtn">Discard this paste</button></div>`;
  }

  box.innerHTML = html;
  box.querySelectorAll("select[data-row]").forEach(sel =>
    sel.addEventListener("change", () => {
      const row = importPreview.rows[Number(sel.dataset.row)];
      row.playerId = sel.value || null;
      row.how = sel.value ? "chosen" : null;
      drawPreview();
    }));
  const commit = document.getElementById("commitBtn");
  if(commit) commit.addEventListener("click", commitImport);
  document.getElementById("discardBtn").addEventListener("click", () => {
    importPreview = null;
    document.getElementById("paste").value = "";
    document.getElementById("previewBox").innerHTML = "";
  });
}

function commitImport(){
  if(!importPreview) return;
  const usable = importPreview.rows.map(assess).filter(a => a.gross && a.player);
  // Never let an empty import wipe the round — the screen refuses this too, but
  // the guard belongs next to the write, not only next to the button.
  if(usable.length === 0) return;

  // A paste replaces the round rather than merging into it (brief section 4).
  state.scores = {};
  state.handicaps = {};
  usable.forEach(a => {
    state.scores[a.player.id] = a.gross;
    // Keep the day's handicap with the card it belongs to, not just for scoring
    // now but so a later reload still scores the round as it was played.
    if(a.card.handicap != null) state.handicaps[a.player.id] = a.card.handicap;
  });
  importPreview = null;
  save();
  renderBoard();
  show("board");
}

/* ---------- wiring ---------- */
document.getElementById("backBtn").addEventListener("click", () => { renderBoard(); show("board"); });
document.getElementById("editBack").addEventListener("click", () => { editing = null; renderSetup(); show("setup"); });
document.getElementById("addBtn").addEventListener("click", () => {
  if(state.players.length >= MAX_PLAYERS) return;
  editPlayer(null);
});
// Re-fit names when the viewport changes (rotation, split-view, browser resize).
window.addEventListener("resize", fitBoardNames);

load();
buildTabs();
renderBoard();
renderSetup();
if(state.skinsOn) renderSkins();
renderImport();
show(state.tab);
</script>
