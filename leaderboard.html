<script>
"use strict";
/* Rendering and setup only — every number comes from engine.js
   (window.ClubhouseEngine) and every paste is read by importer.js, the single
   implementations the tests also run. Nothing is scored or parsed in here. */
const E = window.ClubhouseEngine;
const IMP = window.ClubhouseImporter;
const XP = window.ClubhouseExporter;
const RS = window.ClubhouseResults;
const IMG = window.ClubhouseBoardImage;
const D  = window.ClubhouseDisplay;
/* The display helpers live in display.js so results.html can use the same ones.
   Pulled onto locals here so every call site below reads exactly as it did. */
const { esc, fmtFinal, fmtStrokes, fitText, abbreviate, fitName, niceDate,
        MONTHS, CONTEST_NAMES } = D;

/* The order a card reads down the screen. Six Pack sits directly under Watch
   the Birdie because they are two halves of the same twelve holes — the six he
   chose and the six he did not — and reading them apart makes neither clear. */
const CONTEST_ORDER = ["watchTheBirdie","sixPack","agonyAlley","easyStreet",
                       "tripleThreat","hitList","damageControl","goLong",
                       "getShorty","bounceBack","skins"];

/**
 * The contests this club actually plays. A contest switched off in the engine's
 * config is not in the game at all and is left off the screen entirely — quite
 * different from one that IS in the game and scored a man nothing, which still
 * gets a line saying so.
 *
 * Skins is the exception and stays listed: it is switched off per ROUND from
 * Setup, not in the code, so "not scored in this round" is exactly right for it.
 */
function contestsInPlay(){
  const cfg = contestConfig();
  return CONTEST_ORDER.filter(k => k === "skins" || cfg[k] != null);
}
const MAX_PLAYERS = 24;
/* Xs on a card at or above this many stop the import and ask. Below it they are
   taken as pick-ups without comment, which is what they nearly always are. */
const X_QUERY_FROM = 3;
const HOLES = 18;

/* ---------- persistence: a locked phone must not lose the round ----------
   The club plays Friday and Saturday, so the phone holds several events at
   once. Each one keeps its own players, scores, flights and settings, and
   `state` always points AT THE CURRENT EVENT — everything downstream reads and
   writes it exactly as it did when there was only ever one. */
const STORE_KEY = "btc.clubhouse.v2";
const LEGACY_KEY = "btc.clubhouse.v1";     // the single round, before events

/* How the round was played. The app scores individual net, but the club runs
   other formats and the export has to say which one a card came from. Free
   text, with the usual ones offered. */
const DEFAULT_FORMAT = "Individual net";
const COMMON_FORMATS = ["Individual net", "Individual gross", "Stableford",
                        "Better ball", "Best two of four", "Scramble"];

let store = { version: 2, nextEventId: 1, currentId: null, events: [] };
// `handicaps` holds the course handicap the export printed beside a player's
// name — the one that was in force on the day. It outranks anything derived
// from today's index, because an index moves and a played round does not.
let state = null;

function todayISO(){
  const d = new Date();
  const p = (n) => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}

/** An empty event, ready to be set up. */
function blankEvent(name, date){
  return {
    id: "e" + (store.nextEventId++),
    name: name || "New event",
    date: date || todayISO(),
    format: DEFAULT_FORMAT,
    nextId: 1, players: [], scores: {}, handicaps: {},
    skinsOn: true, autoPicks: false, allowancePercent: 100, flight: "", lastTee: "IV", tab: "setup",
    // Null means the defaults. A diff, never a copy — see mergeContests.
    contests: null,
    exportedAt: null, exportedSignature: null,
  };
}

/**
 * Bring one stored player up to date. Watch the Birdie went from two picks to
 * six, and a round already on a phone — or in an event code already messaged to
 * someone — carries the old `front`/`back` pair. Both were par 4s, so they
 * become the par 4 slots.
 *
 * A pick on a hole since barred is dropped. It was chosen under the old rules
 * and there is nothing to guess at; the man is shown as missing that slot,
 * which is true, rather than being refused his round.
 */
function normalisePlayer(p){
  const out = Object.assign({}, p);
  const legal = E.birdiePickHoles(courseOf(out));
  // Where a slot's holes may have come from, oldest form last. The par 3s and
  // par 5s used to be split front and back; f3/b3 become the two par 3 slots
  // and f5/b5 the two par 5s, and the par 4 slots reach all the way back to the
  // original two-pick `front`/`back` pair.
  const was = {
    p4f: [out.f4, out.front],
    p4b: [out.b4, out.back],
    p3a: [out.f3], p3b: [out.b3],
    p5a: [out.f5], p5b: [out.b5],
  };
  E.PICK_SLOTS.forEach(sl => {
    let v = out[sl.key];
    if(v == null) for(const older of (was[sl.key] || [])){ if(older != null){ v = older; break; } }
    // A pick on a hole since barred is DROPPED, not refused. Holes 4 and 13
    // were legal under the old slots and are not now; the man shows as missing
    // that slot, which is true, rather than losing his round to an error.
    out[sl.key] = (v != null && legal[sl.key].indexOf(v) !== -1) ? v : null;
  });
  ["front","back","f3","f4","f5","b3","b4","b5"].forEach(k => { delete out[k]; });
  // The man he named, and his team for Team Skins. Both are plain strings.
  out.hitList = typeof out.hitList === "string" ? out.hitList : "";
  out.team = typeof out.team === "string" ? out.team : "";
  return out;
}

/** Fill in anything a stored event is missing, so an old blob still opens. */
function normaliseEvent(e, fallbackName){
  return {
    id: e.id || ("e" + (store.nextEventId++)),
    name: typeof e.name === "string" && e.name.trim() ? e.name : (fallbackName || "Round"),
    date: /^\d{4}-\d{2}-\d{2}$/.test(e.date) ? e.date : todayISO(),
    format: typeof e.format === "string" && e.format.trim() ? e.format : DEFAULT_FORMAT,
    nextId: e.nextId || (Array.isArray(e.players) ? e.players.length + 1 : 1),
    players: (Array.isArray(e.players) ? e.players : []).map(normalisePlayer),
    scores: e.scores || {},
    handicaps: e.handicaps || {},
    contests: e.contests && typeof e.contests === "object" ? e.contests : null,
    skinsOn: e.skinsOn !== false,            // on unless it was switched off
    // Off unless it was deliberately switched on — a drawn pick is not a
    // chosen one, so it never happens by default.
    autoPicks: e.autoPicks === true,
    allowancePercent: typeof e.allowancePercent === "number" ? e.allowancePercent : 100,
    flight: typeof e.flight === "string" ? e.flight : "",
    lastTee: typeof e.lastTee === "string" ? e.lastTee : "IV",
    tab: e.tab === "setup" || e.tab === "import" || e.tab === "skins" ? e.tab : "board",
    // Carried through, or the delete warning would forget an export had happened.
    exportedAt: typeof e.exportedAt === "string" ? e.exportedAt : null,
    exportedSignature: typeof e.exportedSignature === "string" ? e.exportedSignature : null,
  };
}

function currentEvent(){
  return store.events.find(e => e.id === store.currentId) || store.events[0];
}

function load(){
  // 1 · the events store
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const s = JSON.parse(raw);
      if(s && Array.isArray(s.events) && s.events.length){
        store.nextEventId = s.nextEventId || s.events.length + 1;
        store.events = s.events.map((e, i) => normaliseEvent(e, "Round " + (i + 1)));
        store.currentId = s.currentId;        // the last one opened comes back
        state = currentEvent();
        store.currentId = state.id;
        return;
      }
    }
  } catch(e) { /* corrupt or unavailable storage — fall through and start clean */ }

  // 2 · a round saved before events existed becomes the first event. The old
  // key is deliberately left where it is: if anything here is wrong, the
  // original round is still on the phone untouched.
  try {
    const old = localStorage.getItem(LEGACY_KEY);
    if(old){
      const s = JSON.parse(old);
      if(s && Array.isArray(s.players)){
        const first = normaliseEvent(Object.assign({}, s, { name: "First round" }));
        store.events = [first];
        store.currentId = first.id;
        state = first;
        save();
        return;
      }
    }
  } catch(e) { /* the old round is unreadable — start clean rather than die */ }

  // 3 · nothing stored at all
  const fresh = blankEvent("Round 1");
  store.events = [fresh];
  store.currentId = fresh.id;
  state = fresh;
}
function save(){
  // `state` is one of store.events, so saving the store saves the open event
  // and every other one along with it.
  try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); }
  catch(e) { /* private browsing or full disk — the round still works in memory */ }
}

/* ---------- events ---------- */

/** Open another event. Everything on screen is redrawn against it. */
function openEvent(id){
  const found = store.events.find(e => e.id === id);
  if(!found) return;
  store.currentId = id;
  state = found;
  save();
  buildTabs();                      // the Skins tab follows this event's switch
  renderBoard(); renderSetup(); renderImport();
  if(state.skinsOn) renderSkins();
  show("setup");
}

function addEvent(){
  const e = blankEvent("Round " + (store.events.length + 1));
  store.events.push(e);
  openEvent(e.id);
}

function removeEvent(id){
  const e = store.events.find(x => x.id === id);
  if(!e) return;
  const players = e.players.length;
  const warn = "Delete " + (e.name || "this event") +
    (players ? " and its " + players + " player" + (players===1?"":"s") : "") +
    "? This cannot be undone." +
    // The round is about to be gone for good, so this is the last moment
    // anyone can be told that no current copy of it exists off the phone.
    (XP.changedSinceExport(e)
      ? (e.exportedAt
          ? "\n\nIt has CHANGED since it was exported on " + niceDate(String(e.exportedAt).slice(0,10)) + "."
          : "\n\nThis event has NOT been exported.")
      : "");
  if(!window.confirm(warn)) return;

  store.events = store.events.filter(x => x.id !== id);
  // There is always an event to be in: deleting the last one leaves a fresh one
  // rather than a screen with nothing behind it.
  if(store.events.length === 0) store.events.push(blankEvent("Round 1"));
  openEvent(store.events[0].id);
}

/**
 * Write the open event out as a CSV and hand it to the phone. One row a player,
 * scored exactly as the leaderboard scores them — the whole field, every flight,
 * not just the one being looked at.
 */
function exportEvent(){
  const ready = readyPlayers();
  const cards = ready.map(cardOf);
  const results = cards.length
    ? E.computeLeaderboard(cards, undefined, contestConfig())
    : [];

  const csv = XP.eventToCsv(state, results, {
    displayNameOf: displayName,
    holesOf: (p) => scoresFor(p),
  });
  const name = XP.csvFilename(state.name, state.date);
  downloadFile(name, csv, "text/csv;charset=utf-8");

  // Record WHAT was exported, not just that it happened, so a round that moves
  // afterwards is known to have moved.
  state.exportedAt = new Date().toISOString();
  state.exportedSignature = XP.eventSignature(state);
  save();
  renderSetup();
  return name;
}

/** Hand a file to the phone. A blob and a link — nothing to install, works offline. */
function downloadFile(filename, text, mime){
  // A byte order mark, so a spreadsheet opens the accents in a name correctly
  // instead of showing mojibake.
  const blob = new Blob(["﻿", text], { type: mime || "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
}

/* ---------- moving an event between devices ---------- */

/* A code much longer than this has been seen to come through a phone's
   clipboard with its head cut off. Below it, messaging is fine; above it, say
   so and point at the file, which has no length to run out of. */
const CODE_LENGTH_WARN = 1500;

/** How long this event's code is, and whether that is asking for trouble. */
function codeLengthNote(code){
  const n = code.length;
  return n > CODE_LENGTH_WARN
    ? n + " characters — long. If it will not paste at the other end, send the file instead."
    : n + " characters.";
}

/** Put the whole event on the clipboard as one line of text. */
function copyEvent(){
  const code = XP.encodeEvent(state);
  const done = (msg) => {
    document.getElementById("eventTransfer").innerHTML =
      `<div class="note">${esc(msg)}<br><b>${esc(codeLengthNote(code))}</b></div>` +
      `<div style="padding:12px 0 0"><button class="big" id="fSaveFile">Send as a file instead</button></div>`;
    document.getElementById("fSaveFile").addEventListener("click", saveEventFile);
  };
  // The clipboard needs a tap behind it, which a button press is. Where it is
  // refused anyway — an old browser, or a page not served securely — the code
  // is put on screen to be copied by hand rather than lost.
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(code).then(
      () => done("Copied. Message it to yourself, then use “Paste an event” on the other device."),
      () => showCodeToCopy(code));
  } else {
    showCodeToCopy(code);
  }
}

/**
 * The same code as a file, for AirDrop. A message can cut a long code short;
 * a file cannot, so this is the way that always works — at the cost of the
 * file picker at the far end.
 */
function saveEventFile(){
  const code = XP.encodeEvent(state);
  const name = XP.csvFilename(state.name, state.date).replace(/\.csv$/, ".btc");
  downloadFile(name, code, "text/plain;charset=utf-8");
  document.getElementById("eventTransfer").innerHTML =
    `<div class="note">Saved as <b>${esc(name)}</b>. AirDrop it to the other device,
      then use “Paste an event” there and choose <b>Open a .btc file</b>.</div>`;
}

function showCodeToCopy(code){
  document.getElementById("eventTransfer").innerHTML =
    `<div class="field"><label for="eventCode">Copy this text</label>
       <textarea id="eventCode" readonly spellcheck="false" autocorrect="off"
         autocapitalize="off" autocomplete="off">${esc(code)}</textarea>
       <div class="cd" style="margin-top:10px;font-size:18px;font-weight:700">
         The clipboard was not available, so here it is to copy by hand.</div></div>`;
  const el = document.getElementById("eventCode");
  el.focus(); el.select();
}

/** Open the box a code is pasted into. */
function showPasteBox(){
  document.getElementById("eventTransfer").innerHTML =
    `<div class="field"><label for="pasteEvent">Paste the event code</label>
       <textarea id="pasteEvent" spellcheck="false" autocorrect="off"
         autocapitalize="off" autocomplete="off"
         placeholder="${esc(XP.CODE_PREFIX)}…"></textarea>
       <div id="pasteMsg" class="err" style="padding:8px 0 0"></div></div>
     <div style="padding:0 0 12px"><button class="big solid" id="fTakePaste">Add this event</button></div>
     <div class="field"><label for="fEventFile">…or open a .btc file</label>
       <input type="file" id="fEventFile" accept=".btc,.txt,text/plain">
       <div class="cd" style="margin-top:10px;font-size:18px;font-weight:700">
         For a round too long to message: AirDrop the file, then open it here.</div></div>`;
  document.getElementById("fTakePaste").addEventListener("click", takePastedEvent);
  document.getElementById("fEventFile").addEventListener("change", openEventFile);
  document.getElementById("pasteEvent").focus();
}

/** Read a .btc file into the paste box, then take it as if it had been pasted. */
function openEventFile(ev){
  const file = ev.target.files && ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    document.getElementById("pasteEvent").value = String(reader.result || "");
    takePastedEvent();
  };
  reader.onerror = () => {
    document.getElementById("pasteMsg").textContent =
      "That file could not be read. Try AirDropping it again.";
  };
  reader.readAsText(file);
}

function takePastedEvent(){
  const text = document.getElementById("pasteEvent").value;
  const read = XP.decodeEvent(text);
  if(!read.ok){
    document.getElementById("pasteMsg").textContent = read.error;
    return;
  }

  // An event of the same name is almost certainly the same round, carried over
  // from the other device. Replacing is what is wanted; doing it silently is not.
  const wanted = (read.event.name || "").trim().toLowerCase();
  const clash = store.events.find(e => (e.name || "").trim().toLowerCase() === wanted && wanted !== "");
  if(clash){
    const players = clash.players.length;
    const ok = window.confirm(
      "An event called “" + clash.name + "” is already on this device" +
      (players ? ", with " + players + " player" + (players===1?"":"s") : "") + ".\n\n" +
      "Replace it with the pasted one? Everything currently in it is lost." +
      (XP.changedSinceExport(clash) ? "\n\nIt has not been exported since it last changed." : ""));
    if(!ok) return;
    store.events = store.events.filter(e => e.id !== clash.id);
  }

  const brought = normaliseEvent(Object.assign({}, read.event, { id: null }));
  store.events.push(brought);
  save();
  openEvent(brought.id);
}

/** Events in date order, newest first — the one being played is near the top. */
function eventsInOrder(){
  return store.events.slice().sort((a, b) =>
    (b.date || "").localeCompare(a.date || "") || (a.name || "").localeCompare(b.name || ""));
}

/** "Friday · 5 August 2026", for a picker or a heading. */
function eventLabel(e){
  return (e.name || "Untitled") + " · " + niceDate(e.date);
}

/** Whether a copy of this event has ever left the phone, in words. */
function exportNote(e){
  if(!e.exportedAt) return "Not yet exported.";
  const when = niceDate(String(e.exportedAt).slice(0, 10));
  return XP.changedSinceExport(e)
    ? "Changed since it was exported on " + when + "."
    : "Exported " + when + ", and unchanged since.";
}

/**
 * The same fact as `exportNote`, put as what it costs to press Delete. The
 * heading of the section already carries the plain version, so this one says
 * what the button below it will do rather than repeating it.
 */
function deleteNote(e){
  if(!e.exportedAt) return "Nothing has been saved off this phone yet — deleting loses the round.";
  const when = niceDate(String(e.exportedAt).slice(0, 10));
  return XP.changedSinceExport(e)
    ? "Changed since it was exported on " + when + " — deleting loses those changes."
    : "Exported " + when + " and unchanged since — safe to delete.";
}

/* ---------- small helpers ---------- */
function fitBoardNames(){
  document.querySelectorAll("#rows .name").forEach(el => fitName(el, 26, 18));
  document.querySelectorAll("#setupRows .pname").forEach(el => fitName(el, 24, 18));
}

/* ---------- player records ---------- */
function blankPlayer(){
  // Almost every round is men off the same tee, so a new man arrives set that
  // way and the organiser changes it only when it is not true.
  return { id: "p" + (state.nextId++), name: "", ghin: "", index: null,
           tee: state.lastTee || "IV", gender: "M",
           cart: null, team: "", flight: "", hitList: "",
           p4f: null, p4b: null, p3a: null, p3b: null, p5a: null, p5b: null };
}
/**
 * The thresholds this round is scored on. The only thing the organiser can
 * change from the app is whether Skins runs — switched off, it scores nothing
 * and no cart number is read.
 */
/**
 * THE RULES THIS EVENT IS PLAYED UNDER.
 *
 * The defaults, with the event's own changes laid over them. `state.contests`
 * holds a DIFF and is null on an ordinary round, so "was this played on the
 * defaults?" is a null check — which is what the board, the shared view and the
 * CSV all mark on.
 *
 * The Skins switch on Setup stays where it was and still wins: it is a
 * per-round decision the organiser makes on the day, not a rule change.
 */
function contestConfig(){
  const merged = E.mergeContests(E.DEFAULT_CONTESTS, state.contests || null);
  return state.skinsOn ? merged : Object.assign({}, merged, { skins: null });
}

/** True when this round is not being scored on the defaults. */
function rulesChanged(){ return !!state.contests; }

/** A short account of what was changed, for the board and the shared view. */
function changedRulesNote(){
  if(!state.contests) return "";
  const names = Object.keys(state.contests)
    .map(k => CONTEST_NAMES[k] || k)
    .filter(Boolean);
  return names.length <= 3 ? names.join(", ")
    : names.slice(0, 2).join(", ") + " and " + (names.length - 2) + " more";
}

function courseOf(p){ return E.courseForTee(p.tee || "IV", p.gender || "M"); }
/** Course handicap as the brief computes it, or null when there's no index yet. */
/* ---------- flights ----------
   Free text, because the club names them however it likes — "A", "Front 9",
   "Seniors". The names already in use are offered for the picking so the
   organiser types each one once and the rest are a tap. Blank means the man is
   in the one undivided field. A flight is not a cart: the two are different
   groupings and nothing here assumes they line up. */

/** The flights already in use, for the autocomplete. */
function flightsInUse(){
  return E.flightsInUse(state.players).filter(f => f !== "");
}
function flightOptions(){
  return flightsInUse().map(f => `<option value="${esc(f)}"></option>`).join("");
}
/** What this player's flight currently means, in words. */
function flightHint(p){
  const f = (p.flight || "").trim();
  if(f === "") return "No flight — placed in one undivided field.";
  const mates = state.players.filter(x => x.id !== p.id && (x.flight || "").trim() === f).length;
  return mates === 0 ? "Alone in " + f + " so far."
    : "Placed against " + mates + " other" + (mates===1?"":"s") + " in " + f + ".";
}
/** The flight name to show on screen. */
function flightLabel(f){ return f === "" ? "One field" : f; }

/**
 * A row of flight buttons, shown only when the field is actually divided. An
 * undivided round never sees it and reads exactly as it did before flights.
 */
function drawFlightPicker(id, flights, current, onPick){
  const box = document.getElementById(id);
  if(!box) return;
  if(flights.length < 2){ box.innerHTML = ""; return; }
  box.innerHTML = `<nav class="flights">` + flights.map(f =>
    `<button data-f="${esc(f)}" aria-current="${f === current}">${esc(flightLabel(f))}</button>`
  ).join("") + `</nav>`;
  box.querySelectorAll("button").forEach(b =>
    b.addEventListener("click", () => onPick(b.dataset.f)));
}

/** The handicap he plays off — the event's allowance already taken off it. */
function chOf(p){
  if(p.index == null || !isFinite(p.index)) return null;
  return E.courseHandicap(p.index, courseOf(p), state.allowancePercent);
}
/** The same figure in full, before the allowance. */
function fullChOf(p){
  if(p.index == null || !isFinite(p.index)) return null;
  return E.fullCourseHandicap(p.index, courseOf(p));
}
/** "CH 33 · plays off 28 at 85%", or null when the allowance changes nothing. */
function allowanceNote(p){
  if(state.allowancePercent === 100) return null;
  // A handicap that came off a card already has the event's allowance in it, so
  // ours was never applied to him. Describing the cut would be a fiction — even
  // when the two figures happen to agree.
  if(handicapOf(p).source === "paste") return null;
  const full = fullChOf(p), plays = chOf(p);
  if(full == null || full === plays) return null;
  return "CH " + full + " · plays off " + plays + " at " + state.allowancePercent + "%";
}
/** A player is scorable once they have a name, an index and a tee. */
function isReady(p){ return !!(p.name && p.name.trim()) && p.index != null && isFinite(p.index) && !!p.tee; }
function scoresFor(p){
  const s = state.scores[p.id];
  return Array.isArray(s) && s.length === HOLES ? s : new Array(HOLES).fill(null);
}
/**
 * The name to put on the scoreboard. The setup sheet may carry whatever the
 * organiser typed — "Ridgeway, Robert (18)", straight off the export — but a
 * handicap is not part of a man's name and the board is read at arm's length,
 * so it shows "Robert Ridgeway". Setup keeps what was typed.
 */
function displayName(p){ return IMP.canonicalName(p.name) || p.name.trim(); }

/**
 * The course handicap to score a player on, and where it came from. The export
 * prints the handicap that was in force the day the round was played; an index
 * can move between then and now, so the printed one wins whenever there is one.
 */
function handicapOf(p){
  const fromPaste = state.handicaps[p.id];
  if(fromPaste != null) return { value: fromPaste, source: "paste" };
  const derived = chOf(p);
  return { value: derived, source: derived == null ? "none" : "index" };
}

/** Build the card the engine scores: the player's own tee and stroke index. */
function cardOf(p){
  const hcp = handicapOf(p);
  return {
    name: displayName(p),
    handicapIndex: p.index,
    // Set only when the export supplied one — the engine prefers it over the
    // index. The tee and gender still decide WHICH holes the strokes fall on.
    courseHandicap: hcp.source === "paste" ? hcp.value : undefined,
    // Applied only to a handicap worked out from the index. One that came off a
    // Golf Genius card already has the event's allowance in it.
    allowancePercent: state.allowancePercent,
    tee: p.tee, gender: p.gender,
    cart: p.cart,
    // Team Skins groups by this instead of the cart, at 16 players and up.
    team: (p.team || "").trim(),
    // The man he named on his Hit List, by the name shown on the board — which
    // is what `applyHitList` matches on, so the two must be the same string.
    hitList: (p.hitList || "").trim(),
    // Placings and Skins are settled inside a flight; the six contests ignore it.
    flight: (p.flight || "").trim(),
    gross: scoresFor(p),
    // Whatever slots he has filled. A man with none simply doesn't score the
    // contest; a man with three scores those three.
    picks: E.PICK_SLOTS.some(sl => p[sl.key] != null)
      ? Object.fromEntries(E.PICK_SLOTS.map(sl => [sl.key, p[sl.key] == null ? null : p[sl.key]]))
      : undefined,
  };
}
function readyPlayers(){ return state.players.filter(isReady); }

/* ---------- screen routing ---------- */
const SCREENS = ["board","player","setup","edit","skins","import","settings"];
// Four tabs across a phone: short labels, so none has to shrink below 18px.
const TAB_LABELS = [["board","Leaders"],["setup","Setup"],["skins","Skins"],["import","Import"]];

function show(id){
  // Skins off takes its tab away, so there is nowhere to land — including a
  // stored tab from before it was switched off.
  if(id === "skins" && !state.skinsOn) id = "board";
  SCREENS.forEach(s => document.getElementById(s).classList.toggle("on", s === id));
  if(id === "board" || id === "setup" || id === "skins" || id === "import"){
    state.tab = id; save();
    document.querySelectorAll("nav.tabs").forEach(nav => {
      nav.querySelectorAll("button").forEach(b =>
        b.setAttribute("aria-current", String(b.dataset.go === id)));
    });
  }
  // Fit only now the screen is visible — a display:none box measures zero wide,
  // so a name fitted before the switch would be left at full size and overflow.
  fitBoardNames();
  window.scrollTo(0,0);
}
/**
 * The tabs actually on offer. Skins switched off for the round takes its tab
 * with it — there is nothing behind it to read, and a tab that only explains
 * its own absence is a tab in the way. A one-cart round keeps the tab, because
 * there it has something to say.
 */
function activeTabs(){
  return TAB_LABELS.filter(([id]) => id !== "skins" || state.skinsOn);
}

function buildTabs(){
  document.querySelectorAll("nav.tabs").forEach(nav => {
    nav.innerHTML = activeTabs().map(([id,label]) =>
      `<button data-go="${id}">${label}</button>`).join("");
    nav.querySelectorAll("button").forEach(b =>
      b.addEventListener("click", () => { if(b.dataset.go === "import") renderImport();
                                          if(b.dataset.go === "setup") renderSetup();
                                          if(b.dataset.go === "skins") renderSkins();
                                          if(b.dataset.go === "board") renderBoard();
                                          show(b.dataset.go); }));
  });
}

/* ---------- the leaderboard ---------- */
let boardCards = [];     // cards behind the rows on screen, for the detail view
let boardResults = [];   // and their scored results — Skins only exists on these

/** How an equal final was settled, said the way a golfer would say it. */
function tieNote(r){
  if(!r.cardMatch) return "";
  if(r.cardMatch.shared) return "shared — cards level";
  return r.cardMatch.wonBy === "a finished card"
    ? "won on a full card"
    : "won on " + r.cardMatch.wonBy;
}

function renderBoard(){
  const rowsEl = document.getElementById("rows");
  const emptyEl = document.getElementById("boardEmpty");
  const subEl = document.getElementById("boardSub");
  const ready = readyPlayers();

  let results;
  if(ready.length === 0){
    // Nothing set up yet — show the seeded demo round so the screen isn't blank.
    boardCards = E.SAMPLE_ROUND.slice();
    results = E.computeLeaderboard();
    subEl.textContent = (state.name || "Round") + " · demo round";
    emptyEl.innerHTML =
      `<div class="note warn">This is a demo round. Add your players on the ` +
      `<b>Setup</b> tab, then paste the scores on <b>Import</b>.</div>`;
  } else {
    boardCards = ready.map(cardOf);
    // No course argument: every card is scored against its own tee and gender.
    results = E.computeLeaderboard(boardCards, undefined, contestConfig());
    const withScores = boardCards.filter(c => c.gross.some(g => g != null)).length;
    subEl.textContent = (state.name || "Round") + " · " + ready.length + " player" + (ready.length===1?"":"s") +
      (withScores === 0 ? " · no scores yet" : "");
    emptyEl.innerHTML = withScores === 0
      ? `<div class="note">No scores imported yet. Paste them on the <b>Import</b> tab.</div>`
      : "";
  }

  // One leaderboard per flight. The picker only appears when the field is
  // actually divided — an undivided round looks exactly as it always did.
  const flights = E.sortFlights([...new Set(results.map(r => r.flight || ""))]);
  if(!flights.includes(state.flight)) state.flight = flights[0];
  drawFlightPicker("boardFlights", flights, state.flight, (f) => {
    state.flight = f; save(); renderBoard();
  });
  if(flights.length > 1){
    results = results.filter(r => (r.flight || "") === state.flight);
    subEl.textContent = subEl.textContent.replace(/·[^·]*player[^·]*/,
      "· " + flightLabel(state.flight) + " · " + results.length + " player" + (results.length===1?"":"s"));
  }

  boardResults = results;
  rowsEl.innerHTML = "";
  let markedIneligible = false;
  results.forEach(r=>{
    // Everyone who finished, then a line, then everyone who didn't.
    if(!r.eligible && !markedIneligible){
      markedIneligible = true;
      const head = document.createElement("div");
      head.className = "section-label";
      head.textContent = "Not eligible — no full round";
      rowsEl.appendChild(head);
    }
    const b = document.createElement("button");
    b.className = "row" + (r.rank===1 ? " leader" : "");
    // Net only. Gross is on the detail screen — a scoreboard is read at arm's
    // length, and the net is the number the final is built from.
    const partial = r.holesPlayed>0 && r.holesPlayed<HOLES ? " · "+r.holesPlayed+" holes" : "";
    const meta = r.net==null ? "no card yet" : "Net "+r.net+partial;
    // The holes played are already on the line above, and the heading says why,
    // so this only has to carry the one word that matters — and fit at 18px.
    // A drawn set of picks is marked, always, because the board must never let a
    // drawn pick pass for a chosen one. It rides on the same line as the tie
    // note — both are things about a man's round rather than his score.
    const src = state.players.find(p => displayName(p) === r.name);
    const notes = [r.eligible ? tieNote(r) : "not eligible",
                   src && src.picksAuto ? "picks drawn" : ""].filter(Boolean).join(" · ");
    b.innerHTML =
      `<span class="rank">${r.eligible ? r.rank : "–"}</span>` +
      `<span class="who"><span class="name">${esc(r.name)}</span>` +
      `<span class="meta">${esc(meta)}</span>` +
      (notes ? `<span class="tie">${esc(notes)}</span>` : ``) + `</span>` +
      `<span class="final">${fmtFinal(r.final)}</span><span class="chev">›</span>`;
    b.addEventListener("click", ()=>showPlayer(r.name));
    rowsEl.appendChild(b);
  });
  drawHouseRules();
  drawShare(results);
  fitBoardNames();
}

/* ---------- one link, texted to the group ----------
   Until now the result of a round was Rob reading numbers aloud in the bar.
   This puts the finished leaderboard on the clipboard as one address he can
   text; every man opens it on his own phone with nothing installed.

   The round rides INSIDE the link — there is no server — and it is settled
   before it leaves: finals, contest values and placings all travel as decided,
   so the link keeps its numbers for good however the settings move afterwards.

   OBFUSCATED, NOT ENCRYPTED. Nothing is legible in the address bar, so a
   forwarded text gives away no names at a glance — but anyone who pastes it
   into a decoder has them back in seconds. A shared link should be treated as
   public. That is the right trade here: it is a golf leaderboard, the same
   names and scores are already on the club's Golf Genius portal, and a
   password to type would defeat the one thing the link is for. */

/** Where results.html lives, next to whichever copy of the app is running. */
function resultsBaseUrl(){
  const here = location.href.split("#")[0].split("?")[0];
  return here.replace(/[^/]*$/, "") + "results.html";
}

/** What travels beside the players: the heading, and anything off default. */
function shareRound(){
  const tees = [...new Set(readyPlayers().map(p => p.tee).filter(Boolean))];
  const notes = [];
  if(state.allowancePercent !== 100) notes.push(state.allowancePercent + "% handicap allowance");
  if(!state.skinsOn) notes.push("skins not played");
  // A round on changed values must not arrive looking ordinary. It rides in the
  // note, which the shared view already prints at the top of the board — no new
  // field in the payload, and so no cost to the field size the link fits.
  if(rulesChanged()) notes.push("HOUSE RULES — not the default values (" + changedRulesNote() + ")");
  return {
    course: "Aberdeen Golf & Country Club",
    date: state.date,
    tee: tees.length === 1 ? tees[0] : "",       // blank when the field is spread
    note: notes.join(" · "),
  };
}

function drawShare(results){
  const box = document.getElementById("shareBox");
  const scored = results.filter(r => r.final != null);
  if(scored.length === 0 || readyPlayers().length === 0){
    box.innerHTML = "";                          // nothing to share until it is scored
    return;
  }

  const link = RS.resultsLink(resultsBaseUrl(), shareRound(),
    results.map(r => ({ ...r, tieNote: tieNote(r) })), contestsInPlay());

  // TWO WAYS OUT, because neither one does the whole job.
  //
  // The picture goes first because it is the one that always arrives. A link of
  // 250 characters or more is flaky through iOS Messages — measured on the
  // club's own phone: 154, 159, 190 and 219 arrived first time, 250 and 299
  // needed a second attempt, 350 failed twice — and a ten-man round cannot get
  // under 250 while still carrying the contest breakdown. A picture has no
  // length limit anywhere, so it is what a man texts.
  //
  // The link stays for e-mail, where it has always worked, because it carries
  // the per-player breakdown that a picture cannot.
  box.innerHTML =
    `<div class="pad">
       <button class="big solid" id="shareImgBtn">Send the board as a picture</button>
       <button class="big" id="shareBtn">Copy the link, for e-mail</button>
       <div id="shareOut"></div></div>`;
  document.getElementById("shareImgBtn").addEventListener("click", () => shareBoardImage(results));
  document.getElementById("shareBtn").addEventListener("click", () => {
    if(!link.fits){
      document.getElementById("shareOut").innerHTML =
        `<div class="note warn">This round makes a link of ${link.length} characters and
         ${link.limit} is the most a message will carry. Send the picture instead, or the
         CSV from <b>Setup → Move this event</b>.</div>`;
      return;
    }
    copyShareLink(link);
  });
}

/* ---------- the board as a picture ----------
   The one thing that always arrives. No length limit in any messenger, and
   nothing to tap through — it is the board and nothing else. */

/** The round in the shape the image builder wants. */
function boardImageRound(results){
  return {
    course: "Aberdeen Golf & Country Club",
    date: state.date,
    dateText: niceDate(state.date),
    note: shareRound().note,
    players: results.map(r => ({
      name: r.name, net: r.net, final: r.final,
      rank: r.rank, tieNote: tieNote(r),
      eligible: r.eligible !== false, holesPlayed: r.holesPlayed,
    })),
  };
}

function shareBoardImage(results){
  const out = document.getElementById("shareOut");
  const canvas = document.createElement("canvas");
  IMG.render(canvas, boardImageRound(results));
  const name = IMG.imageFilename(state.name, state.date);

  canvas.toBlob((blob) => {
    if(!blob){ out.innerHTML = `<div class="note warn">The picture could not be made on this phone.</div>`; return; }
    const file = new File([blob], name, { type: "image/png" });

    // The share sheet is what puts it into Messages. Where it is not offered —
    // a desktop browser, an older phone — the picture is saved instead and can
    // be attached by hand, which is slower but never fails.
    if(navigator.canShare && navigator.canShare({ files: [file] }) && navigator.share){
      navigator.share({ files: [file] }).then(
        () => { out.innerHTML = `<div class="note">Sent. The picture carries the board only —
                 send the link by e-mail if anyone wants the contest breakdown.</div>`; },
        (err) => { if(err && err.name === "AbortError") { out.innerHTML = ""; return; }
                   saveBoardImage(blob, name, out); });
    } else {
      saveBoardImage(blob, name, out);
    }
  }, "image/png");
}

function saveBoardImage(blob, name, out){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
  out.innerHTML = `<div class="note">Saved as <b>${esc(name)}</b>. Attach it to a message
    the way you would any photograph.</div>`;
}

function copyShareLink(link){
  const out = document.getElementById("shareOut");
  const done = (msg) =>
    out.innerHTML = `<div class="note">${esc(msg)}<br>` +
      `<b>${link.length} characters</b> — a text message carries it.<br>` +
      `Anyone with the link can read the round, so treat it as public.</div>`;

  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(link.url).then(
      () => done("Copied. Paste it into a message to the group."),
      () => showLinkToCopy(link));
  } else {
    showLinkToCopy(link);
  }
}

/** The clipboard was refused — put the address on screen to be copied by hand. */
function showLinkToCopy(link){
  document.getElementById("shareOut").innerHTML =
    `<div class="field"><label for="shareText">Copy this link</label>
       <textarea id="shareText" readonly spellcheck="false" autocorrect="off"
         autocapitalize="off" autocomplete="off">${esc(link.url)}</textarea>
       <div class="cd" style="margin-top:10px;font-size:18px;font-weight:700">
         The clipboard was not available, so here it is to copy by hand.</div></div>`;
  const el = document.getElementById("shareText");
  el.focus(); el.select();
}

function showPlayer(name){
  const card = boardCards.find(c => c.name === name);
  if(!card) return;
  // Take the leaderboard's own result: Skins is settled across the field, so
  // re-scoring this card on its own would silently drop it.
  const r = boardResults.find(x => x.name === name) || E.scorePlayer(card, undefined, contestConfig());
  const course = E.courseFor(card);
  // "as played" marks a handicap that came off the card rather than from the
  // index, so a figure that disagrees with the setup screen explains itself.
  const asPlayed = card.courseHandicap != null ? " as played" : "";
  // When the allowance cut the handicap, both figures are shown — the full one
  // and the one he actually played off — so the difference is never a mystery.
  const cut = r.courseHandicapFull != null && r.courseHandicapFull !== r.courseHandicap
    ? "CH " + r.courseHandicapFull + " · plays off " + r.courseHandicap +
      " at " + r.allowancePercent + "%"
    : "Course handicap " + r.courseHandicap + asPlayed;
  const teeLine = "Tee " + (course.tee || "IV") + (course.gender === "F" ? " · women's" : "") +
                  " · " + cut +
                  (r.gross==null ? "" : " · Gross " + r.gross);
  let html =
    `<div class="detail-head"><div class="name">${esc(r.name)}</div>` +
    `<div class="hcp">${esc(teeLine)}</div></div>`;

  if(r.net == null){
    html += `<div class="note">No card imported for this player yet.</div>`;
  } else if(r.holesPlayed !== HOLES){
    // Eighteen holes or you are not scored. Say which and why, once, plainly.
    html += `<div class="note warn"><b>Not scored — ${r.holesPlayed} of 18 holes.</b><br>
      A Clubhouse round is eighteen holes. His card is here and his net is
      ${r.net}, but he takes no final, no place, no skins, and he is off
      everyone's Hit List.</div>`;
  } else {
    /* THE TOTAL, AND TAP TO SEE HOW IT WAS BUILT.
       The old line read "Net − Strokes off = Final", which was the whole of the
       old scoring in one row. On a zero base there is no equation left: the
       final IS what the contests came to. So the number stands on its own, and
       the arithmetic behind it is a tap away rather than always on screen —
       tap, never hover, because every man reads this on a phone. */
    const built = contestsInPlay()
      .map(k => r.contests[k])
      .filter(c => c && c.live && c.strokes !== 0)
      .map(c => fmtStrokes(c.strokes));
    html +=
      `<button class="total" id="totalBtn" aria-expanded="false">` +
        `<span class="lab">Strokes under or over par</span>` +
        `<span class="fin">${fmtFinal(r.final)}</span>` +
        `<span class="hint">Tap to see how</span>` +
      `</button>` +
      `<div class="totalWhy" id="totalWhy" hidden>` +
        `<p>Everyone starts at <b>0</b>. Each contest moves him up or down from
          there, and the total is where he finished. <b>Lowest wins</b>, the way
          strokes under par always have.</p>` +
        `<p>His came to ${built.length ? built.join(" ") + " = <b>" + fmtFinal(r.final) + "</b>"
          : "<b>0.0</b> — nothing moved him either way"}.</p>` +
        `<p>His net was <b>${r.net}</b>${r.gross==null?"":" off a gross of " + r.gross}. It is
          not part of the total any more — the contests are the whole of it.</p>` +
      `</div>`;
  }
  // The card itself, nine holes to a row. A hole he picked up shows X, never the
  // par + 4 the engine filled in — nobody should read that as a score he made.
  if(r.holesPlayed > 0){
    const cell = (i) => {
      if(card.gross[i] == null) return `<td class="blank">–</td>`;
      if(E.isPickedUp(card.gross[i])) return `<td class="xup">X</td>`;
      return `<td>${r.grossByHole[i]}</td>`;
    };
    const nine = (from) =>
      `<table class="card"><tr class="hn">` +
      Array.from({length:9}, (_,k) => `<th>${from+k}</th>`).join("") + `</tr><tr>` +
      Array.from({length:9}, (_,k) => cell(from-1+k)).join("") + `</tr></table>`;
    html += `<div class="section-label">His card</div>` +
      `<div class="cardwrap">${nine(1)}${nine(10)}</div>`;
    if(r.pickedUpHoles.length){
      html += `<div class="note">Picked up on ${r.pickedUpHoles.length===1?"hole":"holes"} ` +
        `${esc(r.pickedUpHoles.join(", "))} — scored net double, which is what picking up means. ` +
        `Those holes still count: this is a full round.</div>`;
    }
  }

  html += `<div class="section-label">The contests</div>`;
  const own = state.players.find(p => displayName(p) === name);
  if(own && own.picksAuto){
    html += `<div class="note">His Watch the Birdie holes were <b>drawn</b>, not chosen —
      he sent no picks in. Change them on his Setup page and the mark goes.</div>`;
  }
  for(const key of contestsInPlay()){
    // All seven, always. A contest the result has nothing for says so rather
    // than vanishing: a missing line looks like a contest that doesn't exist,
    // and a man cannot tell that from one that scored him nothing.
    const c = r.contests[key] || { strokes: 0, live: false, detail: "not scored in this round" };
    const cls = !c.live ? "none" : c.strokes<0 ? "good" : c.strokes>0 ? "penalty" : "none";
    const shown = !c.live ? "—" : fmtStrokes(c.strokes);
    html +=
      `<div class="contest"><div class="cname">` +
      `<div class="cn">${CONTEST_NAMES[key]}</div>` +
      `<div class="cd${c.live?"":" dim"}">${esc(c.detail)}</div></div>` +
      `<div class="cs ${cls}">${shown}</div></div>`;
  }
  document.getElementById("playerBody").innerHTML = html;
  const totalBtn = document.getElementById("totalBtn");
  if(totalBtn){
    totalBtn.addEventListener("click", () => {
      const why = document.getElementById("totalWhy");
      const open = why.hidden;
      why.hidden = !open;
      totalBtn.setAttribute("aria-expanded", String(open));
      totalBtn.querySelector(".hint").textContent = open ? "Tap to hide" : "Tap to see how";
    });
  }
  show("player");
  // Fit only after the screen is visible — a display:none box has no measurable width.
  fitName(document.querySelector("#playerBody .detail-head .name"), 36, 18);
}

/* ---------- setup: the player list ---------- */
/**
 * What is missing from a player, in the words that go beside the amber. Only
 * things that change what he scores are listed: a flight is a way of dividing
 * the field and its absence means the one undivided field, which is not a fault.
 */
function missingFrom(p){
  const gone = [];
  if(!(p.name && p.name.trim())) gone.push("name");
  if(p.index == null || !isFinite(p.index)) gone.push("handicap index");
  if(!p.tee) gone.push("tee");
  if(state.skinsOn && (p.cart == null || String(p.cart).trim() === "")) gone.push("group");
  const picked = E.PICK_SLOTS.filter(sl => p[sl.key] != null).length;
  if(picked < E.PICK_SLOTS.length){
    gone.push(picked === 0 ? "birdie picks"
      : "birdie picks (" + picked + " of " + E.PICK_SLOTS.length + ")");
  }
  return gone;
}

/** Whether a man's card has come in — any hole at all counts as started. */
function hasScores(p){ return scoresFor(p).some(v => v != null); }

/**
 * The first thing looked at, every time, and the reason it is above everything
 * that folds: how many men are in, and whether the cards have arrived.
 */
function drawStatus(){
  const n = state.players.length;
  const inn = state.players.filter(hasScores).length;
  const waiting = n === 0 || inn < n;
  const cards = n === 0 ? "None yet" : inn === 0 ? "None yet" : inn + " of " + n;
  document.getElementById("setupStatus").innerHTML =
    `<div class="status">
       <div class="stat${n === 0 ? " wait" : ""}">
         <div class="statn">${n}${n >= MAX_PLAYERS ? " · full" : ""}</div>
         <div class="statl">player${n===1?"":"s"}</div></div>
       <div class="stat${waiting ? " wait" : ""}">
         <div class="statn">${esc(cards)}</div>
         <div class="statl">${inn > 0 && inn === n ? "cards all in" : "cards in"}</div></div>
     </div>`;
}

function renderSetup(){
  const wrap = document.getElementById("setupRows");
  const n = state.players.length;

  if(n === 0){
    wrap.innerHTML = `<div class="empty">Nobody set up yet. Add the players in this round —
      eight is typical, up to ${MAX_PLAYERS}.</div>`;
  } else {
    // Name, index and tee, and nothing else. At twenty-four rows every extra
    // word costs a line, and group, flight, picks, GHIN and sex are all one tap
    // away in the player's own form — where there is room to read them.
    wrap.innerHTML = state.players.map(p => {
      const ch = chOf(p);
      const hcp = handicapOf(p);
      // The index gives one figure and the card another. When they disagree the
      // played one is what scores, so THAT is the number shown, labelled as
      // played — the two-number column belongs on the player's own screen.
      const differs = hcp.source === "paste" && ch != null && hcp.value !== ch;
      const shown = differs ? hcp.value : ch;
      const gone = missingFrom(p);
      // Only what he HAS is listed here; what he lacks is said once, in the
      // missing line, rather than twice in different words.
      const bits = [];
      if(p.index != null) bits.push("idx " + E.formatHandicapIndex(p.index));
      if(p.tee) bits.push("Tee " + p.tee);
      return `<button class="prow${gone.length ? " warn" : ""}" data-id="${p.id}">` +
        `<span class="pwho"><span class="pname">${esc(p.name || "(no name)")}</span>` +
        `<span class="pmeta">${esc(bits.join(" · "))}` +
        (gone.length ? `${bits.length ? " · " : ""}<span class="miss">missing ${esc(gone.join(", "))}</span>` : ``) +
        `</span></span>` +
        `<span class="pch">` +
          `<span class="pchn">${shown==null?"–":shown}</span>` +
          `<span class="pchl">${differs ? "AS PLAYED" : "C.H."}</span>` +
        `</span><span class="chev">›</span></button>`;
    }).join("");
    wrap.querySelectorAll(".prow").forEach(b =>
      b.addEventListener("click", () => editPlayer(b.dataset.id)));
  }
  document.getElementById("addBtn").disabled = n >= MAX_PLAYERS;
  drawStatus();
  drawEventBox();
  drawAllowance();
  drawSkinsSwitch();
  drawAutoPicksSwitch();
  drawMoveBox();
  drawAbout();
  drawFoldSubs();
  fitBoardNames();
}

/* ---------- the folded sections ----------
   Closed on arrival, because none of them is touched more than once a round.
   Whichever is left open comes back open: an organiser who is mid-way through
   setting a round up should not have to find his place again. The choice is a
   property of the DEVICE, not of the event, so it does not travel in an event
   code and does not differ between Friday's round and Saturday's. */
const FOLD_KEY = "btc.clubhouse.folds";

function readFolds(){
  try { return JSON.parse(localStorage.getItem(FOLD_KEY)) || {}; }
  catch(e){ return {}; }
}
function wireFolds(){
  const open = readFolds();
  document.querySelectorAll("details.fold").forEach(d => {
    d.open = open[d.id] === true;
    d.addEventListener("toggle", () => {
      const now = readFolds();
      now[d.id] = d.open;
      try { localStorage.setItem(FOLD_KEY, JSON.stringify(now)); } catch(e) { /* full or private — the fold simply forgets */ }
    });
  });
}

/**
 * One line under each heading saying what is inside, so a shut section can still
 * be checked at a glance. This is where the allowance and the skins switch get
 * seen without being opened — both change every man's score, and neither should
 * be able to hide.
 */
function drawFoldSubs(){
  const carts = new Set(readyPlayers()
    .filter(p => p.cart != null && String(p.cart).trim() !== "").map(p => String(p.cart)));
  document.getElementById("foldEventSub").textContent =
    [state.format || DEFAULT_FORMAT,
     state.allowancePercent + "%",
     state.skinsOn ? (carts.size < 2 ? "skins on, one group" : "skins on") : "skins off",
    ].join(" · ");
  document.getElementById("foldMoveSub").textContent = exportNote(state);
  const v = window.ClubhouseVersion;
  document.getElementById("foldAboutSub").textContent =
    v && v.build ? "Build " + v.build : "Build unknown";
}

/**
 * Which build this is. Stamped into version.js by the pre-commit hook, so a man
 * reading a phone on the first tee can say what he is looking at without
 * guessing. Absent — someone opened the page without version.js beside it — it
 * says so rather than showing a number that means nothing.
 */
function drawAbout(){
  const v = window.ClubhouseVersion;
  const build = v && v.build
    ? v.build + " · " + niceDate(v.date)
    : "unknown — version.js is missing";

  // Enough to answer "is it me or is it the phone?" over a telephone, and
  // nothing that needs a cable or a laptop to read.
  let stored = "unknown";
  try {
    const raw = localStorage.getItem(STORE_KEY) || "";
    stored = raw ? Math.round(raw.length / 1024) + " KB" : "nothing saved";
  } catch(e) { stored = "storage unavailable"; }

  const facts = [
    ["Build", build],
    ["Events on this device", String(store.events.length)],
    ["This event", state.players.length + " player" + (state.players.length===1?"":"s") +
      ", " + state.players.filter(hasScores).length + " with cards"],
    ["Saved data", stored],
    ["Scoring engine", E ? "loaded" : "MISSING"],
  ];
  document.getElementById("aboutBox").innerHTML =
    facts.map(([k, val]) =>
      `<div class="contest"><div class="cname"><div class="cn">${esc(k)}</div></div>` +
      `<div class="cd" style="text-align:right;font-size:18px">${esc(val)}</div></div>`).join("") +
    `<div class="note">Everything is kept on this phone. Nothing is sent anywhere,
      and the round keeps working with no signal at all.</div>`;
}

/**
 * Which event this is, and the way to another. The club plays Friday and
 * Saturday, so setting up one must never disturb the other: each event holds
 * its own players, scores, flights and settings, and this is the only place
 * they cross.
 *
 * The name and date are edited in place — typing in them IS renaming, so there
 * is no separate rename step to find. Neither redraws the screen under the
 * thumb; only the picker's own wording keeps up.
 */
function drawEventBox(){
  const e = state;
  const options = eventsInOrder().map(x =>
    `<option value="${esc(x.id)}"${x.id===e.id?" selected":""}>${esc(eventLabel(x))}</option>`).join("");

  document.getElementById("eventBox").innerHTML =
    `<div class="field"><label for="fEvent">Event</label>
       <select id="fEvent">${options}</select>
       <div class="pad" style="padding:12px 0 0"><button class="big" id="fNewEvent">+ New event</button></div></div>
     <div class="field"><label for="fEventName">Name</label>
       <input type="text" id="fEventName" autocomplete="off" value="${esc(e.name || "")}"></div>
     <div class="field"><label for="fEventDate">Date</label>
       <input type="date" id="fEventDate" value="${esc(e.date || "")}"></div>
     <div class="field"><label for="fEventFormat">Format</label>
       <input type="text" id="fEventFormat" list="formatList" autocomplete="off"
         value="${esc(e.format || "")}">
       <datalist id="formatList">${COMMON_FORMATS.map(f =>
         `<option value="${esc(f)}"></option>`).join("")}</datalist></div>`;

  const $ = (id) => document.getElementById(id);
  // The band already names the open event, so a rename shows up there at once
  // even with this section shut. Neither redraws the screen under the thumb.
  const refresh = () => {
    document.getElementById("setupSub").textContent = eventLabel(state);
    const opt = $("fEvent").querySelector(`option[value="${CSS.escape(state.id)}"]`);
    if(opt) opt.textContent = eventLabel(state);
  };
  refresh();

  $("fEvent").addEventListener("change", (ev) => openEvent(ev.target.value));
  $("fEventName").addEventListener("input", (ev) => {
    state.name = ev.target.value; save(); refresh();
  });
  $("fEventDate").addEventListener("change", (ev) => {
    state.date = ev.target.value; save(); refresh();
  });
  $("fEventFormat").addEventListener("input", (ev) => {
    state.format = ev.target.value; save(); refresh(); drawFoldSubs();
  });
  $("fNewEvent").addEventListener("click", addEvent);
}

/**
 * Getting a round off this phone, or onto it. All of it is once-a-round work
 * and one of them cannot be undone, so it lives behind its own heading rather
 * than under a thumb that is scrolling for a player.
 */
function drawMoveBox(){
  document.getElementById("moveBox").innerHTML =
    `<div class="pad">
       <button class="big" id="fExportEvent">Export a spreadsheet (CSV)</button>
       <button class="big" id="fCopyEvent">Copy this event</button>
       <button class="big" id="fPasteEvent">Paste an event</button>
       <div id="eventTransfer"></div>
       <div class="cd" style="margin:16px 0 12px;font-size:18px;font-weight:700">${esc(deleteNote(state))}</div>
       <button class="big danger" id="fDeleteEvent">Delete this event</button>
     </div>`;
  document.getElementById("fExportEvent").addEventListener("click", exportEvent);
  document.getElementById("fCopyEvent").addEventListener("click", copyEvent);
  document.getElementById("fPasteEvent").addEventListener("click", showPasteBox);
  document.getElementById("fDeleteEvent").addEventListener("click", () => removeEvent(state.id));
}

/**
 * The event's handicap allowance. Club events usually play off 85%, and the
 * figure moves the field unevenly — at 85% a 38 index gives up five shots and
 * an 8 index one — so it belongs with the round, not buried in a constant.
 */
const COMMON_ALLOWANCES = [100, 95, 90, 85, 80, 75];

function drawAllowance(){
  const pct = state.allowancePercent;
  const options = COMMON_ALLOWANCES.concat(COMMON_ALLOWANCES.includes(pct) ? [] : [pct])
    .sort((a,b) => b - a)
    .map(v => `<option value="${v}"${v===pct?" selected":""}>${v}%</option>`).join("");

  // What it actually costs the men in this round, worst and least affected.
  const ready = readyPlayers();
  let effect;
  if(pct === 100){
    effect = "Everyone plays off their full course handicap.";
  } else if(ready.length === 0){
    effect = "Applied to every player's course handicap once they are added.";
  } else {
    const cuts = ready.map(p => ({ name: displayName(p), lost: (fullChOf(p) || 0) - (chOf(p) || 0) }))
                      .sort((a,b) => b.lost - a.lost);
    const most = cuts[0], least = cuts[cuts.length - 1];
    effect = most.lost === least.lost
      ? "Costs every man " + most.lost + " shot" + (most.lost===1?"":"s") + "."
      : "Costs " + esc(most.name) + " " + most.lost + " shot" + (most.lost===1?"":"s") +
        " and " + esc(least.name) + " " + least.lost + ".";
  }

  document.getElementById("allowanceBox").innerHTML =
    `<div class="field"><label for="fAllow">Handicap allowance</label>
       <select id="fAllow">${options}</select>
       <div class="cd" style="margin-top:10px;font-size:18px;font-weight:700">${effect}</div>
     </div>`;

  document.getElementById("fAllow").addEventListener("change", (e) => {
    state.allowancePercent = Number(e.target.value);
    save();
    renderSetup(); renderBoard();
    if(state.skinsOn) renderSkins();
  });
}

/**
 * The one threshold the organiser can change from the app. Some rounds the
 * groups won't divide sensibly and he'll want to skip skins altogether — a
 * round with only one cart skips itself, but this covers the rest.
 */
function drawSkinsSwitch(){
  const carts = new Set(readyPlayers()
    .filter(p => p.cart != null && String(p.cart).trim() !== "")
    .map(p => String(p.cart)));
  const note = !state.skinsOn ? "Nobody is scored for skins this round."
    : carts.size < 2 ? "Only one group out, so no skins today whatever this says."
    : carts.size + " groups out, playing for 18 skins.";

  document.getElementById("skinsSwitch").innerHTML =
    `<div class="field"><span class="flab">Skins</span>
       <div class="seg" id="skinsSeg">
         <button type="button" data-on="1" aria-pressed="${state.skinsOn}">On</button>
         <button type="button" data-on="0" aria-pressed="${!state.skinsOn}">Off</button>
       </div>
       <div class="cd" style="margin-top:10px;font-size:18px;font-weight:700">${esc(note)}</div>
     </div>`;

  document.getElementById("skinsSeg").querySelectorAll("button").forEach(b =>
    b.addEventListener("click", () => {
      state.skinsOn = b.dataset.on === "1";
      save();
      buildTabs();                       // the Skins tab comes and goes with it
      renderSetup(); renderBoard();
      if(state.skinsOn) renderSkins();
      show("setup");                     // stay where the switch is
    }));
}

/**
 * Picks drawn for the man who never sent his in.
 *
 * OFF BY DEFAULT, and it stays that way unless somebody turns it on. Watch the
 * Birdie is a contest of nerve — a man says in advance which holes he fancies —
 * and a drawn set is not a choice. What it stops is an empty contest reading as
 * a bad round on the board, which is a different thing and worth fixing.
 *
 * The draw happens ONCE, when the scores go in, and is written to the player.
 * Drawing it afresh on every render would give a man different picks each time
 * the board was looked at, which is not a game.
 */
function drawAutoPicksSwitch(){
  const missing = readyPlayers().filter(p => E.PICK_SLOTS.every(sl => p[sl.key] == null)).length;
  const drawn = state.players.filter(p => p.picksAuto).length;
  const note = state.autoPicks
    ? (missing > 0
        ? missing + " player" + (missing===1?"":"s") + " with no picks — they will be drawn when the scores go in."
        : "Everybody has picks. Nothing will be drawn.")
    : "A man with no picks scores nothing on Watch the Birdie.";

  document.getElementById("autoPicksSwitch").innerHTML =
    `<div class="field"><span class="flab">Draw missing picks</span>
       <div class="seg" id="autoPicksSeg">
         <button type="button" data-on="1" aria-pressed="${state.autoPicks}">On</button>
         <button type="button" data-on="0" aria-pressed="${!state.autoPicks}">Off</button>
       </div>
       <div class="cd" style="margin-top:10px;font-size:18px;font-weight:700">${esc(note)}` +
       (drawn ? `<br>${drawn} man${drawn===1?"":"'s"} picks ${drawn===1?"was":"were"} drawn, and the board says so beside ${drawn===1?"his":"their"} name${drawn===1?"":"s"}.` : ``) +
       `</div></div>`;

  document.getElementById("autoPicksSeg").querySelectorAll("button").forEach(b =>
    b.addEventListener("click", () => {
      state.autoPicks = b.dataset.on === "1";
      save();
      renderSetup(); renderBoard();
      show("setup");
    }));
}

/**
 * Draw picks for anybody who has none. Returns how many were drawn.
 *
 * Only ever ADDS to a man with nothing — a player who chose even one slot is
 * left exactly as he is, because a half-filled card is still a choice and
 * filling the rest of it would be putting words in his mouth.
 */
function drawMissingPicks(){
  if(!state.autoPicks) return 0;
  let drawn = 0;
  for(const p of state.players){
    if(!isReady(p)) continue;
    if(E.PICK_SLOTS.some(sl => p[sl.key] != null)) continue;   // he chose something
    const picks = E.randomPicks(courseOf(p));
    E.PICK_SLOTS.forEach(sl => { p[sl.key] = picks[sl.key]; });
    p.picksAuto = true;
    drawn++;
  }
  return drawn;
}

/* ---------- setup: a whole list of players at once ----------
   Sixteen men typed in by hand is a long job, and the organiser has them in a
   spreadsheet already. Nothing is added until the list has been read back to
   him, the same way a paste of scores is. */

let rosterPreview = null;

function showRosterBox(){
  document.getElementById("rosterBox").innerHTML =
    `<div class="field"><label for="rosterPaste">One player a line</label>
       <textarea id="rosterPaste" spellcheck="false" autocorrect="off"
         autocapitalize="off" autocomplete="off"
         placeholder="Finkelstein, Dave (26.9 / 21 / 21) IV"></textarea>
       <div class="cd" style="margin-top:10px;font-size:18px;font-weight:700">
         A Golf Genius tee sheet pastes straight in: name, then the three figures
         in brackets, then the tee. Only the first figure is kept — the other two
         are worked out again when the round is scored.<br><br>
         A spreadsheet also reads: name, handicap index, tee, group, front par 4,
         back par 4 — tab or comma separated. Anything after the name may be left
         out.</div></div>
     <div style="padding:0 0 12px"><button class="big solid" id="rosterRead">Show what this contains</button></div>
     <div id="rosterOut"></div>`;
  document.getElementById("rosterRead").addEventListener("click", readRoster);
  document.getElementById("rosterPaste").focus();
}

/** What the course allows, so the parser can refuse a tee or a pick outright. */
function rosterRules(){
  const legal = E.birdiePickHoles(E.courseForTee(state.lastTee || "IV", "M"));
  // The roster paste carries the two par 4 picks, as it always has; the other
  // four come from the picks paste further down the screen.
  return { tees: E.TEE_IDS, frontPicks: legal.f4, backPicks: legal.b4,
           defaultTee: state.lastTee || "IV" };
}

function readRoster(){
  const text = document.getElementById("rosterPaste").value;
  const parsed = IMP.parseRoster(text, rosterRules());

  // The handicap index is read by the same rule the form uses, so a comma
  // decimal behaves here exactly as it does when typed in by hand.
  parsed.rows.forEach(row => {
    const read = E.parseHandicapIndex(row.indexText);
    row.index = read.value;
    if(!read.ok) row.problems = row.problems.concat([read.error]);
    else if(read.value == null) row.problems = row.problems.concat(["no handicap index"]);

    const already = state.players.some(p =>
      IMP.normaliseName(p.name) === IMP.normaliseName(row.name));
    if(already) row.problems = row.problems.concat(["already on the list"]);
  });

  rosterPreview = parsed;
  drawRosterPreview();
}

function drawRosterPreview(){
  const out = document.getElementById("rosterOut");
  const rows = rosterPreview ? rosterPreview.rows : [];
  if(rows.length === 0){
    out.innerHTML = `<div class="note warn">No players read from that yet.</div>`;
    return;
  }

  const good = rows.filter(r => r.problems.length === 0);
  const bad = rows.filter(r => r.problems.length > 0);
  const room = MAX_PLAYERS - state.players.length;
  const willAdd = Math.min(good.length, room);

  const line = (r) => {
    const bits = [
      r.index == null ? "no index" : "idx " + E.formatHandicapIndex(r.index),
      "Tee " + r.tee,
      r.group === "" ? "no group" : "group " + r.group,
      (r.front === "" || r.back === "") ? "no picks" : "picks " + r.front + "/" + r.back,
    ];
    const bad = r.problems.length > 0;
    return `<div class="prev"><div class="pv">` +
      `<div class="pvn">${esc(r.name)}</div>` +
      `<div class="pvd">${esc(bad ? r.problems.join(" · ") : bits.join(" · "))}</div></div>` +
      `<div class="pvt"><span class="tag${bad?" no":""}">${bad ? "skip" : "add"}</span></div></div>`;
  };

  let html = "";
  if(good.length){
    html += `<div class="section-label">${good.length} to add</div>` + good.map(line).join("");
  }
  if(bad.length){
    html += `<div class="section-label">${bad.length} left out</div>` + bad.map(line).join("");
  }
  if(rosterPreview.ignored){
    html += `<div class="note">${rosterPreview.ignored} line${rosterPreview.ignored===1?"":"s"}
      ignored — a heading row, or nothing on it.</div>`;
  }
  if(willAdd < good.length){
    html += `<div class="note warn">Only ${willAdd} can be added: ${MAX_PLAYERS} players is the
      most an event holds, and there are already ${state.players.length}.</div>`;
  }
  html += `<div style="padding:12px 0"><button class="big solid" id="rosterAdd"${willAdd?"":" disabled"}>` +
    (willAdd ? "Add " + willAdd + " player" + (willAdd===1?"":"s") : "Nothing to add") + `</button>` +
    `<button class="big" id="rosterCancel">Discard this list</button></div>`;

  out.innerHTML = html;
  const add = document.getElementById("rosterAdd");
  if(add) add.addEventListener("click", commitRoster);
  document.getElementById("rosterCancel").addEventListener("click", () => {
    rosterPreview = null;
    document.getElementById("rosterBox").innerHTML = "";
  });
}

function commitRoster(){
  if(!rosterPreview) return;
  const good = rosterPreview.rows.filter(r => r.problems.length === 0);
  for(const r of good){
    if(state.players.length >= MAX_PLAYERS) break;
    const p = blankPlayer();
    p.name = r.name;
    p.index = r.index;
    p.tee = r.tee || p.tee;
    p.cart = r.group === "" ? null : Number(r.group);
    p.f4 = r.front === "" ? null : r.front;
    p.b4 = r.back === "" ? null : r.back;
    if(p.tee) state.lastTee = p.tee;
    state.players.push(p);
  }
  rosterPreview = null;
  save();
  renderSetup(); renderBoard();
  document.getElementById("rosterBox").innerHTML = "";
}

/* ---------- setup: a block of Watch the Birdie picks ----------
   The men message their picks in, one line each, and the organiser has sixteen
   of those in a thread by Thursday night. Pasted together here rather than
   opened sixteen times.

   A name is matched, never guessed: the same rule the score import uses —
   exact, then "Last, First" reversed, then first name and last initial — and
   anything that fits two men equally comes back for a person to settle. */

let picksPreview = null;

function showPicksBox(){
  const legal = E.birdiePickHoles(E.courseForTee(state.lastTee || "IV", "M"));
  const order = E.PICK_SLOTS.map(sl => sl.label + " " + legal[sl.key].join("/")).join(" · ");
  document.getElementById("picksBox").innerHTML =
    `<div class="field"><label for="picksPaste">One player a line</label>
       <textarea id="picksPaste" spellcheck="false" autocorrect="off"
         autocapitalize="off" autocomplete="off"
         placeholder="Ridgeway, Ken — 8, 2, 4, 13, 14, 16"></textarea>
       <div class="cd" style="margin-top:10px;font-size:18px;font-weight:700">
         Six numbers in this order: ${esc(order)}</div></div>
     <div style="padding:0 0 12px"><button class="big solid" id="picksRead">Show what this contains</button></div>
     <div id="picksOut"></div>`;
  document.getElementById("picksRead").addEventListener("click", readPicksPaste);
  document.getElementById("picksPaste").focus();
}

/**
 * THE HIT LIST — the eight players nearest a man's own index.
 *
 * Four above and four below where the field allows it, and the nearest eight
 * either way when it does not — a man at the very top or bottom of the field
 * still gets eight names rather than four.
 *
 * NOT HIS CART. A threesome gives him two names and one of them is usually the
 * obvious pick; eight near-equals makes the choice about form rather than about
 * who he happened to ride with.
 *
 * A man with no index has nobody to be near, and a man who has not finished is
 * off every list — his opponent's pick would be void anyway, so offering him
 * only sets up a wasted choice.
 */
function nearestEight(player){
  // The rule lives in the engine so it can be tested; this only decides WHO is
  // eligible to be named — a man needs an index and a tee, and a man who did
  // not finish is off every list because the pick would be void anyway.
  const others = state.players.filter(p => p.id !== player.id && p.index != null && isReady(p));
  const hl = contestConfig().hitList;
  return E.nearestByIndex(player.index, others, hl && hl.offers ? hl.offers : 8);
}

/** How the two indexes compare, in the words the card will use. */
function hitBand(mine, theirs){
  const hl = contestConfig().hitList;
  const gap = hl ? hl.equalBand : 1.0;
  if(mine == null || theirs == null) return "an equal handicap";
  if(Math.abs(mine - theirs) <= gap) return "an equal handicap";
  return theirs < mine ? "a lower handicap" : "a higher handicap";
}

function showHitListBox(){
  const box = document.getElementById("hitListBox");
  const men = readyPlayers();
  if(men.length < 2){
    box.innerHTML = `<div class="note warn">The Hit List needs at least two players
      with an index and a tee.</div>`;
    return;
  }
  box.innerHTML =
    `<div class="cd" style="padding:0 0 12px;font-size:18px;font-weight:700">
       Each man backs himself to post the better net score against ONE opponent.
       He is offered the eight players nearest his own index — beating a better
       player pays more, so the easy pick is not the best one.</div>` +
    men.map(p => {
      const eight = nearestEight(p);
      const opts = `<option value="">— nobody —</option>` +
        eight.map(o => `<option value="${esc(displayName(o))}"${
          displayName(o) === (p.hitList || "") ? " selected" : ""}>${
          esc(displayName(o))} · ${E.formatHandicapIndex(o.index)} · ${
          esc(hitBand(p.index, o.index))}</option>`).join("");
      const stale = p.hitList && !eight.some(o => displayName(o) === p.hitList);
      return `<div class="field">` +
        `<label for="hl_${p.id}">${esc(displayName(p))} · ${E.formatHandicapIndex(p.index)}</label>` +
        `<select id="hl_${p.id}" data-hl="${p.id}">${opts}` +
        (stale ? `<option value="${esc(p.hitList)}" selected>${esc(p.hitList)} · no longer on his list</option>` : ``) +
        `</select></div>`;
    }).join("") +
    `<div class="pad"><button class="big" id="hitListDone">Done</button></div>`;

  box.querySelectorAll("select[data-hl]").forEach(sel =>
    sel.addEventListener("change", () => {
      const man = state.players.find(p => p.id === sel.dataset.hl);
      if(!man) return;
      man.hitList = sel.value || "";
      save(); renderBoard();
    }));
  document.getElementById("hitListDone").addEventListener("click", () => {
    document.getElementById("hitListBox").innerHTML = "";
  });
}

/**
 * Which skins format THIS field is in, or null for none.
 *
 * The size decides it, not a switch: under 8 there is not enough of a field to
 * divide, 8 to 15 is Cart Skins and 16 or more is Team Skins. Counted on men
 * who could actually finish — a name with no index and no tee is not a player
 * yet and must not tip the field into a format it cannot play.
 */
function skinsFormatNow(){
  const config = contestConfig().skins;
  return config ? E.skinsFormat(readyPlayers().length, config) : null;
}

function teamHint(){
  const n = readyPlayers().length;
  const format = skinsFormatNow();
  if(format === "team") return "This field plays TEAM skins — " + n + " players. Every man needs a team.";
  if(format === "cart") return "Not used at " + n + " players: this field plays cart skins. Teams start at 16.";
  return "Not used — a field of " + n + " is too small for skins at all. Teams start at 16.";
}

/* ---------- the Settings screen ----------
   Every value the round is using, on one screen, with the default beside it.
   Nothing here is a code change any more.

   Edits are held in `draft` until Save, so a half-typed ladder never reaches
   the board — and Save checks the whole set before it writes, because a bad
   rung does not fail at save time, it fails three hours later in front of the
   men. */
let draft = null;

/** One editable number. `path` addresses it inside the config. */
function numField(label, path, value, dflt, opts){
  const o = opts || {};
  const same = Number(value) === Number(dflt);
  return `<div class="field"><label for="s_${path}">${esc(label)}</label>` +
    `<input id="s_${path}" data-path="${path}" type="number" inputmode="decimal" ` +
      `step="${o.step || 0.1}" value="${value}">` +
    `<div class="cd" style="margin-top:8px;font-size:18px;font-weight:700">` +
      (same ? `Default` : `Default <b>${dflt}</b> — changed`) +
    `</div></div>`;
}

function settingsGet(path){
  return path.split(".").reduce((o, k) => (o == null ? o : o[k]), draft);
}
function settingsSet(path, value){
  const keys = path.split(".");
  let o = draft;
  for(let i = 0; i < keys.length - 1; i++){
    if(o[keys[i]] == null || typeof o[keys[i]] !== "object") o[keys[i]] = {};
    o = o[keys[i]];
  }
  o[keys[keys.length - 1]] = value;
}

function renderSettings(){
  if(!draft) draft = JSON.parse(JSON.stringify(contestConfig()));
  const D = E.DEFAULT_CONTESTS;
  const on = (key) => draft[key] != null;
  const sw = (key, label) => `<div class="field"><span class="flab">${esc(label)}</span>` +
    `<div class="seg" data-onoff="${key}">` +
      `<button type="button" data-v="1" aria-pressed="${on(key)}">On</button>` +
      `<button type="button" data-v="0" aria-pressed="${!on(key)}">Off</button>` +
    `</div></div>`;

  let h = `<div class="note">These are the rules THIS round is played under. They
    travel with the event — copy it to another device and the rules go too, and a
    round scored today still scores the same way next year. A new event starts
    from the defaults.</div>`;

  if(rulesChanged()){
    h += `<div class="note warn"><b>This round is not on the default rules.</b><br>
      Changed: ${esc(changedRulesNote())}. Every board, shared link and export
      says so.</div>`;
  }

  /* Watch the Birdie */
  h += `<div class="section-label">Watch the Birdie</div>` + sw("watchTheBirdie", "In the game");
  if(on("watchTheBirdie")){
    h += numField("Net birdie", "watchTheBirdie.birdie", draft.watchTheBirdie.birdie, D.watchTheBirdie.birdie) +
      numField("Net eagle", "watchTheBirdie.eagle", draft.watchTheBirdie.eagle, D.watchTheBirdie.eagle) +
      numField("Nothing on any of the six", "watchTheBirdie.blank", draft.watchTheBirdie.blank, D.watchTheBirdie.blank) +
      `<div class="field"><label for="s_barred">Holes that may not be picked</label>` +
      `<input id="s_barred" data-barred="1" type="text" inputmode="numeric"
         value="${esc((draft.watchTheBirdie.barred || E.ABERDEEN_TEE_IV.barredPicks).join(", "))}">` +
      `<div class="cd" style="margin-top:8px;font-size:18px;font-weight:700">
         Default <b>${E.ABERDEEN_TEE_IV.barredPicks.join(", ")}</b> — Agony Alley's three and
         Easy Street's three. Every slot must keep at least two holes to choose from.</div></div>`;
  }
  h += resetFor("watchTheBirdie");

  /* Six Pack */
  h += `<div class="section-label">Six Pack</div>` + sw("sixPack", "In the game") +
    `<div class="note">Nothing to set. It is the six candidate holes a man did NOT
      pick, scored as raw net strokes against their par of 24 — and the par is
      forced by the slots rather than chosen, so there is no number here to move.</div>`;

  /* Agony Alley and Easy Street — ladders */
  for(const [key, label, unit] of [["agonyAlley", "Agony Alley", "Net total on 4, 5, 6"],
                                   ["easyStreet", "Easy Street", "Net pars on 11, 12, 13"]]){
    h += `<div class="section-label">${label}</div>` + sw(key, "In the game");
    if(on(key)){
      h += `<div class="cd" style="padding:0 14px 10px;font-size:18px;font-weight:700">${unit},
        graded on the first rung it reaches.</div>`;
      draft[key].forEach((rung, i) => {
        h += `<div class="field"><label>Rung ${i + 1}</label>` +
          `<div style="display:flex;gap:10px">` +
            `<input data-ladder="${key}" data-i="${i}" data-f="threshold" type="number" step="1"
