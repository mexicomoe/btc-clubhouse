<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b2e13">
<title>Clubhouse</title>
<style>
  :root{
    --green:#0b2e13;
    --felt:#14532d;
    --card:#ffffff;
    --ink:#12211a;
    --quiet:#5c6b62;
    --line:#d5ddd7;
    --gold:#b8860b;
    --paper:#f2f0e8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font:400 18px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:0 0 40px;
  }
  header{background:var(--green);color:#fff;padding:26px 20px 22px}
  header h1{margin:0;font-size:28px;letter-spacing:.14em;font-weight:600}
  header p{margin:8px 0 0;font-size:16px;opacity:.85;line-height:1.45}
  main{max-width:560px;margin:0 auto;padding:22px 16px 0}
  /* Each way in is a whole card, not a word — a big target for a bright day. */
  a.door{
    display:block;text-decoration:none;color:var(--ink);
    background:var(--card);border:1px solid var(--line);border-left:6px solid var(--felt);
    border-radius:12px;padding:20px 18px;margin:0 0 14px;
  }
  a.door strong{display:block;font-size:22px;font-weight:600;margin:0 0 4px}
  a.door span{display:block;font-size:16px;color:var(--quiet);line-height:1.4}
  a.door:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  a.door.primary{border-left-color:var(--gold)}
  footer{max-width:560px;margin:0 auto;padding:8px 16px;font-size:16px;color:var(--quiet)}
</style>
</head>
<body>

<header>
  <h1>CLUBHOUSE</h1>
  <p>Beat the Crowd &middot; Aberdeen</p>
</header>

<main>
  <a class="door primary" href="picks.html">
    <strong>Pick my holes</strong>
    <span>Six holes before you tee off. Takes a minute.</span>
  </a>

  <a class="door" href="leaderboard.html">
    <strong>Leaderboard</strong>
    <span>Scores, contests and the day's standings.</span>
  </a>
</main>

<footer>Bookmark this page &mdash; it is the only address you need.</footer>

</body>
</html>
