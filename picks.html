<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b2e13">
<title>Clubhouse · Pick your holes</title>
<style>
  :root{
    --green:#0b2e13;
    --felt:#14532d;
    --card:#ffffff;
    --ink:#12211a;
    --quiet:#5c6b62;
    --line:#d5ddd7;
    --gold:#b8860b;
    --paper:#f2f0e8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font:400 17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:0 0 140px;
  }
  header{background:var(--green);color:#fff;padding:22px 20px 20px}
  header h1{margin:0;font-size:26px;letter-spacing:.14em;font-weight:600}
  header p{margin:8px 0 0;font-size:15px;opacity:.85;line-height:1.45}
  main{max-width:560px;margin:0 auto;padding:20px 16px 0}
  label.namelab{display:block;font-size:15px;color:var(--quiet);margin:0 0 6px}
  input#who{
    width:100%;padding:14px 14px;font-size:19px;border:1px solid var(--line);
    border-radius:10px;background:var(--card);color:var(--ink);
  }
  input#who:focus{outline:3px solid var(--felt);outline-offset:1px}
  section.pick{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:16px 0}
  section.pick h2{margin:0 0 12px;font-size:19px;font-weight:600}
  .holes{display:flex;flex-wrap:wrap;gap:10px}
  .hole{
    flex:1 1 0;min-width:88px;padding:20px 8px;font-size:22px;font-weight:600;
    background:var(--paper);color:var(--ink);border:1px solid var(--line);
    border-radius:10px;cursor:pointer;font-family:inherit;
  }
  .hole[aria-pressed="true"]{background:var(--felt);color:#fff;border-color:var(--felt)}
  .hole:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  #tray{
    position:fixed;left:0;right:0;bottom:0;background:var(--green);color:#fff;
    padding:14px 16px calc(14px + env(safe-area-inset-bottom));
  }
  #tray .inner{max-width:560px;margin:0 auto}
  #summary{font-size:16px;margin:0 0 10px;min-height:22px}
  #sendsms{
    display:block;width:100%;padding:16px;font-size:19px;font-weight:600;font-family:inherit;
    border:0;border-radius:10px;background:var(--gold);color:#1a1305;cursor:pointer;
    text-align:center;text-decoration:none;
  }
  #sendsms[aria-disabled="true"]{background:#3d5a45;color:#b8c8bd;cursor:default}
  #sendsms:focus-visible{outline:3px solid #fff;outline-offset:2px}
  /* The fallback sits under the text button, quieter but still a 48px target. */
  #send{
    width:100%;padding:14px;margin:10px 0 0;font-size:18px;font-weight:600;font-family:inherit;
    border:1px solid #4a6b52;border-radius:10px;background:transparent;color:#e2eae4;cursor:pointer;
  }
  #send[disabled]{border-color:#2c4433;color:#7f9186;cursor:default}
  #send:focus-visible{outline:3px solid #fff;outline-offset:2px}
  #copied{font-size:15px;margin:10px 0 0;min-height:20px}
  /* The way back out. It lives on the page, NOT in the fixed tray — the tray
     steals that much height from every screen, and the last pick box is what
     gets covered. Navigation is not urgent enough to be always visible. */
  #elsewhere{margin:4px 0 0;font-size:16px;text-align:center}
  #elsewhere a{color:var(--felt);text-decoration:underline;padding:10px 6px;display:inline-block}
  /* The field, when the link carries one. Whole-width rows, because a man
     picking himself out of a list is doing it once and must not miss. */
  .who{
    display:block;width:100%;text-align:left;font:inherit;font-size:20px;font-weight:600;
    padding:16px 14px;margin:0 0 10px;background:var(--card);color:var(--ink);
    border:1px solid var(--line);border-radius:10px;cursor:pointer;
  }
  .who[aria-pressed="true"]{background:var(--felt);color:#fff;border-color:var(--felt)}
  .who .idx{display:block;font-size:16px;font-weight:400;margin-top:3px;opacity:.85}
  .who:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  #fieldNote{font-size:16px;line-height:1.45;color:var(--quiet);padding:4px 0 0}
  #fieldNote b{color:var(--ink)}
  .mine{
    background:var(--felt);color:#fff;border-radius:10px;padding:14px;margin:0 0 4px;
    font-size:20px;font-weight:600;
  }
  .mine button{
    display:block;margin-top:8px;min-height:44px;padding:8px 12px;font:inherit;font-size:16px;
    background:transparent;color:#fff;border:1px solid rgba(255,255,255,.6);border-radius:8px;cursor:pointer;
  }
  @media (prefers-reduced-motion:no-preference){.hole{transition:background .12s}}
</style>
</head>
<body>

<header>
  <h1>CLUBHOUSE</h1>
  <p>Pick six holes before you tee off. A net birdie on one takes half a stroke off, a net eagle a stroke and a half. Nothing on any of the six costs you half.</p>
</header>

<main>
  <div id="whoBox">
    <label class="namelab" for="who">Your name</label>
    <input id="who" type="text" autocomplete="name" placeholder="Rob Tanenbaum">
  </div>
  <div id="pickWho"></div>
  <div id="slots"></div>
  <div id="oppBox"></div>
  <div id="fieldNote"></div>
  <p id="elsewhere"><a href="index.html">Clubhouse home</a> &middot; <a href="leaderboard.html">Leaderboard</a></p>
</main>

<div id="tray"><div class="inner">
  <p id="summary">Pick one par 4 on each nine, then two par 3s and two par 5s.</p>
  <a id="sendsms" role="button" aria-disabled="true">Text my picks</a>
  <button id="send" disabled>Copy my picks instead</button>
  <p id="copied"></p>
</div></div>

<script src="engine.js"></script>
<script src="fieldlink.js"></script>
<script>
/**
 * Where a completed card is filed, on top of the text message.
 *
 * WHY. Sixteen men texting sixteen lines meant sixteen copy-switch-paste-check
 * cycles before a round could be scored. Filed here instead, they land in one
 * column of a Google Sheet and paste into Setup > Paste birdie picks in a
 * single action. Nothing about the scoring changes; this only replaces the
 * fetching and carrying.
 *
 * WHAT IT DOES NOT DO. The browser is not allowed to read Google's reply, so
 * this CANNOT confirm the row landed. It is deliberately silent: telling a man
 * "sent" when nothing was sent is worse than telling him nothing. The text
 * message remains his receipt and the authority — if the Sheet and a text ever
 * disagree, the text wins.
 *
 * Sent with sendBeacon because the tap that files the card is the same tap that
 * leaves for Messages, and an ordinary request dies with the page.
 */
const E = window.ClubhouseEngine;

const FORM_POST = "https://docs.google.com/forms/d/e/1FAIpQLSdbtFLO94Gq1RYC2-YJm-pDK1OMuBy8kzdkvY7MvfmOh8Fnuw/formResponse";
const FORM_FIELD = "entry.1094711796";

/**
 * The four boxes, and what each one asks for.
 *
 * Par 4s are still split front and back. THE PAR 3s AND PAR 5s NOW FLOAT across
 * the whole course and take TWO picks each, because once Agony Alley (4, 5, 6)
 * and Easy Street (11, 12, 13) have taken their holes there are only three par
 * 3s and three par 5s left — and splitting three across two nines leaves a box
 * with one hole in it, which is not a choice.
 *
 * `keys` is the slot the engine files each pick under, and their ORDER is the
 * order the six numbers are written in the message. That order is the only
 * thing the parser at the other end has to go on, so it must match the engine's
 * PICK_SLOTS exactly: front par 4, back par 4, par 3, par 3, par 5, par 5.
 */
const SLOTS = [
  { label: "Front nine \u00b7 par 4", holes: [1, 2, 9],    pick: 1, keys: ["p4f"] },
  { label: "Back nine \u00b7 par 4",  holes: [10, 14, 15], pick: 1, keys: ["p4b"] },
  { label: "Par 3s \u00b7 pick two",  holes: [3, 8, 17],   pick: 2, keys: ["p3a", "p3b"] },
  { label: "Par 5s \u00b7 pick two",  holes: [7, 16, 18],  pick: 2, keys: ["p5a", "p5b"] }
];
const TOTAL_PICKS = SLOTS.reduce((n, s) => n + s.pick, 0);

/** Holes chosen in each box, oldest first, so a third tap knows what to drop. */
const chosen = SLOTS.map(() => []);

const slotsEl = document.getElementById("slots");
SLOTS.forEach((s, si) => {
  const sec = document.createElement("section");
  sec.className = "pick";
  const h = document.createElement("h2"); h.textContent = s.label; sec.appendChild(h);
  const row = document.createElement("div"); row.className = "holes";

  const paint = () => {
    row.querySelectorAll(".hole").forEach((b) => {
      b.setAttribute("aria-pressed", String(chosen[si].indexOf(Number(b.dataset.hole)) !== -1));
    });
  };

  s.holes.forEach((n) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "hole"; b.dataset.hole = String(n);
    b.setAttribute("aria-pressed", "false");
    b.textContent = "Hole " + n;
    b.addEventListener("click", () => {
      const at = chosen[si].indexOf(n);
      if (at !== -1) {
        // Tapping a chosen hole again lets it go. In a pick-one box that would
        // leave the box empty, which is worse than useless — there he can only
        // ever change his mind TO another hole, never to nothing.
        if (s.pick > 1) chosen[si].splice(at, 1);
      } else {
        chosen[si].push(n);
        // One too many: the OLDEST goes, so a man who taps a third hole gets
        // the third one he asked for rather than being refused. Refusing would
        // be read as a broken button.
        while (chosen[si].length > s.pick) chosen[si].shift();
      }
      paint();
      refresh();
    });
    row.appendChild(b);
  });
  sec.appendChild(row);
  slotsEl.appendChild(sec);
});

/** Every pick in slot order, lowest hole first inside a two-pick box. */
function picksInOrder(){
  const out = [];
  SLOTS.forEach((s, si) => {
    // Sorted, so the same two holes always write the same message however they
    // were tapped — the message is the record, and it should not depend on the
    // order a man's finger happened to move.
    const holes = chosen[si].slice().sort((a, b) => a - b);
    for (let k = 0; k < s.pick; k++) out.push(holes[k] == null ? null : holes[k]);
  });
  return out;
}

/* ---------- what the link brought, if anything ----------

   THREE WAYS THIS PAGE CAN BE OPENED, and it has to be right in all of them.

   · HIS OWN INVITATION (?p=) — his name and his six opponents, worked out
     before the link was built. The one Rob texts. It carries NO handicap
     index: the bands were decided against his own index, which stayed behind
     on the phone that made it.
   · THE WHOLE FIELD (?f=) — every player and his index, from which the page
     works out anybody's opponents. Longer, and it grows with the field.
   · PLAINLY, with neither. Type your name, pick your holes, no opponent box.
     Not every round has a field ready when the sheet goes out, and this is
     what the page has always done.

   ONE LINK SERVES BOTH CONTESTS. The holes need nothing but the course, which
   this page already knows, so a man taps once for Watch the Birdie and the Hit
   List together. */
const FL = window.ClubhouseFieldLink;
const INVITE = (() => {
  const where = location.search || location.href;
  const man = FL.manFromUrl(where);
  if (man.ok) return { kind: "man", name: man.man.name, six: man.man.six };
  const field = FL.fieldFromUrl(where);
  if (field.ok) return { kind: "field", made: field.field.made, players: field.field.players };
  return null;
})();

let me = INVITE && INVITE.kind === "man" ? { name: INVITE.name, index: null } : null;
let opponent = null;

const whoBox = document.getElementById("whoBox");
const pickWho = document.getElementById("pickWho");
const oppBox = document.getElementById("oppBox");
const fieldNote = document.getElementById("fieldNote");

const esc = (t) => String(t == null ? "" : t)
  .replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const idx = (v) => v == null ? "" : E.formatHandicapIndex(v);

function drawField(){
  if(!INVITE){ pickWho.innerHTML = ""; fieldNote.innerHTML = ""; return; }
  whoBox.style.display = "none";

  if(INVITE.kind === "man"){
    // His name came with the link. There is nothing to choose and nothing to
    // type — the one thing a man cannot get wrong about himself.
    pickWho.innerHTML = `<div class="mine">${esc(me.name)}</div>`;
    fieldNote.innerHTML =
      `This is your own sheet. If the name above is not you, ask for your own link.`;
    return;
  }

  if(me){
    pickWho.innerHTML =
      `<div class="mine">${esc(me.name)}${me.index == null ? "" : " \u00b7 " + idx(me.index)}` +
      `<button type="button" id="notMe">Not you? Tap to change</button></div>`;
    document.getElementById("notMe").addEventListener("click", () => {
      me = null; opponent = null; drawField(); drawOpponent(); refresh();
    });
  } else {
    pickWho.innerHTML =
      `<label class="namelab">Tap your name</label>` +
      INVITE.players.map((p, i) =>
        `<button type="button" class="who" data-i="${i}">${esc(p.name)}` +
        `<span class="idx">${idx(p.index) || "no handicap index"}</span></button>`).join("");
    pickWho.querySelectorAll("button[data-i]").forEach(b =>
      b.addEventListener("click", () => {
        me = INVITE.players[Number(b.dataset.i)];
        opponent = null;
        drawField(); drawOpponent(); refresh();
      }));
  }

  fieldNote.innerHTML =
    `This list was made <b>${esc(INVITE.made || "at some point")}</b> and has ` +
    `<b>${INVITE.players.length}</b> players in it. If somebody is missing, ask ` +
    `for a newer link — naming a man who does not play pays nothing.`;
}

/**
 * The men he may name.
 *
 * From HIS OWN LINK they arrive already decided, bands and all, and the page
 * does no arithmetic — it cannot, because no index travelled.
 *
 * From a field link the page works them out with the ENGINE's own rule. Never a
 * second copy of it: a page that recommends a man the app then refuses is the
 * worst outcome available here.
 */
function opponentsFor(){
  if(!INVITE) return [];
  if(INVITE.kind === "man") return INVITE.six.map(o => ({ name: o.name, said: FL.bandWords(o.band) }));
  if(!me) return [];
  const others = INVITE.players.filter(p => p !== me && p.index != null);
  const band = E.DEFAULT_CONTESTS.hitList.equalBand;
  const howMany = E.DEFAULT_CONTESTS.hitList.offer;
  return E.nearestByIndex(me.index, others, howMany).map(o => ({
    name: o.name,
    said: me.index == null || o.index == null ? "an equal handicap"
      : Math.abs(me.index - o.index) <= band ? "an equal handicap"
      : o.index < me.index ? "a lower handicap" : "a higher handicap",
    index: o.index,
  }));
}

function drawOpponent(){
  if(!INVITE || !me){ oppBox.innerHTML = ""; return; }
  const list = opponentsFor();
  oppBox.innerHTML =
    `<section class="pick"><h2>Hit List \u00b7 pick one</h2>` +
    `<div style="font-size:16px;color:var(--quiet);margin:-6px 0 12px">` +
      `Back yourself to post the better net score. Beating a better player pays ` +
      `more, so the easy pick is not the best one.</div>` +
    (list.length === 0
      ? `<div style="font-size:17px">Nobody to name in this round.</div>`
      : list.map(o =>
          `<button type="button" class="who" data-opp="${esc(o.name)}"` +
          ` aria-pressed="${opponent && opponent.name === o.name}">${esc(o.name)}` +
          `<span class="idx">${esc(o.said)}</span></button>`).join("")) +
    `</section>`;
  oppBox.querySelectorAll("button[data-opp]").forEach(b =>
    b.addEventListener("click", () => {
      const name = b.dataset.opp;
      opponent = opponent && opponent.name === name ? null : list.find(o => o.name === name) || null;
      drawOpponent(); refresh();
    }));
}

const who = document.getElementById("who");
const tray = document.getElementById("tray");
const summary = document.getElementById("summary");
const sendsms = document.getElementById("sendsms");
const send = document.getElementById("send");
const copied = document.getElementById("copied");

function line(){
  const name = me ? me.name : (who.value.trim() || "(no name)");
  const first = name + " — " + picksInOrder().join(", ");
  // THE TARGET GOES ON ITS OWN LINE, LABELLED. A block of these is pasted in
  // one go, and without the label a bare name is indistinguishable from the
  // start of the next man's entry.
  return opponent ? first + "\n" + "Hit List: " + opponent.name : first;
}

/**
 * The separator before `body` is NOT the same on the two phones the men carry.
 * With no recipient in the address, iOS reads `sms:&body=...` and Android reads
 * `sms:?body=...`; each ignores the other's form and opens Messages with an
 * EMPTY box. That fails silently — the man thinks he has sent his picks and has
 * sent nothing — so the platform is sniffed rather than guessed at.
 *
 * No recipient is filled in. There is no number in this file to put there, and
 * a wrong one would be worse than a blank one.
 */
function smsHref(text){
  const ua = navigator.userAgent || "";
  // Android is ruled out FIRST and on the user agent alone. The second clause
  // below catches an iPad, which since iPadOS 13 reports itself as "MacIntel"
  // with a touch screen — but so does any Mac browser pretending to be a phone,
  // and that made an Android device come out as an iPhone under test.
  const ios = !/Android/i.test(ua) &&
              (/iPhone|iPad|iPod/i.test(ua) ||
               (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1));
  return "sms:" + (ios ? "&" : "?") + "body=" + encodeURIComponent(text);
}

function refresh(){
  const n = picksInOrder().filter(h => h != null).length;
  const named = me ? true : who.value.trim().length > 0;
  // An opponent is only ASKED FOR when the link brought somebody to name.
  const wantsOpponent = !!(INVITE && me && opponentsFor().length > 0);
  let ready = false;
  if (INVITE && INVITE.kind === "field" && !me) {
    summary.textContent = "Tap your name in the list first.";
  } else if (n < TOTAL_PICKS) {
    summary.textContent = n + " of " + TOTAL_PICKS + " picked.";
  } else if (!named) {
    summary.textContent = "All " + TOTAL_PICKS + " picked. Add your name above.";
  } else if (wantsOpponent && !opponent) {
    summary.textContent = "All " + TOTAL_PICKS + " picked. Now pick your Hit List man.";
  } else {
    summary.textContent = line();
    ready = true;
  }
  send.disabled = !ready;
  // An anchor with no href is not clickable and not focusable, which is exactly
  // the disabled behaviour wanted — aria-disabled only tells the screen reader.
  if (ready) sendsms.href = smsHref(line());
  else sendsms.removeAttribute("href");
  sendsms.setAttribute("aria-disabled", ready ? "false" : "true");
  // iOS puts up "Open in Messages?" before handing over to another app. It
  // cannot be suppressed from a web page, and an unexplained dialog is exactly
  // where a man stops and puts the phone down. So it is announced beforehand.
  copied.textContent = ready ? "Your phone will ask to open Messages. Tap Open." : "";
  fitTray();
}

/**
 * The tray is fixed to the bottom of the screen, so the page must reserve
 * exactly as much room underneath as the tray occupies. It was a hard-coded
 * 140px, and when the tray grew, the sixth pick box ended up UNDERNEATH it —
 * unreachable on a small phone, no matter how far you scrolled.
 *
 * So it is measured, not guessed: the tray's real height, plus the safe area it
 * already includes, plus a thumb's worth of clearance. It cannot drift again.
 */
function fitTray(){
  // Measured twice: once now, once on the next frame. On a rotation the tray's
  // new height is not settled when the event fires, and a single measurement
  // reserves the OLD height — which is the whole bug, one frame later. Setting
  // body padding cannot itself change the tray, so this does not loop.
  const set = () => {
    document.body.style.paddingBottom = Math.max(160, tray.offsetHeight + 28) + "px";
  };
  set();
  requestAnimationFrame(set);
}
fitTray();
addEventListener("resize", fitTray);
addEventListener("orientationchange", fitTray);
// The tray changes height on its own: the hint line appears when the card is
// complete, and the summary wraps to two lines for a long name.
if (window.ResizeObserver) new ResizeObserver(fitTray).observe(tray);

who.addEventListener("input", refresh);
drawField();
drawOpponent();
refresh();

/**
 * THE SAME CARD, ON ONE LINE, for the Google Sheet.
 *
 * The text message is two lines and stays that way — the label is what tells a
 * target apart from the next man's name in a pasted block. But a newline INSIDE
 * a Sheet cell is a trap: copying that column wraps every cell in quotes, so
 * the name arrives as `"Eli Marsden` and matches nobody. Every row fails, and
 * it fails at the paste rather than at the send, where nobody is looking.
 *
 * One line here, with the label kept so the parser reads it either way.
 */
function filedLine(){
  const both = line().split("\n");
  return both.length > 1 ? both[0] + " \u00b7 " + both[1] : both[0];
}

/**
 * File the card. Sending the same line twice does nothing — a man who taps the
 * text button and then the copy button has not changed his mind. A man who
 * CHANGES a pick and taps again files a second row, on purpose: it is stamped
 * later than the first, so the last one is the one that counts.
 */
let filed = "";
function fileWithRob(text){
  if (text === filed) return;
  filed = text;
  const body = new URLSearchParams();
  body.set(FORM_FIELD, text);
  try {
    if (navigator.sendBeacon) navigator.sendBeacon(FORM_POST, body);
    else fetch(FORM_POST, { method: "POST", mode: "no-cors", keepalive: true, body: body });
  } catch (e) {
    // No signal, or the phone refused. He still has the text message, which is
    // the path that was always going to work. Nothing to tell him.
  }
}

// Filed on the way out to Messages, and on the copy fallback too — a man who
// copies and texts by hand should not go missing from the Sheet.
sendsms.addEventListener("click", () => {
  if (sendsms.getAttribute("href")) fileWithRob(filedLine());
});

send.addEventListener("click", async () => {
  const text = line();
  fileWithRob(filedLine());
  try {
    await navigator.clipboard.writeText(text);
    copied.textContent = "Copied. Now text it to Rob.";
  } catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); ta.remove();
    copied.textContent = "Copied. Now text it to Rob.";
  }
});
</script>
</body>
</html>
